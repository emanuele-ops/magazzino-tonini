<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%238a6d4e'/%3E%3Ctext x='20' y='27' font-family='Georgia' font-size='16' fill='white' text-anchor='middle' font-weight='bold'%3EAT%3C/text%3E%3C/svg%3E">
<title>Magazzino Atelier Tonini</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --accent:#8a6d4e;--accent-light:#f0e9e0;
    --green:#5c6b4f;--green-light:#eaeee3;
    --red:#a4513f;--red-light:#f4e6e1;
    --amber:#b08534;--amber-light:#f6eedd;
    --gray:#7a736b;--border:#e7e1d7;--white:#fff;
    --bg:#f7f4ee;--ink:#3a342d;--radius:16px
  }
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}

  #app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  main{flex:1;overflow:auto;padding:26px 30px}

  .sidebar-header{padding:22px 18px 16px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent)}
  .sidebar-header small{color:var(--gray);font-size:11px;display:block;margin-top:4px}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 18px;color:var(--gray);text-decoration:none;font-size:13.5px;cursor:pointer;transition:.15s}
  nav a:hover{background:var(--accent-light);color:var(--ink)}
  nav a.active{background:var(--accent-light);color:var(--accent);font-weight:600;border-left:3px solid var(--accent)}
  .nav-dot{width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.55;flex-shrink:0}
  .nav-badge{margin-left:auto;background:var(--red-light);color:var(--red);font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
  .sidebar-footer{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border)}
  .btn-nuovo{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:600;font-size:13.5px}
  .btn-nuovo:hover{background:#74583c}

  .page-title{font-size:22px;margin-bottom:20px;color:var(--ink)}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 3px rgba(80,60,40,.05)}
  .card-title{font-size:14px;font-weight:600;margin-bottom:14px}
  details.acc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 3px rgba(80,60,40,.05);margin-bottom:14px;overflow:hidden}
  details.acc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;user-select:none}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--gray);font-weight:400}
  details.acc[open]>summary::after{content:"\2013"}
  details.acc>summary .sum-badge{margin-left:auto;background:var(--red-light);color:var(--red);font-size:12px;padding:2px 10px;border-radius:11px}
  details.acc[open]>summary .sum-badge{margin-left:0}
  .acc-body{padding:0 20px 18px}
  .big-op{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .big-op button{padding:22px 14px;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(80,60,40,.08)}
  .op-sec{font-family:Georgia,serif;font-size:18px;margin:18px 0 10px}
  .reorder-forn{border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:12px}
  .reorder-forn h4{font-size:14px;font-weight:700;margin-bottom:2px}

  .stat{display:flex;justify-content:space-between;align-items:flex-start}
  .stat-label{font-size:11.5px;color:var(--gray);margin-bottom:7px}
  .stat-value{font-size:30px;font-weight:600;line-height:1}
  .stat-sub{font-size:11px;color:var(--gray);margin-top:6px}
  .ico-tile{min-width:46px;height:46px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}

  .qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .qa{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:0 1px 3px rgba(80,60,40,.05);transition:.15s;display:flex;align-items:center;gap:14px}
  .qa:hover{box-shadow:0 6px 18px rgba(80,60,40,.12);transform:translateY(-2px)}
  .qa-txt b{display:block;font-size:14px;font-weight:600}
  .qa-txt span{font-size:11.5px;color:var(--gray)}

  .alert{padding:14px 18px;border-radius:var(--radius);margin-bottom:20px;font-size:13px}
  .alert-red{background:var(--red-light);border:1px solid #e6c4b8;color:var(--red)}
  .alert-amber{background:var(--amber-light);border:1px solid #e6cf9f;color:#7c5a16}
  .alert-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;cursor:pointer}
  .alert-row+.alert-row{border-top:1px solid rgba(0,0,0,.06)}

  .table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--white)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{background:#faf8f4}
  th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
  td{padding:11px 14px;border-bottom:1px solid var(--border)}
  tbody tr{cursor:pointer}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#faf8f4}

  .badge{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600}
  .badge-green{background:var(--green-light);color:var(--green)}
  .badge-red{background:var(--red-light);color:var(--red)}
  .badge-amber{background:var(--amber-light);color:#7c5a16}
  .badge-accent{background:var(--accent-light);color:var(--accent)}
  .badge-gray{background:#efebe3;color:var(--gray)}

  .btn{padding:6px 12px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
  .btn-green{background:var(--green-light);color:var(--green)}
  .btn-red{background:var(--red-light);color:var(--red)}
  .btn-accent{background:var(--accent-light);color:var(--accent)}
  .btn-ghost{background:#efebe3;color:var(--gray);border:1px solid var(--border)}

  .bar-wrap{height:7px;background:#ece6dc;border-radius:5px;overflow:hidden}
  .bar-fill{height:7px;border-radius:5px}

  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .filters input,.filters select{padding:10px 12px;border:1px solid var(--border);border-radius:11px;font-size:13px;background:#fff;outline:none}
  .filters input{flex:1;min-width:140px}
  .filters input:focus,.filters select:focus{border-color:var(--accent)}
  .combo-list{position:absolute;z-index:60;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:3px;max-height:220px;overflow:auto;box-shadow:0 8px 22px rgba(60,45,30,.16)}
  .combo-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
  .combo-item:last-child{border-bottom:none}
  .combo-item:hover{background:var(--accent-light)}

  .piece-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .piece{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(80,60,40,.05);position:relative}
  .piece-row{display:flex;gap:11px;align-items:flex-start}
  .piece-thumb{width:60px;height:60px;flex-shrink:0;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
  .piece-body{flex:1;min-width:0;padding-right:18px}
  .sel-chk{position:absolute;top:10px;right:10px;width:20px;height:20px;cursor:pointer;accent-color:var(--accent)}
  #bulk-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:940;background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;display:none;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13px;font-weight:600}
  #bulk-bar button{border:none;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
  .piece:hover{box-shadow:0 5px 14px rgba(80,60,40,.10);transform:translateY(-1px)}
  .piece h4{font-size:14px;font-weight:600;margin-bottom:3px}
  .piece small{color:var(--gray);font-size:11px;display:block;margin-bottom:9px}

  .modal-overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
  .modal{background:#fff;border-radius:18px;padding:24px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
  .modal h2{font-size:18px;margin-bottom:18px}
  .modal-close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray);margin-top:-6px}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;color:var(--gray);margin-bottom:5px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;outline:none;font-family:inherit}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .btn-primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:600;font-size:14.5px;margin-top:6px}
  .btn-primary:hover{background:#74583c}
  .toggle{display:flex;gap:9px;margin-bottom:15px}
  .toggle button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--border);cursor:pointer;font-weight:600;font-size:13px;background:#faf8f4;color:var(--gray)}
  .toggle button.on-green{background:var(--green-light);color:var(--green);border-color:#b9c4a8}
  .toggle button.on-red{background:var(--red-light);color:var(--red);border-color:#e0bbac}
  .toggle button.on-accent{background:var(--accent-light);color:var(--accent);border-color:#d6c3aa}
  .info-box{background:#faf8f4;border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--gray);margin-bottom:12px}
  .err-box{background:var(--red-light);border:1px solid #e6c4b8;color:var(--red);padding:10px 13px;border-radius:11px;font-size:13px;margin-bottom:12px}

  .det-tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:11px;padding:3px 11px;border-radius:11px;font-weight:600;margin-bottom:10px}
  .det-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .det-row span:first-child{color:var(--gray)}
  .det-row span:last-child{font-weight:600;text-align:right}
  .det-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
  .det-hist{margin-top:16px}
  .det-hist h4{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);margin-bottom:8px}
  .det-mov{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}

  #toast{position:fixed;bottom:26px;right:26px;z-index:9999;padding:13px 20px;border-radius:12px;font-weight:600;font-size:13px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  #toast.ok{background:var(--green-light);color:var(--green);border:1px solid #b9c4a8}
  #toast.err{background:var(--red-light);color:var(--red);border:1px solid #e0bbac}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid #ece6dc;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-page{display:flex;align-items:center;justify-content:center;min-height:240px;color:var(--gray)}

  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .qr-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center}
  .qr-card img{width:130px;height:130px}
  .qr-id{font-family:monospace;font-size:12px;font-weight:600;margin-top:6px}

  .mobile-nav{display:none}
  .fab{display:none}
  #ver-badge{position:fixed;top:8px;right:54px;z-index:950;font-size:10px;color:var(--gray);background:var(--white);border:1px solid var(--border);padding:3px 9px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #btn-refresh{position:fixed;top:6px;right:10px;z-index:952;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:18px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
  #btn-backup{position:fixed;bottom:18px;right:18px;z-index:951;height:42px;padding:0 14px;border-radius:22px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);cursor:pointer;font-size:14px;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
  #btn-restore{position:fixed;bottom:18px;right:150px;z-index:951;height:42px;padding:0 14px;border-radius:22px;background:#fff;color:var(--gray);border:1.5px solid var(--border);cursor:pointer;font-size:14px;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
  #btn-backup:hover{background:var(--accent);color:#fff}
  #btn-restore:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:768px){#btn-backup{bottom:150px;right:14px;padding:0;width:42px;border-radius:50%}#btn-backup .bk-txt{display:none}#btn-restore{bottom:200px;right:14px;padding:0;width:42px;border-radius:50%}#btn-restore .bk-txt{display:none}}
  #btn-refresh:hover{background:#74583c}
  #btn-refresh.spin-on{animation:spin .7s linear infinite}
  @media(max-width:680px){
    aside{display:none}
    main{padding:16px 14px 86px}
    .table-wrap{overflow-x:auto}
    table{min-width:600px}
    .grid-4{grid-template-columns:1fr 1fr}
    .grid-2,.grid-3,.qa-grid{grid-template-columns:1fr}
    .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:900;height:62px}
    .mobile-nav a{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:5px 0;font-size:9px;color:var(--gray);text-decoration:none;font-weight:600;text-align:center}
    .mobile-nav a.active{color:var(--accent)}
    .mn-dot{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.6}
    .fab{display:flex;align-items:center;justify-content:center;position:fixed;bottom:74px;right:16px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:32px;line-height:1;cursor:pointer;z-index:901;box-shadow:0 4px 14px rgba(0,0,0,.3)}
    #bulk-bar{bottom:74px;width:calc(100% - 28px);justify-content:center}
  }
  #print-area{display:none}
  @media print{aside,.mobile-nav,.fab,#toast,.qr-toolbar,#ver-badge,#btn-refresh,#btn-backup,#btn-restore{display:none!important}main{padding:0!important}.qr-grid{grid-template-columns:repeat(3,1fr)}.qr-card{break-inside:avoid;border:1px solid #000}
    body.printing #app,body.printing #toast,body.printing #modal-container,body.printing #bulk-bar,body.printing #ver-badge{display:none!important}
    body.printing #print-area{display:block!important;padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="sidebar-header" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      <img id="side-logo" alt="Atelier Tonini" style="height:30px">
      <small id="sidebar-utente">Caricamento...</small>
      <small id="logout-link" onclick="doLogout()" style="display:block;margin-top:3px;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:11px">Esci</small>
    </div>
    <nav id="sidebar-nav">
      <a class="active" data-page="dashboard"><span class="nav-dot"></span>Dashboard</a>
      <a data-page="articoli"><span class="nav-dot"></span>Articoli</a>
      <a data-page="pannelli"><span class="nav-dot"></span>Pannelli</a>
      <a data-page="massicci"><span class="nav-dot"></span>Massicci</a>
      <a data-page="voci"><span class="nav-dot"></span>Altre voci</a>
      <a data-page="movimenti"><span class="nav-dot"></span>Movimenti</a>
      <a data-page="report"><span class="nav-dot"></span>Report</a>
      <a data-page="ordini"><span class="nav-dot"></span>Crea ordine</a>
      <a data-page="evasi"><span class="nav-dot"></span>Ordini</a>
      <a data-page="destinati"><span class="nav-dot"></span>Destinati commesse</a>
      <a data-page="fornitori"><span class="nav-dot"></span>Fornitori</a>
      <a data-page="commesse"><span class="nav-dot"></span>Commesse</a>
      <a data-page="offerte"><span class="nav-dot"></span>Offerte</a>
      <a data-page="modelli"><span class="nav-dot"></span>Modelli documenti</a>
      <a data-page="qr"><span class="nav-dot"></span>QR Code</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-nuovo" onclick="openSceltaAzione()">+ Nuova operazione</button>
    </div>
  </aside>

  <main id="main-content">
    <div class="loading-page"><span class="spinner"></span>Caricamento...</div>
  </main>

  <nav class="mobile-nav">
    <a class="active" data-page="dashboard"><span class="mn-dot"></span>Home</a>
    <a data-page="articoli"><span class="mn-dot"></span>Articoli</a>
    <a data-page="pannelli"><span class="mn-dot"></span>Pannelli</a>
    <a data-page="massicci"><span class="mn-dot"></span>Massicci</a>
    <a data-page="movimenti"><span class="mn-dot"></span>Movim.</a>
    <a onclick="openMobileMenu()"><span class="mn-dot"></span>Altro</a>
  </nav>
  <button class="fab" onclick="openSceltaAzione()" aria-label="Nuova operazione">+</button>
  <button id="btn-backup" title="Scarica backup completo" aria-label="Backup" onclick="scaricaBackup()"><span style="font-size:18px">&#128190;</span><span class="bk-txt">Backup</span></button>
  <button id="btn-restore" title="Ripristina da un file di backup" aria-label="Ripristina" onclick="apriRipristino()"><span style="font-size:16px">&#8634;</span><span class="bk-txt">Ripristina</span></button>
  <input type="file" id="restore-file" accept=".json" style="display:none" onchange="ripristinaBackup(this)">
  <button id="btn-refresh" title="Aggiorna e ricarica" aria-label="Aggiorna" onclick="refreshApp()">&#x21bb;</button>
  <div id="ver-badge">v52 - Atelier</div>
</div>

<div id="bulk-bar"></div>
<div id="print-area"></div>
<div id="toast"></div>
<div id="modal-container"></div>

<script>
window.onerror = function(msg, src, line, col){
  var m = document.getElementById("main-content");
  if (m) m.innerHTML =
    '<div style="padding:24px;font-family:monospace;color:#a4513f;line-height:1.7;font-size:13px">'
    + 'Errore JavaScript: ' + msg + '<br>riga ' + line + ', colonna ' + col + '</div>';
  return true;
};
</script>

<script>
let STATE = { articoli:[], pannelli:[], massicci:[], movimenti:[], commesse:[], fornitori:[], fabbisogni:[], modelli:[], immagini:[], ordini:[], riserve:[], voci:[], utente:{}, pagina:"dashboard" };
const CAT_VOCI = ["Conto lavorazione","Forniture di terzi","Componenti","Trasporti","Manutenzioni","Pasti e trasferte","Noleggi","Servizi e consulenze","Altro"];
let CURRENT_DETAIL=null;
let QR_TARGET = null, APP_URL = "";
let SEL = {}, SELTIPO = null, QRSEL = {};

function loadAll() {
  try{var sl=document.getElementById("side-logo");if(sl)sl.src=LOGO_IMG;}catch(e){}
  const sc = fn => call(fn).catch(e => ({ __err: String((e && e.message) || e) }));
  Promise.all([sc("getArticoli"),sc("getPannelli"),sc("getMassicci"),sc("getMovimenti"),sc("getCommesse"),sc("getFornitori"),sc("getFabbisogno"),sc("getModelli"),sc("getImmagini"),sc("getOrdini"),sc("getUtenteCorrente"),sc("getRiserve"),sc("getVoci")])
  .then(res => {
    const errs = [];
    const ok = (v,name,def) => { if (v && v.__err) { errs.push(name); return def; } return (v==null?def:v); };
    STATE.articoli  = ok(res[0],"Articoli",[]);
    STATE.pannelli  = ok(res[1],"Pannelli",[]);
    STATE.massicci  = ok(res[2],"Massicci",[]);
    STATE.movimenti = ok(res[3],"Movimenti",[]);
    STATE.commesse  = ok(res[4],"Commesse",[]);
    STATE.fornitori = ok(res[5],"Fornitori",[]);
    STATE.fabbisogni= ok(res[6],"Fabbisogni",[]);
    STATE.modelli   = ok(res[7],"Modelli",[]);
    STATE.immagini  = ok(res[8],"Immagini",[]);
    STATE.ordini    = ok(res[9],"Ordini",[]);
    STATE.utente    = ok(res[10],"Utente",{});
    STATE.riserve   = ok(res[11],"Riserve",[]);
    STATE.voci      = ok(res[12],"Altre voci",[]);
    const u = STATE.utente || {};
    // Login Supabase
    if (u.autorizzato === "__login__") {
      document.getElementById("main-content").innerHTML =
        '<div class="card" style="max-width:380px;margin:80px auto;text-align:center"><h2 style="margin-bottom:18px;font-family:Georgia,serif;color:var(--accent)">Accedi al Magazzino</h2><div class="form-group"><label>Email</label><input id="lg-email" type="email" placeholder="nome@ateliertonini.it"></div><div class="form-group"><label>Password</label><input id="lg-pwd" type="password" placeholder="••••••"></div><div id="lg-err" style="color:var(--red);font-size:13px;margin-bottom:8px"></div><button class="btn-primary" onclick="doLogin()">Entra</button></div>';
      document.querySelector("aside").style.display="none";
      document.querySelector(".mobile-nav").style.display="none";
      document.querySelector(".fab").style.display="none";
      var bb=document.getElementById("btn-backup");if(bb)bb.style.display="none";
      var bbr=document.getElementById("btn-restore");if(bbr)bbr.style.display="none";
      var br=document.getElementById("btn-refresh");if(br)br.style.display="none";
      return;
    }
    const su = document.getElementById("sidebar-utente"); if (su) su.textContent = (u.Nome||"Utente")+" - "+(u.Ruolo||"");
    adattaRuolo(u.Ruolo);
    const sotto = STATE.articoli.filter(a=>+a.Stock<=+a.SogliaRiordino).length;
    const navD = document.querySelector("#sidebar-nav a[data-page='dashboard']");
    if (sotto>0 && navD) navD.innerHTML += '<span class="nav-badge">'+sotto+'</span>';
    STATE.pagina = "dashboard";
    try { renderPage("dashboard"); }
    catch (e) { document.getElementById("main-content").innerHTML='<div class="card">Errore nel disegno: '+((e&&e.message)||e)+'</div>'; }
    if (errs.length) toast("Non caricati: "+errs.join(", ")+". Ripubblica il Code.gs.","err");
    if (QR_TARGET) setTimeout(()=>openDettaglioById(QR_TARGET), 250);
  })
  .catch(e => {
    const m=document.getElementById("main-content");
    if(m) m.innerHTML='<div class="card">Errore di caricamento dal database Supabase.<br><br>Dettaglio: '+((e&&e.message)||e)+'</div>';
  });
  call("getWebAppUrl").then(u=>{APP_URL=u||"";}).catch(()=>{APP_URL="";});
}

// Operator: nasconde le voci gestionali, lascia l'essenziale
function adattaRuolo(ruolo){
  if(ruolo!=="operator")return;
  ["report","qr","ordini","modelli","evasi","fornitori","commesse","offerte","destinati","voci"].forEach(p=>{
    const a=document.querySelector("#sidebar-nav a[data-page='"+p+"']"); if(a)a.style.display="none";
    const b=document.querySelector(".mobile-nav a[data-page='"+p+"']"); if(b)b.style.display="none";
  });
}

function navTo(page){ clearSel(true); STATE.pagina=page; document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.page===page)); renderPage(page); }
function famTog(el){const g=el.nextElementSibling;if(!g)return;const c=el.querySelector(".fam-c");const hide=g.style.display!=="none";g.style.display=hide?"none":"";if(c)c.textContent=hide?"▸":"▾";}
function collassaFam(){document.querySelectorAll("#main-content .piece-grid").forEach(g=>{const h=g.previousElementSibling;if(h&&h.querySelector&&h.querySelector(".fam-c")){g.style.display="none";}});document.querySelectorAll("#main-content .fam-c").forEach(c=>{c.textContent="▸";});}

// Menu completo per mobile: rende raggiungibili tutte le sezioni
function openMobileMenu(){
  const op = STATE.utente.Ruolo==="operator";
  const pages=[["dashboard","Dashboard"],["articoli","Articoli"],["pannelli","Pannelli"],["massicci","Massicci"],["voci","Altre voci"],["movimenti","Movimenti"],["report","Report"],["ordini","Crea ordine"],["evasi","Ordini"],["destinati","Destinati commesse"],["fornitori","Fornitori"],["commesse","Commesse"],["offerte","Offerte"],["modelli","Modelli documenti"],["qr","QR Code"]];
  const hide=op?["report","ordini","evasi","destinati","fornitori","offerte","modelli","qr","voci"]:[];
  const items=pages.filter(p=>hide.indexOf(p[0])<0).map(p=>{const att=STATE.pagina===p[0];return '<button class="det-btn" style="margin-top:0;text-align:left;background:'+(att?'var(--accent-light)':'#faf8f4')+';color:'+(att?'var(--accent)':'var(--ink)')+'" onclick="closeModal();navTo(\''+p[0]+'\')">'+p[1]+'</button>';}).join("");
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Menu</h2><div style="display:flex;flex-direction:column;gap:8px">'+items+'</div></div>');
}

// -- Selezione multipla (flag) --
function toggleSel(ev,tipo,id){ ev.stopPropagation(); if(SELTIPO!==tipo){SEL={};SELTIPO=tipo;} if(SEL[id])delete SEL[id]; else SEL[id]=true; if(!Object.keys(SEL).length)SELTIPO=null; renderBulkBar(); }
function renderBulkBar(){
  const bar=document.getElementById("bulk-bar"); if(!bar)return;
  const ids=Object.keys(SEL);
  if(!ids.length||!SELTIPO){bar.style.display="none";bar.innerHTML="";return;}
  bar.style.display="flex";
  bar.innerHTML='<span>'+ids.length+' selez.</span><button style="background:var(--red);color:#fff" onclick="openScaricoBulk()">Scarica</button><button style="background:#7a2a1e;color:#fff" onclick="confEliminaBulk()">Elimina</button><button style="background:#ffffff33;color:#fff" onclick="clearSel()">Annulla</button>';
}
function confEliminaBulk(){
  const ids=Object.keys(SEL); if(!ids.length)return;
  const lbl=SELTIPO==='pannello'?'pannelli':SELTIPO==='massiccio'?'massicci':'articoli';
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Elimina '+ids.length+' '+lbl+'</h2><div class="alert alert-red">Eliminazione definitiva e non reversibile di '+ids.length+' '+lbl+'.</div><div id="be-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitEliminaBulk()">Elimina definitivamente</button></div>');
}
function submitEliminaBulk(){
  const ids=Object.keys(SEL),tipo=SELTIPO;
  call("eliminaBulk",{tipo:tipo,ids:ids}).then(r=>{if(!r.ok){showErr("be-err",r.err||"Errore");return;}
    closeModal();SEL={};SELTIPO=null;
    Promise.all([call("getPannelli"),call("getMassicci"),call("getArticoli"),call("getMovimenti")]).then(([pn,ms,ar,mv])=>{STATE.pannelli=pn||[];STATE.massicci=ms||[];STATE.articoli=ar||[];STATE.movimenti=mv||[];renderBulkBar();renderPage(STATE.pagina);toast("Eliminati "+ids.length+" elementi");});
  });
}
function clearSel(silent){SEL={};SELTIPO=null;const b=document.getElementById("bulk-bar");if(b){b.style.display="none";b.innerHTML="";}if(!silent)renderPage(STATE.pagina);}
function openScaricoBulk(){
  const ids=Object.keys(SEL); if(!ids.length)return;
  const lbl=SELTIPO==='pannello'?'pannelli':SELTIPO==='massiccio'?'massicci':'articoli';
  const nota=SELTIPO==='articolo'?'(tutto lo stock)':'(tutto il residuo)';
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Scarico '+ids.length+' '+lbl+'</h2>'
    +'<div class="info-box">Verranno scaricati interamente '+ids.length+' '+lbl+' '+nota+', assegnati alla commessa scelta.</div>'
    +'<div class="form-group"><label>Commessa</label><select id="bk-comm" onchange="onCommessaChange(\'bk-comm\')">'+optCommesse()+'</select></div>'
    +'<div class="form-group"><label>Note</label><input id="bk-note"></div><div id="bk-err"></div>'
    +'<button class="btn-primary" style="background:var(--red)" onclick="submitBulk()">Conferma scarico</button></div>');
}
function submitBulk(){
  const ids=Object.keys(SEL),tipo=SELTIPO,c=document.getElementById("bk-comm").value,n=document.getElementById("bk-note").value;
  if(!ids.length){closeModal();return;}
  call("scaricaBulk",{tipo:tipo,ids:ids,commessa:c,note:n}).then(r=>{
    if(!r.ok){showErr("bk-err",r.err||"Errore.");return;}
    const falliti=(r.risultati||[]).filter(x=>!x.ok);
    closeModal(); SEL={};SELTIPO=null;
    Promise.all([call("getPannelli"),call("getMassicci"),call("getArticoli"),call("getMovimenti")]).then(([pn,ms,ar,mv])=>{
      STATE.pannelli=pn||[];STATE.massicci=ms||[];STATE.articoli=ar||[];STATE.movimenti=mv||[];
      renderBulkBar();renderPage(STATE.pagina);
      toast(falliti.length?("Scaricati "+(ids.length-falliti.length)+"/"+ids.length+" ("+falliti.length+" errori)"):("Scaricati "+ids.length+" elementi"),falliti.length?"err":"ok");
    });
  });
}
function renderPage(p){
  const m=document.getElementById("main-content");
  if(p==="dashboard")m.innerHTML=(STATE.utente.Ruolo==="operator")?renderOperatorHome():renderDashboard();
  else if(p==="articoli")m.innerHTML=renderArticoli();
  else if(p==="pannelli")m.innerHTML=renderPannelli();
  else if(p==="massicci")m.innerHTML=renderMassicci();
  else if(p==="movimenti")m.innerHTML=renderMovimenti();
  else if(p==="report")m.innerHTML=renderReport();
  else if(p==="ordini")m.innerHTML=renderOrdini();
  else if(p==="evasi")m.innerHTML=renderOrdiniEvasi();
  else if(p==="destinati")m.innerHTML=renderDestinati();
  else if(p==="fornitori")m.innerHTML=renderFornitori();
  else if(p==="commesse")m.innerHTML=renderCommesse();
  else if(p==="voci")m.innerHTML=renderVoci();
  else if(p==="offerte")m.innerHTML=renderOfferte();
  else if(p==="modelli")m.innerHTML=renderModelli();
  else if(p==="qr")m.innerHTML=renderQR();
  if(p==="articoli"||p==="pannelli"||p==="massicci")collassaFam();
}

async function sbGet(table, params) {
  let url = SB_URL + "/rest/v1/" + table + "?";
  if (params) url += params;
  else url += "select=*";
  const r = await fetch(url, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();

          nuovi.push(mid); rows.push({ id: mid, articolo_id: tipo, lunghezza_mm: L, larghezza_mm: W, spessore_mm: S, m3_originale: m3, m3_residuo: m3, commesse: "", fornitore: forn, data_carico: nowStr(), note: d.Note || "" });
        }

      }

    if (fn === "scaricaMassiccio") {

    async function setRiserva(artId, commessa, delta) {

      } else if (nuovo > 0) {

      return Math.max(0, nuovo);
    }
    async function aggiornaImpegnato(artId, delta, segno) {

      const cur = parseFloat(rows[0].impegnato) || 0, stock = parseFloat(rows[0].stock) || 0;
      let nuovo = (segno === "add") ? cur + (+delta) : cur - (+delta);
      nuovo = Math.max(0, Math.min(round5(nuovo), stock));

      return nuovo;

      const q = parseFloat(rows[0].quantita) || 0;

      if (q > 0) await aggiornaImpegnato(args.artId, q, "sub");

    if (fn === "annullaAssegnazione") {

        const rows = await sbGet("riserve", "select=*&articolo_id=eq." + encodeURIComponent(args.artId) + "&commessa=eq." + encodeURIComponent(args.commessa));
        const cur = rows.length ? (parseFloat(rows[0].quantita) || 0) : 0;
        const q = parseFloat(args.quantita) || cur;
        const rel = Math.min(q, cur);
        if (rel > 0) { await setRiserva(args.artId, args.commessa, -rel); await aggiornaImpegnato(args.artId, rel, "sub"); }
        return { ok: true, liberato: rel };
      }
      const tab = args.tipo === "pannello" ? "pannelli" : "massicci";
      const pezzi = await sbGet(tab, "select=*&articolo_id=eq." + encodeURIComponent(args.artId));
      let freed = 0; const n = parseInt(args.numPezzi) || 0;
      for (const p of pezzi) {
        if (String(p.commesse || "").trim() === String(args.commessa)) {
          if (n && freed >= n) break;
          await sbPatch(tab, "id=eq." + encodeURIComponent(p.id), { commesse: "" });
          freed++;

      }
      return { ok: true, liberati: freed };

      const libero = Math.max(0, round5(stock - imp));
      const q = Math.min(parseFloat(args.quantita) || 0, libero);
      if (q <= 0) return { ok: false, err: "Niente di disponibile da assegnare (libero " + libero + ")." };
      await sbPatch("articoli", "id=eq." + encodeURIComponent(args.artId), { impegnato: round5(imp + q) });

      // Segna i fabbisogni come ordinati
      for (const a of (args.righe || [])) {
        if (a.fabId) await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(a.fabId), { stato: "ordinato" }).catch(()=>{});
      }
      return { ok: true, id, _noemail: true };
    }
    if (fn === "emettiOrdineGenerico") {
      const id = await nextNumeroOrdine();
      const righe = (args.righe || []).map(r => ({ tipo: "generico", artId: "", descrizione: r.descrizione, nome: r.descrizione, dettaglio: (r.quantita || "") + " " + (r.unita || ""), quantita: r.quantita, unita: r.unita || "pz", note: r.note || "" }));
      await sbPost("ordini", { id, data: nowStr(), commessa: "", fornitore: args.fornitore || "", stato: "emesso", righe: JSON.stringify(righe), note: "GENERICO", email: args.email || "" });
      return { ok: true, id, _noemail: true };
    }
    if (fn === "riceviOrdine") {
      const rows = await sbGet("ordini", "select=*&id=eq." + encodeURIComponent(args.id));
      if (!rows.length) return { ok: false, err: "Ordine non trovato." };
      if (String(rows[0].stato).toLowerCase() === "ricevuto") return { ok: false, err: "Ordine già ricevuto." };
      const righe = typeof rows[0].righe === "string" ? JSON.parse(rows[0].righe || "[]") : (rows[0].righe || []);
      const commessa = rows[0].commessa || "", forn = rows[0].fornitore || "";
      for (const r of righe) {
        const num = parseInt(r.numPezzi) || 1, d1 = parseInt(r.dim1) || 0, d2 = parseInt(r.dim2) || 0, d3 = parseInt(r.dim3) || 0, qta = parseFloat(r.quantita) || 0;
        if (r.tipo === "generico") {
          if (qta > 0) await call("registraMovimento", { ArticoloID: r.artId || (await call("salvaArticolo", { Nome: r.nome || r.descrizione, Categoria: "Generici", UnitaMisura: r.unita || "pz", Stock: 0 })).id, Tipo: "carico", Quantita: qta, Fornitore: forn, Note: "Ricezione ordine generico" });
        } else if (r.artId) {
          if (r.tipo === "articolo" && qta > 0) {
            await call("registraMovimento", { ArticoloID: r.artId, Tipo: "carico", Quantita: qta, Fornitore: forn, Commessa: commessa, Note: "Ricezione ordine commessa " + commessa });
            if (commessa) { await aggiornaImpegnato(r.artId, qta, "add"); await setRiserva(r.artId, commessa, qta); }
          } else if (r.tipo === "pannello" && d1 && d2) {
            await call("caricaPannelli", { ArticoloID: r.artId, Larghezza_mm: d1, Altezza_mm: d2, Quantita: num, Fornitore: forn });
          } else if (r.tipo === "massiccio" && d1 && d2 && d3) {
            await call("caricaMassicci", { ArticoloID: r.artId, modo: "misure", Lunghezza_mm: d1, Larghezza_mm: d2, Spessore_mm: d3, Quantita: num, Fornitore: forn });
          }
        }
        if (r.fabId) await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(r.fabId), { stato: "ricevuto" }).catch(()=>{});
        if (r.voceId) await sbPatch("voci_commessa", "id=eq." + encodeURIComponent(r.voceId), { stato: "ricevuto" }).catch(()=>{});
      }
      await sbPatch("ordini", "id=eq." + encodeURIComponent(args.id), { stato: "ricevuto" });
      return { ok: true };
    }
    if (fn === "eliminaOrdine") {
      await sbDelete("ordini", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }
    if (fn === "segnalaOrdine") {
      const rows = await sbGet("ordini", "select=*&id=eq." + encodeURIComponent(args.id));
      if (rows.length) await sbPatch("ordini", "id=eq." + encodeURIComponent(args.id), { note: (rows[0].note || "") + " [SEGNALATO: " + (args.problema || "") + "]" });
      return { ok: true, _noemail: true };
    }


    console.warn("call() funzione non implementata:", fn);
    return { ok: true };
  } catch (e) {
    console.error("Errore call(" + fn + "):", e);
    return { ok: false, err: e.message || String(e) };
  }
}

function buildReportScarico(anno,mese){

  scar.forEach(m=>{

    const ms=String(m.Data).slice(5,7);
    // Cerca l'articolo per ID, oppure per nome (pannelli/massicci hanno il nome in ArticoloID)
    let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);
    if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);
    const cf=(art&&art.CodiceFornitore)||'';
    const k=m.NomeArticolo+'|'+m.UnitaMisura+'|'+cf;
    byC[c]=byC[c]||{}; byC[c][ms]=byC[c][ms]||{};
    byC[c][ms][k]=byC[c][ms][k]||{q:0,pezzi:[],artCode:(art&&/^ART-/.test(art.ID))?art.ID:''};
    byC[c][ms][k].q+=(+m.Quantita||0);

  });
  const body=Object.keys(byC).sort().map(c=>{

function apriRipristino(){
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Ripristina da backup</h2>'
   +'<div class="alert alert-red"><strong>Attenzione:</strong> il ripristino reinserisce i dati dal file di backup nel database. I dati con lo stesso codice verranno <strong>sovrascritti</strong> con quelli del file. I dati creati dopo il backup che non sono nel file resteranno. Consigliato solo per recuperare dati persi.</div>'
   +'<div class="info-box">Scegli un file di backup (.json) scaricato in precedenza con il pulsante Backup.</div>'
   +'<button class="btn-primary" onclick="document.getElementById(\'restore-file\').click()">Scegli file di backup</button>'
   +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Annulla</button></div>');
}
function ripristinaBackup(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch(err){ toast("File non valido: non è un backup JSON","err"); return; }
    if(!data.articoli&&!data.movimenti){ toast("Il file non sembra un backup del magazzino","err"); return; }
    const conteggi=['articoli','pannelli','massicci','movimenti','commesse','fornitori'].map(k=>(data[k]||[]).length+' '+k).join(', ');
    openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Conferma ripristino</h2>'
     +'<div class="info-box">Backup del <strong>'+(data._data?new Date(data._data).toLocaleString('it-IT'):'data sconosciuta')+'</strong><br><br>Contiene: '+conteggi+'</div>'
     +'<div class="alert alert-red">Procedendo, questi dati verranno reinseriti nel database (sovrascrivendo quelli con lo stesso codice). Continuare?</div>'
     +'<div id="rip-prog" style="font-size:13px;color:var(--gray);margin-bottom:8px"></div>'
     +'<button class="btn-primary" style="background:var(--red)" onclick="eseguiRipristino()">Sì, ripristina ora</button>'
     +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Annulla</button></div>');
    window._backupData=data;
  };
  reader.readAsText(file);
  input.value="";
}
async function eseguiRipristino(){
  const data=window._backupData; if(!data)return;
  const prog=document.getElementById("rip-prog");
  const setP=(t)=>{if(prog)prog.textContent=t;};
  const chunk=(arr,n)=>{const o=[];for(let i=0;i<arr.length;i+=n)o.push(arr.slice(i,i+n));return o;};
  async function up(table,rows,label){
    if(!rows||!rows.length)return;
    setP("Ripristino "+label+" ("+rows.length+")...");
    for(const c of chunk(rows,100)){ await sbUpsert(table,c); }
  }
  try{
    // ARTICOLI
    await up("articoli",(data.articoli||[]).map(a=>({id:a.ID,nome:a.Nome,categoria:a.Categoria,unita_misura:a.UnitaMisura,stock:parseFloat(a.Stock)||0,soglia_riordino:parseFloat(a.SogliaRiordino)||0,tipo_riordino:a.TipoRiordino||'manuale',urgenza:a.Urgenza||'media',fornitore:a.Fornitore||'',codice_fornitore:a.CodiceFornitore||'',is_pannello:(a.IsPannello===true||a.IsPannello==='SI'),note:a.Note||'',impegnato:parseFloat(a.Impegnato)||0})),"articoli");
    // FORNITORI
    await up("fornitori",(data.fornitori||[]).map(f=>({nome:f.Nome,email:f.Email||'',telefono:f.Telefono||'',note:f.Note||''})),"fornitori");
    // COMMESSE
    await up("commesse",(data.commesse||[]).map(c=>({id:c.ID,nome:c.Nome,cliente:c.Cliente||'',data_apertura:(c.DataApertura||new Date().toISOString().slice(0,10)),stato:c.Stato||'aperta',note:c.Note||''})),"commesse");
    // PANNELLI
    await up("pannelli",(data.pannelli||[]).map(p=>({id:p.ID,articolo_id:p.ArticoloID,larghezza_mm:p.Larghezza_mm,altezza_mm:p.Altezza_mm,residuale_pct:p.Residuale_pct,m2_originale:p.M2_originale,m2_residuo:p.M2_residuo,commesse:p.Commesse||'',data_carico:p.DataCarico||null,note:p.Note||'',fornitore:p.Fornitore||''})),"pannelli");
    // MASSICCI
    await up("massicci",(data.massicci||[]).map(m=>({id:m.ID,articolo_id:m.ArticoloID,lunghezza_mm:m.Lunghezza_mm||null,larghezza_mm:m.Larghezza_mm||null,spessore_mm:m.Spessore_mm||null,m3_originale:m.M3_originale,m3_residuo:m.M3_residuo,commesse:m.Commesse||'',fornitore:m.Fornitore||'',data_carico:m.DataCarico||null,note:m.Note||''})),"massicci");
    // MOVIMENTI
    await up("movimenti",(data.movimenti||[]).map(m=>({id:m.ID,data:m.Data,utente:m.Utente,articolo_id:m.ArticoloID,nome_articolo:m.NomeArticolo,tipo:m.Tipo,quantita:m.Quantita,unita_misura:m.UnitaMisura,commessa:m.Commessa||'',pezzo_id:m.PezzoID||'',note:m.Note||'',annullato:(m.Annullato==='SI'||m.Annullato===true),fornitore:m.Fornitore||''})),"movimenti");
    // RISERVE
    await up("riserve",(data.riserve||[]).map(r=>({articolo_id:r.ArticoloID,commessa:r.Commessa,quantita:r.Quantita})),"riserve");
    // FABBISOGNI
    await up("fabbisogni",(data.fabbisogni||[]).map(f=>({id:f.ID,commessa:f.Commessa,tipo:f.Tipo,articolo_id:f.ArticoloID,descrizione:f.Descrizione,num_pezzi:f.NumPezzi,dim1:f.Dim1,dim2:f.Dim2,dim3:f.Dim3,quantita:f.Quantita,unita_misura:f.UnitaMisura,fornitore:f.Fornitore,stato:f.Stato,data_richiesta:f.DataRichiesta||null,note:f.Note})),"fabbisogni");
    // ORDINI
    await up("ordini",(data.ordini||[]).map(o=>({id:o.ID,data:o.Data,commessa:o.Commessa,fornitore:o.Fornitore,stato:o.Stato,righe:JSON.stringify(o.Righe||[]),note:o.Note,email:o.Email})),"ordini");
    // OFFERTE
    await up("offerte",(data.offerte||[]).map(o=>({id:o.ID,data:o.Data,cliente:o.Cliente,commessa:o.Commessa,oggetto:o.Oggetto,dati:JSON.stringify(o.Dati||{})})),"offerte");
    // RETTIFICHE
    await up("rettifiche",(data.rettifiche||[]).map(r=>({id:r.ID,commessa:r.Commessa,voce:r.Voce,valore:r.Valore,note:r.Note,data:r.Data||null})),"rettifiche");
    // IMMAGINI
    await up("immagini",(data.immagini||[]).map(i=>({rif_id:i.RifID,file_id:i.FileID,thumb_url:i.ThumbUrl,data:i.Data||null})),"immagini");
    // MODELLI
    await up("modelli",(data.modelli||[]).map(m=>({chiave:m.Chiave,titolo:m.Titolo,oggetto:m.Oggetto,corpo:m.Corpo,note:m.Note})),"modelli");
    // ALTRE VOCI DI COMMESSA
    await up("voci_commessa",(data.voci||[]).map(v=>({id:v.ID,commessa:v.Commessa,data:v.Data||null,categoria:v.Categoria,descrizione:v.Descrizione,fornitore:v.Fornitore||'',quantita:v.Quantita,unita:v.Unita||'',importo:v.Importo,nr_fattura:v.NrFattura||'',stato:v.Stato||'solo_costo',in_ordine:!!v.InOrdine,ordine_id:v.OrdineID||'',note:v.Note||''})),"altre voci");
    setP("Ripristino completato!");
    toast("Ripristino completato. Ricarico i dati...");
    setTimeout(()=>location.reload(),1400);
  }catch(e){ setP("Errore: "+e.message); toast("Errore durante il ripristino: "+e.message,"err"); }
}
function scaricaBackup(){
  toast("Preparazione backup...");
  Promise.all([
    call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti"),
    call("getCommesse"),call("getFornitori"),call("getFabbisogno"),call("getOrdini"),
    call("getOfferte"),call("getRiserve"),call("getRettifiche"),call("getImmagini"),call("getModelli"),call("getVoci")
  ]).then(([articoli,pannelli,massicci,movimenti,commesse,fornitori,fabbisogni,ordini,offerte,riserve,rettifiche,immagini,modelli,voci])=>{
    const d=new Date();
    const pad=n=>String(n).padStart(2,"0");
    const stamp=pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+"_ore-"+pad(d.getHours())+"-"+pad(d.getMinutes());
    // 1) JSON completo (per il ripristino nell'app)
    const backup={_info:"Backup Magazzino Atelier Tonini",_data:new Date().toISOString(),articoli,pannelli,massicci,movimenti,commesse,fornitori,fabbisogni,ordini,offerte,riserve,rettifiche,immagini,modelli,voci};
    scaricaFile(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),"backup-magazzino_"+stamp+".json");
    // 2) Excel con un foglio per ogni tabella
    try{
      const wb=XLSX.utils.book_new();
      const aggiungi=(nome,dati)=>{ if(dati&&dati.length){ const ws=XLSX.utils.json_to_sheet(dati); XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,31)); } };
      aggiungi("Articoli",articoli); aggiungi("Pannelli",pannelli); aggiungi("Massicci",massicci);
      aggiungi("Movimenti",movimenti); aggiungi("Commesse",commesse); aggiungi("Fornitori",fornitori);
      aggiungi("Fabbisogni",fabbisogni); aggiungi("Ordini",ordini.map(o=>Object.assign({},o,{Righe:JSON.stringify(o.Righe||[])})));
      aggiungi("Offerte",offerte.map(o=>Object.assign({},o,{Dati:JSON.stringify(o.Dati||{})})));
      aggiungi("Riserve",riserve); aggiungi("Rettifiche",rettifiche); aggiungi("Immagini",immagini); aggiungi("Modelli",modelli); aggiungi("Altre voci",voci);
      const xbuf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      scaricaFile(new Blob([xbuf],{type:"application/octet-stream"}),"magazzino_"+stamp+".xlsx");
    }catch(e){console.error("Excel non generato:",e);}
    toast("Backup scaricato: JSON + Excel ("+(articoli.length)+" articoli, "+(pannelli.length)+" pannelli, "+(movimenti.length)+" movimenti)");
  }).catch(e=>toast("Errore backup: "+e.message,"err"));
}
function scaricaFile(blob,nome){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=nome;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function submitNuovoFornitore(){
  const nome=document.getElementById("nf-nome").value.trim(); if(!nome){showErr("nf-err","Inserisci il nome.");return;}
  const em=["nf-e1","nf-e2","nf-e3"].map(i=>document.getElementById(i).value.trim()).filter(Boolean).join(", ");
  call("salvaFornitore",{Nome:nome,Email:em,Telefono:document.getElementById("nf-tel").value.trim(),Note:document.getElementById("nf-note").value.trim()}).then(r=>{
    if(!r.ok){showErr("nf-err",r.err||"Errore");return;}
    call("getFornitori").then(f=>{STATE.fornitori=f||[];closeModal();toast("Fornitore creato");renderPage(STATE.pagina);});
  });
}
function confEliminaFornitore(nome){
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Elimina fornitore</h2><div class="alert alert-red">Eliminare <strong>'+nome+'</strong>? Gli articoli collegati restano.</div><div id="ef-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitEliminaFornitore(\''+esc(nome)+'\')">Elimina</button></div>');
}
function submitEliminaFornitore(nome){
  call("eliminaFornitore",{Nome:nome}).then(r=>{if(!r.ok){showErr("ef-err",r.err||"Errore");return;}
    call("getFornitori").then(f=>{STATE.fornitori=f||[];closeModal();toast("Fornitore eliminato");renderPage(STATE.pagina);});});
}
function openFornitore(nome){
  const f=STATE.fornitori.find(x=>String(x.Nome).trim().toLowerCase()===String(nome).trim().toLowerCase())||{Nome:nome};
  const em=String(f.Email||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Fornitore: '+nome+'</h2>'
   +'<div class="form-group"><label>Email 1 (per ordini)</label><input id="fo-email1" value="'+(em[0]||'')+'" placeholder="ordini@fornitore.it"></div>'
   +'<div class="form-group"><label>Email 2</label><input id="fo-email2" value="'+(em[1]||'')+'"></div>'
   +'<div class="form-group"><label>Email 3</label><input id="fo-email3" value="'+(em[2]||'')+'"></div>'
   +'<div class="form-group"><label>Telefono</label><input id="fo-tel" value="'+(f.Telefono||'')+'"></div>'
   +'<div class="form-group"><label>Note</label><input id="fo-note" value="'+(f.Note||'')+'"></div>'
   +'<div id="fo-err"></div><button class="btn-primary" onclick="submitFornitore(\''+esc(nome)+'\')">Salva fornitore</button></div>');
}
function submitFornitore(nome){
  const em=[1,2,3].map(i=>document.getElementById("fo-email"+i).value.trim()).filter(Boolean).join(", ");
  const tel=document.getElementById("fo-tel").value.trim();
  const note=document.getElementById("fo-note").value.trim();
  call("salvaFornitore",{Nome:nome,Email:em,Telefono:tel,Note:note}).then(r=>{
    if(!r.ok){showErr("fo-err",r.err||"Errore");return;}
    const i=STATE.fornitori.findIndex(x=>String(x.Nome).trim().toLowerCase()===String(nome).trim().toLowerCase());
    const obj={Nome:nome,Email:em,Telefono:tel,Note:note};
    if(i>=0)STATE.fornitori[i]=obj; else STATE.fornitori.push(obj);
    closeModal();toast("Fornitore salvato");renderPage(STATE.pagina);
  });
}

// -- MODIFICA ANAGRAFICA ARTICOLO --
function openModificaArticolo(id){
  const a=STATE.articoli.find(x=>x.ID===id); if(!a)return;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica anagrafica</h2>'
   +'<div class="form-group"><label>Nome *</label><input id="ma-nome" value="'+(a.Nome||'')+'"></div>'
   +'<div class="form-row"><div class="form-group"><label>Fornitore</label><input id="ma-forn" value="'+(a.Fornitore||'')+'"></div><div class="form-group"><label>Codice fornitore</label><input id="ma-cf" value="'+(a.CodiceFornitore||'')+'"></div></div>'
   +'<div class="form-row"><div class="form-group"><label>Soglia riordino</label><input type="number" id="ma-sog" value="'+(a.SogliaRiordino||0)+'"></div><div class="form-group"><label>Urgenza</label><select id="ma-urg"><option value="bassa">Bassa</option><option value="media">Media</option><option value="alta">Alta</option></select></div></div>'
   +'<div id="ma-err"></div><button class="btn-primary" onclick="submitModificaArticolo(\''+esc(id)+'\')">Salva</button></div>');
  const sel=document.getElementById("ma-urg"); if(sel)sel.value=a.Urgenza||"media";
}
function submitModificaArticolo(id){
  const a=STATE.articoli.find(x=>x.ID===id); if(!a)return;
  const nome=document.getElementById("ma-nome").value.trim();
  if(!nome){showErr("ma-err","Il nome e obbligatorio.");return;}
  const d=Object.assign({},a,{ID:id,Nome:nome,Fornitore:document.getElementById("ma-forn").value.trim(),CodiceFornitore:document.getElementById("ma-cf").value.trim(),SogliaRiordino:document.getElementById("ma-sog").value,Urgenza:document.getElementById("ma-urg").value,IsPannello:(a.Categoria==="Pannelli")});
  call("salvaArticolo",d).then(r=>{if(!r.ok){showErr("ma-err",r.err||"Errore");return;}
    STATE.articoli=STATE.articoli.map(x=>x.ID===id?Object.assign({},x,{Nome:d.Nome,Fornitore:d.Fornitore,CodiceFornitore:d.CodiceFornitore,SogliaRiordino:d.SogliaRiordino,Urgenza:d.Urgenza}):x);
    closeModal();toast("Anagrafica aggiornata");renderPage(STATE.pagina);});
}

let ART_VIEW='fam';
function setArtView(v){ART_VIEW=v;renderPage('articoli');}
function nomeTipo(id){const a=STATE.articoli.find(x=>x.ID===id);return a?a.Nome:id;}
function cardArticolo(a){const s=+a.Stock<=+a.SogliaRiordino;const sog=+a.SogliaRiordino||0;const pct=sog>0?Math.max(0,Math.min(100,(+a.Stock/(sog*2))*100)):(+a.Stock>0?100:0);const c=s?'var(--red)':colorPct(pct);const iu=imgUrlFor(a.ID);
  return '<div class="piece" onclick="openDettaglio(\'articolo\',\''+esc(a.ID)+'\')"><input type="checkbox" class="sel-chk" '+(SEL[a.ID]&&SELTIPO==='articolo'?'checked':'')+' onclick="toggleSel(event,\'articolo\',\''+esc(a.ID)+'\')"><div class="piece-row">'+(iu?'<img class="piece-thumb" src="'+iu+'" referrerpolicy="no-referrer">':'')+'<div class="piece-body"><h4>'+a.Nome+'</h4><small>'+a.ID+(ART_VIEW==='griglia'?(' - '+a.Categoria):'')+(a.Fornitore?(' - '+a.Fornitore):'')+'</small><div class="bar-wrap" style="margin-bottom:7px"><div class="bar-fill" style="width:'+pct+'%;background:'+c+'"></div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600;color:'+c+'">'+a.Stock+' '+a.UnitaMisura+(s?' (!)':'')+'</span><span style="color:var(--gray)">soglia '+a.SogliaRiordino+'</span></div>'+(impegnatoArt(a)>0?'<div style="margin-top:4px;font-size:10.5px;color:var(--accent)">di cui '+impegnatoArt(a)+' '+a.UnitaMisura+' destinati a commesse</div>':'')+'</div></div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn btn-green" style="flex:1" onclick="event.stopPropagation();openMovimento(\''+esc(a.ID)+'\',\'carico\')">Carico</button><button class="btn btn-red" style="flex:1" onclick="event.stopPropagation();openMovimento(\''+esc(a.ID)+'\',\'scarico\')">Scarico</button></div></div>';
}
function articoliCont(q,cat){
  let list=STATE.articoli.filter(a=>a.Categoria!=='Pannelli'&&a.Categoria!=='Massello'&&a.IsPannello!=='SI');
  if(cat)list=list.filter(a=>a.Categoria===cat);
  if(q){const s=q.toLowerCase();list=list.filter(a=>(a.Nome||"").toLowerCase().indexOf(s)>=0||(a.ID||"").toLowerCase().indexOf(s)>=0||(a.Fornitore||"").toLowerCase().indexOf(s)>=0||(a.CodiceFornitore||"").toLowerCase().indexOf(s)>=0||(a.Note||"").toLowerCase().indexOf(s)>=0);}
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessun articolo.</div>';
  if(ART_VIEW==='griglia'){const ord=list.slice().sort((a,b)=>String(a.Nome).localeCompare(String(b.Nome)));return '<div class="piece-grid">'+ord.map(cardArticolo).join("")+'</div>';}
  const g={}; list.forEach(a=>{(g[a.Categoria||'Altro']=g[a.Categoria||'Altro']||[]).push(a);});
  let html='';
  Object.keys(g).forEach(catName=>{
    const arr=g[catName],sotto=arr.filter(a=>+a.Stock<=+a.SogliaRiordino).length;
    html+='<div style="margin-bottom:26px"><div onclick="famTog(this)" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none"><span class="fam-c">▾</span><span style="font-weight:600;font-size:15px">'+catName+'</span><span class="badge badge-gray">'+arr.length+'</span>'+(sotto?'<span class="badge badge-red">'+sotto+' sotto soglia</span>':'')+'</div><div class="piece-grid">'+arr.map(cardArticolo).join("")+'</div></div>';
  });
  return html;
}
function filterArticoli(){
  document.getElementById("art-cont").innerHTML=articoliCont(document.getElementById("flt-art").value,document.getElementById("flt-cat").value);if(ART_VIEW==='fam')collassaFam();
}

function cardPannello(p){const pct=+p.Residuale_pct||0,c=colorPct(pct),iu=imgUrlFor(p.ArticoloID),art=STATE.articoli.find(a=>a.ID===p.ArticoloID);
  return '<div class="piece" onclick="openDettaglio(\'pannello\',\''+esc(p.ID)+'\')"><input type="checkbox" class="sel-chk" '+(SEL[p.ID]&&SELTIPO==='pannello'?'checked':'')+' onclick="toggleSel(event,\'pannello\',\''+esc(p.ID)+'\')"><div class="piece-row">'+(iu?'<img class="piece-thumb" src="'+iu+'" referrerpolicy="no-referrer">':'')+'<div class="piece-body"><h4>'+p.ID+'</h4><small>'+(PANN_VIEW==='griglia'?(nomeTipo(p.ArticoloID)+' - '):'')+p.Larghezza_mm+' x '+p.Altezza_mm+' mm</small><div class="bar-wrap" style="margin-bottom:7px"><div class="bar-fill" style="width:'+pct+'%;background:'+c+'"></div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600;color:'+c+'">'+pct.toFixed(0)+'%</span><span style="color:var(--gray)">'+(+p.M2_residuo||0).toFixed(2)+' m2</span></div>'+(p.Fornitore?'<div style="margin-top:5px;font-size:10.5px;color:var(--gray)">Forn: '+p.Fornitore+'</div>':'')+'</div></div><button class="btn btn-red" style="margin-top:9px;width:100%" onclick="event.stopPropagation();openScaricoPannello(\''+esc(p.ID)+'\')">Scarico</button></div>';

function pannelliCont(filtro){
  let list=STATE.pannelli;
  if(filtro){const q=filtro.toLowerCase();list=list.filter(p=>{const art=STATE.articoli.find(a=>a.ID===p.ArticoloID);return (p.ID+' '+(art?art.Nome:'')+' '+p.ArticoloID+' '+(p.Fornitore||'')+' '+(p.Note||'')).toLowerCase().indexOf(q)>=0;});}
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessun pannello.</div>';
  if(PANN_VIEW==='griglia'){const ord=list.slice().sort((a,b)=>String(a.ID).localeCompare(String(b.ID)));return '<div class="piece-grid">'+ord.map(cardPannello).join("")+'</div>';}
  const g={}; list.forEach(p=>{(g[p.ArticoloID]=g[p.ArticoloID]||[]).push(p);});
  let html='';
  Object.keys(g).forEach(id=>{
    const ps=g[id],art=STATE.articoli.find(a=>a.ID===id);
    const tot=ps.reduce((s,p)=>s+(+p.M2_residuo||0),0),us=ps.filter(p=>+p.Residuale_pct>10).length;const dest=destinatoPannelli(id);
    html+='<div style="margin-bottom:26px"><div onclick="famTog(this)" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none"><span class="fam-c">▾</span><span style="font-weight:600;font-size:15px">'+(art?art.Nome:id)+'</span><span class="badge badge-gray">'+id+'</span><span style="font-size:12px;color:var(--gray)">'+tot.toFixed(2)+' m2 residui'+(dest>0?(' <span style="color:var(--accent);text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();openDestinati(\''+esc(id)+'\',\'pannello\')">(di cui '+dest.toFixed(2)+' destinati a commesse)</span>'):'')+' - '+us+'/'+ps.length+' utilizzabili</span></div><div class="piece-grid">'+ps.map(cardPannello).join("")+'</div></div>';
  });
  return html;
}
function filtraPannelli(){document.getElementById("pann-cont").innerHTML=pannelliCont(document.getElementById("pann-q").value);if(PANN_VIEW==='fam')collassaFam();}

function cardMassiccio(p){const orig=+p.M3_originale||0,res=+p.M3_residuo||0,pct=orig>0?(res/orig)*100:0,c=colorPct(pct);const dim=p.Lunghezza_mm?(p.Lunghezza_mm+' x '+p.Larghezza_mm+' x '+p.Spessore_mm+' mm'):'lotto m3';const iu=imgUrlFor(p.ArticoloID),art=STATE.articoli.find(a=>a.ID===p.ArticoloID);

// -- MOVIMENTI --
function renderMovimenti(){
  return '<h1 class="page-title">Movimenti</h1><div class="filters"><select id="flt-tipo" onchange="filterMov()"><option value="">Tutti i tipi</option><option value="carico">Solo carichi</option><option value="scarico">Solo scarichi</option></select><input id="flt-comm" placeholder="Filtra commessa..." oninput="filterMov()"></div>'
  +'<div class="table-wrap"><table><thead><tr><th>Data</th><th>Operatore</th><th>Articolo</th><th>Cod. forn.</th><th>Tipo</th><th>Quantita</th><th>Fornitore</th><th>Commessa</th></tr></thead><tbody id="tbody-mov">'+rowsMov(STATE.movimenti.slice().reverse())+'</tbody></table></div>';
}
function rowsMov(list){
  const cfDi=(m)=>{let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);return (art&&art.CodiceFornitore)||'-';};
  return list.map(m=>'<tr style="opacity:'+(m.Annullato==='SI'?.45:1)+'" onclick="openDettaglio(\'movimento\',\''+esc(m.ID)+'\')"><td style="font-size:11px;font-family:monospace;color:var(--gray)">'+String(m.Data||"").slice(0,16)+'</td><td style="font-size:12px">'+(m.Utente||"")+'</td><td style="font-weight:600">'+(m.NomeArticolo||"")+'</td><td style="font-size:11.5px;color:var(--gray)">'+cfDi(m)+'</td><td><span class="badge '+(m.Tipo==='carico'?'badge-green':'badge-red')+'">'+(m.Tipo||"")+'</span></td><td style="font-weight:600;color:'+(m.Tipo==='carico'?'var(--green)':'var(--red)')+'">'+(m.Tipo==='carico'?'+':'-')+m.Quantita+' '+m.UnitaMisura+'</td><td style="font-size:11.5px;color:var(--gray)">'+(m.Fornitore||'-')+'</td><td style="font-size:11px;font-family:monospace;color:var(--gray)">'+(m.Commessa||"-")+'</td></tr>').join("")||'<tr><td colspan="8" style="text-align:center;color:var(--gray);padding:26px">Nessun movimento</td></tr>';
}
function filterMov(){
  const t=document.getElementById("flt-tipo").value,c=document.getElementById("flt-comm").value.toLowerCase();
  const f=STATE.movimenti.slice().reverse().filter(m=>(!t||m.Tipo===t)&&(!c||(m.Commessa||"").toLowerCase().includes(c)));
  document.getElementById("tbody-mov").innerHTML=rowsMov(f);
}

// -- REPORT --
function movCommessa(comm){ return STATE.movimenti.filter(m=>m.Commessa===comm&&m.Annullato!=="SI"); }
function renderReport(){
  const sotto=STATE.articoli.filter(a=>+a.Stock<=+a.SogliaRiordino);
  const set={}; STATE.commesse.forEach(c=>set[c.ID]=c.Nome||"");
  STATE.movimenti.forEach(m=>{if(m.Commessa&&!(m.Commessa in set))set[m.Commessa]="";});
  const blocchi=Object.keys(set).map(id=>{
    const n=movCommessa(id).filter(m=>m.Tipo==='scarico').length;

function buildReportCommessa(comm){
  const c=STATE.commesse.find(x=>x.ID===comm)||{ID:comm,Nome:"",Cliente:""};
  const movs=movCommessa(comm).filter(m=>m.Tipo==="scarico");
  const cfDi=(m)=>{let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);return (art&&art.CodiceFornitore)||'';};
  const codeDi=(m)=>{if(m.PezzoID)return m.PezzoID;let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);return (art&&/^ART-/.test(art.ID))?art.ID:'-';};
  const tot={}; movs.forEach(m=>{const cf=cfDi(m);const k=m.NomeArticolo+'||'+m.UnitaMisura+'||'+cf; if(!tot[k])tot[k]={nome:m.NomeArticolo,unita:m.UnitaMisura,cf:cf,q:0,n:0,pezzi:[]}; tot[k].q+=(+m.Quantita||0); tot[k].n++; if(m.PezzoID)String(m.PezzoID).split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{if(tot[k].pezzi.indexOf(p)<0)tot[k].pezzi.push(p);});});
  const righeTot=Object.keys(tot).map(k=>{const t=tot[k];
    // Ordina i codici pezzo (P1014, P1015...) in ordine
    t.pezzi.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const nPezzi=t.pezzi.length;
    const codiciCell=nPezzi?('<div style="font-size:11px;color:#555;font-family:monospace">'+t.pezzi.join(', ')+'</div>'):'-';
    return '<tr><td>'+t.nome+'</td><td align="center">'+(t.cf||'-')+'</td><td style="text-align:right">'+t.q.toFixed(3)+' '+t.unita+'</td><td style="text-align:center">'+(nPezzi||'-')+'</td><td style="text-align:right">'+t.n+'</td></tr>'
      +(nPezzi?'<tr><td colspan="5" style="padding:2px 10px 8px;background:#faf8f4"><span style="font-size:11px;color:#888">Codici pezzi ('+nPezzi+'): </span>'+codiciCell+'</td></tr>':'');
  }).join("")||'<tr><td colspan="5" style="color:#888">Nessun consumo registrato</td></tr>';
  const righeMov=movs.map(m=>'<tr><td>'+String(m.Data||"").slice(0,16)+'</td><td>'+m.NomeArticolo+'</td><td align="center">'+(cfDi(m)||'-')+'</td><td>'+codeDi(m)+'</td><td style="text-align:right">'+m.Quantita+' '+m.UnitaMisura+'</td><td style="font-size:11px">'+(m.Note||'')+'</td><td>'+(m.Utente||"")+'</td></tr>').join("")||'<tr><td colspan="7" style="color:#888">Nessun movimento</td></tr>';
  // Altre voci di commessa (conto lavorazione, trasporti, pasti, ...)
  const voci=(STATE.voci||[]).filter(v=>v.Commessa===comm)
    .sort((a,b)=>String(a.Categoria).localeCompare(String(b.Categoria))||String(a.Data).localeCompare(String(b.Data)));
  let vociBlock='',vociRiep='';
  if(voci.length){
    let catPrec=null,totV=0,rr='';
    voci.forEach(function(v){
      totV+=(+v.Importo||0);
      if(v.Categoria!==catPrec){catPrec=v.Categoria;rr+='<tr><td colspan="5" style="background:#f7f3ec;font-weight:bold;padding:5px 6px">'+catPrec+'</td></tr>';}
      const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'-';
      rr+='<tr><td>'+String(v.Data||'').slice(0,10)+'</td><td>'+v.Descrizione+(v.Note?('<div style="font-size:11px;color:#777">'+v.Note+'</div>'):'')+'</td><td>'+(v.Fornitore||'-')+'</td><td align="center">'+q+'</td><td align="right">'+(v.Importo!=null&&v.Importo!==""?('&euro; '+euro(v.Importo)):'-')+'</td></tr>';
    });
    rr+='<tr style="background:#efefef"><td colspan="4" align="right" style="font-weight:bold">Totale altre voci</td><td align="right" style="font-weight:bold">&euro; '+euro(totV)+'</td></tr>';
    // riepilogo per categoria, da mettere in alto sotto i materiali consumati
    const perCat={};
    voci.forEach(function(v){const k=v.Categoria||'Altro';if(!perCat[k])perCat[k]={n:0,imp:0};perCat[k].n++;perCat[k].imp+=(+v.Importo||0);});
    vociRiep='<h3 style="font-size:15px;margin:18px 0 8px">Altre voci (riepilogo)</h3>'
      +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:18px"><thead><tr style="background:#f0e9e0"><th align="left">Categoria</th><th align="center">N. voci</th><th align="right">Importo</th></tr></thead><tbody>'
      +Object.keys(perCat).sort().map(k=>'<tr><td>'+k+'</td><td align="center">'+perCat[k].n+'</td><td align="right">&euro; '+euro(perCat[k].imp)+'</td></tr>').join("")
      +'<tr style="background:#efefef"><td style="font-weight:bold">Totale altre voci</td><td align="center" style="font-weight:bold">'+voci.length+'</td><td align="right" style="font-weight:bold">&euro; '+euro(totV)+'</td></tr>'
      +'</tbody></table>';
    vociBlock='<h3 style="font-size:15px;margin:18px 0 8px">Altre voci — dettaglio</h3>'
      +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Data</th><th align="left">Voce</th><th align="left">Fornitore</th><th align="center">Q.ta</th><th align="right">Importo</th></tr></thead><tbody>'+rr+'</tbody></table>';
  }
  const rett=(STATE.rettifiche||[]).filter(r=>r.Commessa===comm);
  const rettBlock=rett.length?('<h3 style="font-size:15px;margin:18px 0 8px">Rettifiche manuali</h3><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Voce</th><th align="left">Valore</th><th align="left">Note</th></tr></thead><tbody>'+rett.map(r=>'<tr><td>'+r.Voce+'</td><td>'+r.Valore+'</td><td>'+r.Note+'</td></tr>').join("")+'</tbody></table>'):'';
  const oggi=new Date().toLocaleDateString('it-IT');
  return '<div style="font-family:Georgia,serif;color:#3a342d">'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #8a6d4e;padding-bottom:10px;margin-bottom:16px"><div><div style="font-size:20px;font-weight:700;color:#8a6d4e">Atelier Tonini</div><div style="font-size:13px;color:#777">Report commessa</div></div><div style="text-align:right;font-size:12px;color:#777">Generato il '+oggi+'</div></div>'
   +'<table style="width:100%;font-size:13px;margin-bottom:16px"><tr><td style="color:#777;width:130px">Commessa</td><td style="font-weight:700">'+c.ID+'</td></tr>'+(c.Nome&&c.Nome!==c.ID?'<tr><td style="color:#777">Descrizione</td><td>'+c.Nome+'</td></tr>':'')+(c.Cliente?'<tr><td style="color:#777">Cliente</td><td>'+c.Cliente+'</td></tr>':'')+'</table>'
   +'<h3 style="font-size:15px;margin-bottom:8px">Materiali consumati</h3>'
   +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:18px"><thead><tr style="background:#f0e9e0"><th align="left">Materiale</th><th align="center">Cod. forn.</th><th align="right">Totale</th><th align="center">N. pezzi</th><th align="right">N. mov.</th></tr></thead><tbody>'+righeTot+'</tbody></table>'
   +vociRiep
   +'<h3 style="font-size:15px;margin-bottom:8px">Dettaglio movimenti</h3>'
   +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Data</th><th align="left">Materiale</th><th align="center">Cod. forn.</th><th align="left">Codice</th><th align="right">Quantita</th><th align="left">Note</th><th align="left">Operatore</th></tr></thead><tbody>'+righeMov+'</tbody></table>'
   +vociBlock
   +rettBlock
   +'</div>';
}
function openReportCommessa(comm){
  call("getRettifiche").then(rt=>{STATE.rettifiche=rt||[];_openReportCommessa(comm);}).catch(()=>{STATE.rettifiche=STATE.rettifiche||[];_openReportCommessa(comm);});

function _openReportCommessa(comm){

    +'<div class="form-row" style="margin-top:8px"><div class="form-group" style="margin:0"><label>Voce</label><input id="rt-v" placeholder="es. Cerniere consegnate"></div><div class="form-group" style="margin:0"><label>Valore</label><input id="rt-val" placeholder="es. 50 pz"></div></div><div class="form-group"><label>Note</label><input id="rt-n"></div><button class="btn btn-accent" onclick="addRettifica(\''+esc(comm)+'\')">+ Aggiungi rettifica</button></div>';

// Riepilogo materiali DESTINATI a questa commessa ma NON ancora scaricati, con azioni
function destinatiNonScaricati(comm){
  const out={articoli:[],pannelli:[],massicci:[]};
  // Articoli: dalle riserve
  (STATE.riserve||[]).filter(r=>r.Commessa===comm&&r.Quantita>0).forEach(r=>{
    const a=STATE.articoli.find(x=>x.ID===r.ArticoloID)||{};
    out.articoli.push({id:r.ArticoloID,nome:a.Nome||r.ArticoloID,q:r.Quantita,unita:a.UnitaMisura||''});
  });
  // Pannelli assegnati a questa commessa con residuo
  STATE.pannelli.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(comm)>=0 && (+p.M2_residuo>0)).forEach(p=>{
    out.pannelli.push({id:p.ID,nome:nomeTipo(p.ArticoloID),q:+p.M2_residuo||0});
  });
  // Massicci assegnati con residuo
  STATE.massicci.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(comm)>=0 && (+p.M3_residuo>0)).forEach(p=>{
    out.massicci.push({id:p.ID,nome:nomeTipo(p.ArticoloID),q:+p.M3_residuo||0});
  });
  return out;
}
function buildDestinatiSection(comm){
  const d=destinatiNonScaricati(comm);
  const tot=d.articoli.length+d.pannelli.length+d.massicci.length;
  if(!tot)return '<div class="card" style="margin-top:14px"><div class="card-title">Destinati a questa commessa (non ancora scaricati)</div><div style="color:var(--gray);font-size:13px">Niente in attesa: tutto il materiale destinato è già stato scaricato.</div></div>';
  const riga=(tipo,it,qtxt)=>'<label style="display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--border);cursor:pointer"><input type="checkbox" class="ds-chk" data-tipo="'+tipo+'" value="'+esc(it.id)+'" style="width:17px;height:17px;accent-color:var(--accent)"><span style="flex:1;font-size:13px">'+(it.id&&/^[PMR]\d|^R\d/.test(it.id)?('<strong>'+it.id+'</strong> - '):'')+it.nome+'</span><span style="font-size:12px;color:var(--gray)">'+qtxt+'</span></label>';
  let body='';
  d.articoli.forEach(it=>body+=riga('articolo',it,it.q+' '+it.unita));
  d.pannelli.forEach(it=>body+=riga('pannello',it,it.q.toFixed(2)+' m2'));
  d.massicci.forEach(it=>body+=riga('massiccio',it,it.q.toFixed(3)+' m3'));
  return '<div class="card" style="margin-top:14px"><div class="card-title">Destinati a questa commessa (non ancora scaricati) - '+tot+'</div>'
   +'<div style="font-size:11.5px;color:var(--gray);margin-bottom:6px">Seleziona i pezzi da gestire, poi scegli l\'azione. Senza selezione, le azioni valgono per TUTTI.</div>'
   +body
   +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
   +'<button class="btn btn-red" onclick="scaricaDestinati(\''+esc(comm)+'\',false)">Scarica selezionati/tutti</button>'
   +'<button class="btn btn-ghost" onclick="scaricaDestinati(\''+esc(comm)+'\',true)">Togli assegnazione (senza scaricare)</button>'
   +'</div></div>';
}
// Raccoglie le selezioni; se nessuna, prende tutto
function _raccogliDestinati(comm){
  const chk=Array.prototype.slice.call(document.querySelectorAll(".ds-chk:checked"));
  let sel=chk.map(c=>({tipo:c.getAttribute("data-tipo"),id:c.value}));
  if(!sel.length){const d=destinatiNonScaricati(comm);sel=d.articoli.map(x=>({tipo:'articolo',id:x.id})).concat(d.pannelli.map(x=>({tipo:'pannello',id:x.id}))).concat(d.massicci.map(x=>({tipo:'massiccio',id:x.id})));}
  return sel;
}
function scaricaDestinati(comm,soloTogli){
  const sel=_raccogliDestinati(comm);
  if(!sel.length){toast("Niente da gestire","err");return;}
  const azione=soloTogli?"Rimozione assegnazione":"Scarico";
  toast(azione+" in corso...");
  const ops=sel.map(it=>{
    if(soloTogli){
      // Togli assegnazione: articoli via annullaAssegnazione, pezzi via assegnaPezzoSingolo vuoto
      if(it.tipo==='articolo')return call("annullaAssegnazione",{tipo:"articolo",artId:it.id,commessa:comm});
      return call("assegnaPezzoSingolo",{tipo:it.tipo,id:it.id,commessa:""});
    } else {
      // Scarica del tutto verso la commessa
      if(it.tipo==='articolo'){const a=STATE.articoli.find(x=>x.ID===it.id)||{};const r=(STATE.riserve||[]).find(x=>x.ArticoloID===it.id&&x.Commessa===comm);const q=r?r.Quantita:0;
        // scarico q, poi libera la riserva
        return call("registraMovimento",{ArticoloID:it.id,Tipo:"scarico",Quantita:q,Commessa:comm,Note:"Scarico da report commessa"}).then(()=>call("liberaRiserva",{artId:it.id,commessa:comm}));
      }
      if(it.tipo==='pannello')return call("scaricaPannelloTotale",{PannelloID:it.id,Commessa:comm,Note:"Scarico da report commessa"});
      return call("scaricaMassiccioTotale",{MassiccioID:it.id,Commessa:comm,Note:"Scarico da report commessa"});
    }
  });
  Promise.all(ops).then(()=>{
    Promise.all([call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti"),call("getRiserve")]).then(([a,p,m,mv,ri])=>{
      STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];STATE.movimenti=mv||[];STATE.riserve=ri||[];
      toast(azione+" completato: "+sel.length+" elementi");
      _openReportCommessa(comm);
    });
  }).catch(e=>toast("Errore: "+e.message,"err"));
}
function addRettifica(comm){const v=document.getElementById("rt-v").value.trim(),val=document.getElementById("rt-val").value.trim();if(!v){toast("Inserisci la voce","err");return;}
  call("salvaRettifica",{Commessa:comm,Voce:v,Valore:val,Note:document.getElementById("rt-n").value}).then(()=>{call("getRettifiche").then(rt=>{STATE.rettifiche=rt||[];_openReportCommessa(comm);toast("Rettifica aggiunta");});});}
function delRettifica(id,comm){call("eliminaRettifica",{id:id}).then(()=>{call("getRettifiche").then(rt=>{STATE.rettifiche=rt||[];_openReportCommessa(comm);toast("Rettifica rimossa");});});}
function stampaHTML(html){
  const area=document.getElementById("print-area");
  area.innerHTML=html;
  let stampato=false;
  const fatto=function(){if(stampato)return;stampato=true;document.body.classList.add("printing");window.print();setTimeout(function(){document.body.classList.remove("printing");},600);};
  const imgs=Array.prototype.slice.call(area.querySelectorAll("img"));
  if(!imgs.length){fatto();return;}
  let n=0;const done=function(){if(++n>=imgs.length)fatto();};
  imgs.forEach(function(im){if(im.complete&&im.naturalWidth)done();else{im.onload=done;im.onerror=done;}});
  setTimeout(fatto,4000); // fallback se un'immagine non carica
}
function stampaReportCommessa(comm){ stampaHTML(buildReportCommessa(comm)); }

// Voci "altre" della commessa marcate per entrare negli ordini al fornitore
function vociDaOrdinare(comm){
  return (STATE.voci||[]).filter(v=>v.Commessa===comm&&v.InOrdine&&v.Stato!=='ricevuto'&&v.Stato!=='solo_costo');
}
function dettaglioVoce(v){
  const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'';
  return (v.Categoria||'')+(q?(' - '+q):'');
}
function dettaglioRiga(f){return f.__voce?dettaglioVoce(f):fabDettaglio(f);}
function fabDettaglio(f){
  if(f.Tipo==='articolo')return (f.Quantita||'')+' '+(f.UnitaMisura||'');
  if(f.Tipo==='pannello')return (f.NumPezzi||'')+' pz '+(f.Dim1||'')+'x'+(f.Dim2||'')+'mm';
  return (f.NumPezzi||'')+' pz '+(f.Dim1||'')+'x'+(f.Dim2||'')+'x'+(f.Dim3||'')+'mm';
}
function dispoFab(f){
  if(f.Tipo==='articolo'){const a=STATE.articoli.find(x=>x.ID===f.ArticoloID);const st=a?+a.Stock:0;const imp=a?impegnatoArt(a):0;const lib=Math.max(0,st-imp);const u=a?a.UnitaMisura:(f.UnitaMisura||'');return {ok:lib>=(+f.Quantita||0),libero:lib,testo:'a mag. '+st+' '+u+' - destinati '+imp+' - liberi '+lib};}
  if(f.Tipo==='pannello'){const lib=STATE.pannelli.filter(p=>p.ArticoloID===f.ArticoloID&&!String(p.Commesse||'').trim()).reduce((s,p)=>s+(+p.M2_residuo||0),0);const need=((+f.Dim1||0)/1000)*((+f.Dim2||0)/1000)*(+f.NumPezzi||0);return {ok:lib>=need,libero:lib,testo:'liberi '+lib.toFixed(2)+' / serve '+need.toFixed(2)+' m2'};}
  const lib=STATE.massicci.filter(p=>p.ArticoloID===f.ArticoloID&&!String(p.Commesse||'').trim()).reduce((s,p)=>s+(+p.M3_residuo||0),0);const need=((+f.Dim1||0)/1000)*((+f.Dim2||0)/1000)*((+f.Dim3||0)/1000)*(+f.NumPezzi||0);return {ok:lib>=need,libero:lib,testo:'liberi '+lib.toFixed(3)+' / serve '+need.toFixed(3)+' m3'};
}
// Conta quanti pezzi/quantita sono REALMENTE assegnati a questo fabbisogno (in tempo reale)
function assegnatoReale(f){
  if(f.Tipo==='articolo'){
    const r=(STATE.riserve||[]).find(x=>x.ArticoloID===f.ArticoloID&&x.Commessa===f.Commessa);
    return r?(+r.Quantita||0):0;
  }
  const pezzi=(f.Tipo==='pannello'?STATE.pannelli:STATE.massicci)
    .filter(p=>p.ArticoloID===f.ArticoloID && String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(f.Commessa)>=0);
  return pezzi.length;
}
// Stato effettivo calcolato dalla realta (non dal flag salvato)
function statoEffettivo(f){
  if(f.Stato==='ricevuto')return 'ricevuto';
  const ass=assegnatoReale(f);
  if(f.Tipo==='articolo'){
    const need=parseFloat(f.Quantita)||0;
    if(ass>0&&ass>=need)return 'assegnato';
    if(ass>0)return 'parziale';
  } else {
    const need=parseInt(f.NumPezzi)||1;
    if(ass>=need)return 'assegnato';
    if(ass>0)return 'parziale';
  }
  return (f.Stato==='ordinato')?'ordinato':'da_ordinare';
}

      if(st==='parziale')act+='<button class="btn btn-ghost" onclick="disassegnaFab(\''+esc(f.ID)+'\')">Annulla parziale</button> ';

  const daOrd=list.filter(f=>statoEffettivo(f)==='da_ordinare'||statoEffettivo(f)==='parziale');

  // le "altre voci" marcate per gli ordini entrano nello stesso raggruppamento per fornitore
  vociDaOrdinare(FAB_COMM).forEach(v=>{const fo=v.Fornitore||'(senza fornitore)';(gruppi[fo]=gruppi[fo]||[]).push({__voce:true,ID:v.ID,Descrizione:v.Descrizione,Categoria:v.Categoria,Quantita:v.Quantita,Unita:v.Unita,Note:v.Note});});
  let ordini=Object.keys(gruppi).map(fo=>{
    const em=(STATE.fornitori.find(x=>String(x.Nome).trim().toLowerCase()===fo.trim().toLowerCase())||{}).Email||'';
