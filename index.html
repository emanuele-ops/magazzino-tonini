// ============================================================
//  GRAFICI DELLA DASHBOARD
//  Barre orizzontali per i confronti di grandezza, colonne per
//  l'andamento nel tempo. Ogni barra ha sempre il suo valore
//  scritto accanto: si legge anche stampata in bianco e nero.
// ============================================================
const VIZ={s1:'#2a78d6',s2:'#eb6834',s3:'#1baf7a',s4:'#eda100'};
let GRAF_MESI=12,GRAF_COMM='';
function isMq(u){return /^(m2|m\u00b2|mq)$/i.test(String(u||'').trim());}
function isMc(u){return /^(m3|m\u00b3|mc)$/i.test(String(u||'').trim());}
function nfmt(v,dec){return Number(v||0).toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
// barre orizzontali: righe = [{lab, val, txt, extra}]
function vizBarre(titolo,sub,righe,colore,vuoto){
  if(!righe.length)return '<div class="viz-card"><div class="viz-h">'+titolo+'</div><div class="viz-sub">'+sub+'</div><div class="viz-empty">'+(vuoto||'Nessun dato.')+'</div></div>';
  const max=Math.max.apply(null,righe.map(r=>Math.abs(r.val)))||1;
  const body=righe.map(function(r){
    const w=Math.max(2,Math.abs(r.val)/max*100);
    return '<div class="viz-row" title="'+att(r.lab+' — '+r.txt+(r.extra?(' — '+r.extra):''))+'">'
      +'<span class="viz-lab">'+r.lab+'</span>'
      +'<span class="viz-track"><span class="viz-fill" style="width:'+w+'%;background:'+(r.colore||colore||VIZ.s1)+'"></span></span>'
      +'<span class="viz-val">'+r.txt+'</span></div>';
  }).join("");
  return '<div class="viz-card"><div class="viz-h">'+titolo+'</div><div class="viz-sub">'+sub+'</div>'+body+'</div>';
}
// colonne affiancate per mese: serie = [{nome,colore,dati:[n,...]}]
function vizColonne(titolo,sub,etichette,serie,dec,unita){
  let max=0;serie.forEach(s=>s.dati.forEach(v=>{if(v>max)max=v;}));
  if(!max)return '<div class="viz-card"><div class="viz-h">'+titolo+'</div><div class="viz-sub">'+sub+'</div><div class="viz-empty">Nessun movimento nel periodo.</div></div>';
  const H=120,W=Math.max(320,etichette.length*46),padL=6,padB=24,padT=14;
  const gw=(W-padL*2)/etichette.length, bw=Math.max(6,(gw-10)/serie.length);
  let svg='<svg viewBox="0 0 '+W+' '+(H+padB+padT)+'" style="width:100%;height:auto;display:block" role="img">';
  [0,.5,1].forEach(function(f){const y=padT+H-H*f;
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padL)+'" y2="'+y+'" stroke="#ece6dc" stroke-width="1"/>';
    svg+='<text x="'+padL+'" y="'+(y-3)+'" font-size="8.5" fill="#a09a90">'+nfmt(max*f,dec)+'</text>';});
  etichette.forEach(function(et,i){
    const x0=padL+i*gw;
    serie.forEach(function(se,j){
      const v=se.dati[i]||0,h=max?(v/max*H):0;
      const x=x0+(gw-bw*serie.length)/2+j*bw;
      if(h>0)svg+='<rect x="'+(x+1)+'" y="'+(padT+H-h)+'" width="'+(bw-2)+'" height="'+h+'" rx="3" fill="'+se.colore+'"><title>'+att(se.nome+' '+et+': '+nfmt(v,dec)+' '+(unita||''))+'</title></rect>';
    });
    svg+='<text x="'+(x0+gw/2)+'" y="'+(padT+H+13)+'" font-size="9" fill="#7a736b" text-anchor="middle">'+et+'</text>';
    const tot=serie.reduce((a,se)=>a+(se.dati[i]||0),0);
    if(tot)svg+='<text x="'+(x0+gw/2)+'" y="'+(padT+H+22)+'" font-size="8" fill="#a09a90" text-anchor="middle">'+nfmt(tot,dec)+'</text>';
  });
  svg+='</svg>';
  const leg=serie.length>1?('<div class="viz-leg">'+serie.map(se=>'<span><i style="background:'+se.colore+'"></i>'+se.nome+'</span>').join("")+'</div>'):'';
  return '<div class="viz-card"><div class="viz-h">'+titolo+'</div><div class="viz-sub">'+sub+'</div>'+leg+svg+'</div>';
}
function ultimiMesi(n){
  const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({key:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),
              lab:['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][x.getMonth()]});}
  return out;
}
function renderGrafici(){
  const comms=(STATE.commesse||[]).slice().sort((a,b)=>String(b.ID).localeCompare(String(a.ID)));
  const per=[[3,'Ultimi 3 mesi'],[6,'Ultimi 6 mesi'],[12,'Ultimi 12 mesi'],[24,'Ultimi 24 mesi'],[0,'Tutto lo storico']];
  return '<div class="filters" style="margin-bottom:14px">'
    +'<select id="gf-per" onchange="aggiornaGrafici()">'+per.map(p=>'<option value="'+p[0]+'"'+(p[0]===GRAF_MESI?' selected':'')+'>'+p[1]+'</option>').join("")+'</select>'
    +'<select id="gf-comm" onchange="aggiornaGrafici()"><option value="">Tutte le commesse</option>'
    +comms.map(c=>'<option value="'+att(c.ID)+'"'+(c.ID===GRAF_COMM?' selected':'')+'>'+c.ID+(c.Nome&&c.Nome!==c.ID?(' - '+c.Nome):'')+'</option>').join("")+'</select>'
    +'</div><div id="viz-cont">'+vizContenuto()+'</div>';
}
function aggiornaGrafici(){
  GRAF_MESI=parseInt(document.getElementById("gf-per").value,10)||0;
  GRAF_COMM=document.getElementById("gf-comm").value;
  document.getElementById("viz-cont").innerHTML=vizContenuto();
}
function giorniDa(d){if(!d)return null;const t=new Date(String(d).slice(0,10));if(isNaN(t))return null;
  return Math.round((Date.now()-t.getTime())/86400000);}
function vizSez(t,sub){return '<div style="margin:22px 0 10px"><div style="font-family:Georgia,serif;font-size:16px">'+t+'</div><div style="font-size:11.5px;color:var(--gray)">'+sub+'</div></div>';}

function vizContenuto(){
  const filtroC=GRAF_COMM;
  const val=m=>m.Annullato!=='SI';
  // periodo
  let mesi,keys,lab,dentro;
  if(GRAF_MESI>0){mesi=ultimiMesi(GRAF_MESI);keys=mesi.map(m=>m.key);lab=mesi.map(m=>m.lab);
    dentro=d=>keys.indexOf(String(d||'').slice(0,7))>=0;}
  else{
    const tutti={};STATE.movimenti.forEach(m=>{const k=String(m.Data||'').slice(0,7);if(k)tutti[k]=1;});
    (STATE.voci||[]).forEach(v=>{const k=String(v.Data||'').slice(0,7);if(k)tutti[k]=1;});
    keys=Object.keys(tutti).sort();
    lab=keys.map(k=>k.slice(5)+'/'+k.slice(2,4));
    dentro=()=>true;
  }
  const idx=d=>keys.indexOf(String(d||'').slice(0,7));
  const zeri=()=>keys.map(()=>0);
  const scar=STATE.movimenti.filter(m=>val(m)&&m.Tipo==='scarico'&&dentro(m.Data)&&(!filtroC||m.Commessa===filtroC));
  const cari=STATE.movimenti.filter(m=>val(m)&&m.Tipo==='carico'&&dentro(m.Data));
  const voci=(STATE.voci||[]).filter(v=>dentro(v.Data)&&(!filtroC||v.Commessa===filtroC));

  // ---------- numeri in testa ----------
  const somma=(arr,test)=>arr.filter(m=>test(m.UnitaMisura)).reduce((s,m)=>s+(+m.Quantita||0),0);
  const cMq=somma(cari,isMq),sMq=somma(scar,isMq),cMc=somma(cari,isMc),sMc=somma(scar,isMc);
  const eur=voci.reduce((s,v)=>s+(+v.Importo||0),0);
  const kpi=(l,v,sub,col)=>'<div class="card" style="padding:13px 15px"><div class="stat-label">'+l+'</div>'
    +'<div style="font-size:21px;font-weight:700;line-height:1.1'+(col?(';color:'+col):'')+'">'+v+'</div>'
    +(sub?'<div class="stat-sub">'+sub+'</div>':'')+'</div>';
  const saldoMq=cMq-sMq,saldoMc=cMc-sMc;
  const testa='<div class="grid-4" style="margin-bottom:4px">'
    +kpi('Pannelli entrati',nfmt(cMq,2)+' m&sup2;',filtroC?'(i carichi non hanno commessa)':'nel periodo')
    +kpi('Pannelli usciti',nfmt(sMq,2)+' m&sup2;',filtroC?('commessa '+filtroC):'nel periodo')
    +kpi('Saldo pannelli',(saldoMq>=0?'+':'')+nfmt(saldoMq,2)+' m&sup2;',saldoMq>=0?'magazzino in crescita':'stai consumando scorte',saldoMq>=0?'var(--green)':'var(--red)')
    +kpi('Altre voci',' &euro; '+euro(eur),voci.length+' voci registrate')
    +'</div>'
    +'<div class="grid-4" style="margin-bottom:4px">'
    +kpi('Massicci entrati',nfmt(cMc,3)+' m&sup3;','nel periodo')
    +kpi('Massicci usciti',nfmt(sMc,3)+' m&sup3;','nel periodo')
    +kpi('Saldo massicci',(saldoMc>=0?'+':'')+nfmt(saldoMc,3)+' m&sup3;','',saldoMc>=0?'var(--green)':'var(--red)')
    +kpi('Scarichi',scar.length,cari.length+' carichi nello stesso periodo')
    +'</div>';

  // ---------- A. andamento ----------
  const carN=zeri(),scaN=zeri(),mqC=zeri(),mqS=zeri(),mcC=zeri(),mcS=zeri(),eu=zeri();
  cari.forEach(m=>{const i=idx(m.Data);if(i<0)return;carN[i]++;if(isMq(m.UnitaMisura))mqC[i]+=(+m.Quantita||0);if(isMc(m.UnitaMisura))mcC[i]+=(+m.Quantita||0);});
  scar.forEach(m=>{const i=idx(m.Data);if(i<0)return;scaN[i]++;if(isMq(m.UnitaMisura))mqS[i]+=(+m.Quantita||0);if(isMc(m.UnitaMisura))mcS[i]+=(+m.Quantita||0);});
  voci.forEach(v=>{const i=idx(v.Data);if(i>=0)eu[i]+=(+v.Importo||0);});

  const A=vizColonne('Pannelli: entrati e usciti','Metri quadri caricati contro consumati - se l\'arancione supera il verde stai mangiando le scorte',lab,
      [{nome:'Entrati',colore:VIZ.s3,dati:mqC},{nome:'Usciti',colore:VIZ.s2,dati:mqS}],2,'m2')
    +vizColonne('Massicci: entrati e usciti','Metri cubi caricati contro consumati',lab,
      [{nome:'Entrati',colore:VIZ.s3,dati:mcC},{nome:'Usciti',colore:VIZ.s2,dati:mcS}],3,'m3')
    +vizColonne('Operazioni per mese','Quante registrazioni di magazzino',lab,
      [{nome:'Carichi',colore:VIZ.s3,dati:carN},{nome:'Scarichi',colore:VIZ.s2,dati:scaN}],0,'movimenti')
    +vizColonne('Altre voci per mese','Conto lavorazione, forniture, trasporti, pasti - in euro',lab,
      [{nome:'euro',colore:VIZ.s4,dati:eu}],0,'euro');

  // ---------- B. dove va il materiale ----------
  const perMat={};
  scar.forEach(function(m){
    const k=(m.NomeArticolo||m.ArticoloID||'?')+'|'+(m.UnitaMisura||'');
    perMat[k]=perMat[k]||{nome:m.NomeArticolo||m.ArticoloID||'?',unita:m.UnitaMisura||'',q:0,n:0,comm:{}};
    perMat[k].q+=(+m.Quantita||0);perMat[k].n++;if(m.Commessa)perMat[k].comm[m.Commessa]=1;});
  const topUnita=function(test,dec,tit,sub,col){
    const r=Object.keys(perMat).filter(k=>test(perMat[k].unita)).map(k=>perMat[k])
      .sort((a,b)=>b.q-a.q).slice(0,10)
      .map(x=>({lab:x.nome,val:x.q,txt:nfmt(x.q,dec)+' '+x.unita,
        extra:x.n+' movimenti su '+Object.keys(x.comm).length+' commesse - '+pctUsoTxt(x.q,x.nome,x.unita)+' del caricato'}));
    return vizBarre(tit,sub,r,col);
  };
  const perComm={};
  scar.forEach(function(m){if(!m.Commessa)return;
    const c=perComm[m.Commessa]=perComm[m.Commessa]||{n:0,mq:0,mc:0,pz:0,mat:{}};
    c.n++;c.mat[m.NomeArticolo||'?']=1;
    if(isMq(m.UnitaMisura))c.mq+=(+m.Quantita||0);else if(isMc(m.UnitaMisura))c.mc+=(+m.Quantita||0);else c.pz+=(+m.Quantita||0);});
  const vociComm={};voci.forEach(v=>{const c=v.Commessa||'(senza commessa)';vociComm[c]=(vociComm[c]||0)+(+v.Importo||0);});

  const B=topUnita(isMq,2,'Pannelli piu consumati','I 10 materiali con piu metri quadri usati nel periodo',VIZ.s1)
    +topUnita(isMc,3,'Massicci piu consumati','I 10 legni con piu metri cubi usati',VIZ.s4)
    +topUnita(u=>u==='pz',0,'Articoli piu consumati','I 10 articoli a pezzi piu scaricati',VIZ.s3)
    +vizBarre('Materiali usati su piu commesse','Questi conviene tenerli sempre a scorta: servono di continuo',
      Object.keys(perMat).map(k=>({lab:perMat[k].nome,val:Object.keys(perMat[k].comm).length,
        txt:Object.keys(perMat[k].comm).length+' commesse',extra:nfmt(perMat[k].q,perMat[k].unita==='pz'?0:3)+' '+perMat[k].unita}))
        .filter(r=>r.val>1).sort((a,b)=>b.val-a.val).slice(0,12),VIZ.s1,'Nessun materiale usato su piu di una commessa nel periodo.')
    +vizBarre('Commesse per metri quadri di pannello','Dove sono finiti i pannelli',
      Object.keys(perComm).map(c=>({lab:c,val:perComm[c].mq,txt:nfmt(perComm[c].mq,2)+' m2',
        extra:perComm[c].n+' scarichi - '+Object.keys(perComm[c].mat).length+' materiali diversi'}))
        .filter(r=>r.val>0).sort((a,b)=>b.val-a.val).slice(0,12),VIZ.s1)
    +vizBarre('Commesse per costo delle altre voci','Conto lavorazione, forniture, trasporti: quanto pesa il non-magazzino',
      Object.keys(vociComm).map(c=>({lab:c,val:vociComm[c],txt:'&euro; '+euro(vociComm[c])}))
        .sort((a,b)=>b.val-a.val).slice(0,12),VIZ.s4,'Nessuna voce registrata nel periodo.');

  // ---------- C. cosa e fermo: soldi bloccati ----------
  // ultimo movimento per materiale + residuo disponibile
  const ultimo={},residuo={},caricoPrimo={};
  STATE.movimenti.filter(val).forEach(function(m){
    const n=m.NomeArticolo||m.ArticoloID;if(!n)return;
    const d=String(m.Data||'').slice(0,10);
    if(m.Tipo==='scarico'&&(!ultimo[n]||d>ultimo[n]))ultimo[n]=d;
    if(m.Tipo==='carico'&&(!caricoPrimo[n]||d<caricoPrimo[n]))caricoPrimo[n]=d;});
  STATE.pannelli.forEach(p=>{if(+p.M2_residuo>0){residuo[p.ArticoloID]=residuo[p.ArticoloID]||{q:0,u:'m2',n:0};
    residuo[p.ArticoloID].q+=(+p.M2_residuo||0);residuo[p.ArticoloID].n++;}});
  STATE.massicci.forEach(p=>{if(+p.M3_residuo>0){residuo[p.ArticoloID]=residuo[p.ArticoloID]||{q:0,u:'m3',n:0};
    residuo[p.ArticoloID].q+=(+p.M3_residuo||0);residuo[p.ArticoloID].n++;}});

  const fermi=Object.keys(residuo).map(function(n){
    let g=giorniDa(ultimo[n]); if(g!=null&&g<0)g=0;
    return {lab:n,val:(g==null?9999:g),txt:(g==null?'mai usato':g+' giorni'),
      extra:nfmt(residuo[n].q,residuo[n].u==='m2'?2:3)+' '+residuo[n].u+' fermi in '+residuo[n].n+' pezzi',
      colore:(g==null||g>180)?'#a4513f':(g>90?VIZ.s4:VIZ.s3)};
  }).sort((a,b)=>b.val-a.val).slice(0,14);
  const maiUsati=Object.keys(residuo).filter(n=>!ultimo[n])
    .map(n=>({lab:n,val:residuo[n].q,txt:nfmt(residuo[n].q,residuo[n].u==='m2'?2:3)+' '+residuo[n].u,
      extra:residuo[n].n+' pezzi, caricati il '+(caricoPrimo[n]?dataIt(caricoPrimo[n]):'?')}))
    .sort((a,b)=>b.val-a.val).slice(0,12);

  // residuo per fascia, in m2 e non in pezzi: quanto e davvero riusabile
  const fasce=[{lab:'Interi (oltre 90%)',min:90,max:1000,col:VIZ.s3},
               {lab:'Buoni (60-90%)',min:60,max:90,col:VIZ.s3},
               {lab:'Da valutare (30-60%)',min:30,max:60,col:VIZ.s4},
               {lab:'Ritagli (5-30%)',min:5,max:30,col:VIZ.s2},
               {lab:'Briciole (sotto 5%)',min:0.001,max:5,col:'#a4513f'}];
  const perFascia=fasce.map(function(f){
    const ps=STATE.pannelli.filter(p=>{const x=+p.Residuale_pct||0;return x>f.min&&x<=f.max;});
    const q=ps.reduce((s,p)=>s+(+p.M2_residuo||0),0);
    return {lab:f.lab,val:q,txt:nfmt(q,2)+' m2',extra:ps.length+' pezzi',colore:f.col};
  }).filter(r=>r.val>0);
  const totRes=STATE.pannelli.reduce((s,p)=>s+(+p.M2_residuo||0),0);

  const rifP=STATE.pannelli.filter(p=>/^R[0-9]/.test(p.ID));
  const rifM=STATE.massicci.filter(p=>/^RM[0-9]/.test(p.ID));
  const rifDisp=rifP.filter(p=>+p.M2_residuo>0),rifMDisp=rifM.filter(p=>+p.M3_residuo>0);

  const C=vizBarre('Materiale fermo da piu tempo','Giorni dall\'ultimo consumo - rosso oltre sei mesi. Sono soldi bloccati in officina',fermi,VIZ.s2,'Nessun materiale a residuo.')
    +vizBarre('Caricati e mai usati','Materiale entrato che non e mai stato scaricato su nessuna commessa',maiUsati,'#a4513f','Tutto il materiale a magazzino e stato usato almeno una volta.')
    +vizBarre('Quanto residuo e davvero riusabile','I '+nfmt(totRes,2)+' m2 residui divisi per stato del pezzo',perFascia,VIZ.s1)
    +vizBarre('Recupero dai rifili','Pezzi di refilo censiti e quanto ne resta',
      [{lab:'Rifili pannello disponibili',val:rifDisp.reduce((s,p)=>s+(+p.M2_residuo||0),0),
        txt:nfmt(rifDisp.reduce((s,p)=>s+(+p.M2_residuo||0),0),2)+' m2',extra:rifDisp.length+' pezzi su '+rifP.length+' censiti',colore:VIZ.s3},
       {lab:'Rifili massello disponibili',val:rifMDisp.reduce((s,p)=>s+(+p.M3_residuo||0),0)*100,
        txt:nfmt(rifMDisp.reduce((s,p)=>s+(+p.M3_residuo||0),0),3)+' m3',extra:rifMDisp.length+' pezzi su '+rifM.length+' censiti',colore:VIZ.s4}]
      .filter(r=>r.val>0),VIZ.s3,'Nessun rifilo censito.');

  // ---------- D. fornitori, rotazione, persone ----------
  const perForn={};
  STATE.pannelli.forEach(p=>{const f=p.Fornitore||'(non indicato)';perForn[f]=perForn[f]||{n:0,mq:0,res:0};
    perForn[f].n++;perForn[f].mq+=(+p.M2_originale||0);perForn[f].res+=(+p.M2_residuo||0);});
  const fornRows=Object.keys(perForn).map(k=>({lab:k,val:perForn[k].mq,txt:nfmt(perForn[k].mq,2)+' m2',
    extra:perForn[k].n+' pannelli - ancora a magazzino '+nfmt(perForn[k].res,2)+' m2'}))
    .sort((a,b)=>b.val-a.val).slice(0,12);
  // rotazione: giorni medi tra carico del pezzo e suo primo scarico
  const rot={};
  STATE.movimenti.filter(m=>val(m)&&m.Tipo==='scarico'&&m.PezzoID).forEach(function(m){
    const pid=String(m.PezzoID).split(',')[0].trim();
    const pz=STATE.pannelli.find(p=>p.ID===pid)||STATE.massicci.find(p=>p.ID===pid);
    if(!pz||!pz.DataCarico)return;
    const g=Math.round((new Date(String(m.Data).slice(0,10))-new Date(String(pz.DataCarico).slice(0,10)))/86400000);
    if(isNaN(g)||g<0)return;
    const n=m.NomeArticolo||m.ArticoloID||'?';
    rot[n]=rot[n]||{tot:0,n:0};rot[n].tot+=g;rot[n].n++;});
  const rotRows=Object.keys(rot).map(n=>({lab:n,val:Math.round(rot[n].tot/rot[n].n),
    txt:Math.round(rot[n].tot/rot[n].n)+' giorni',extra:'media su '+rot[n].n+' pezzi'}))
    .sort((a,b)=>b.val-a.val).slice(0,12);
  const perOp={};
  STATE.movimenti.filter(m=>val(m)&&dentro(m.Data)).forEach(m=>{const u=m.Utente||'(sconosciuto)';
    perOp[u]=perOp[u]||{n:0,c:0,s:0};perOp[u].n++;if(m.Tipo==='carico')perOp[u].c++;else perOp[u].s++;});

  const D=vizBarre('Fornitori per metri quadri forniti','Da chi arriva il materiale, e quanto ne resta a magazzino',fornRows,VIZ.s3)
    +vizBarre('Quanto sta fermo prima di essere usato','Giorni medi tra il carico di un pezzo e il suo primo scarico',rotRows,VIZ.s2,'Non ci sono ancora abbastanza dati.')
    +vizBarre('Chi registra le operazioni','Movimenti per operatore nel periodo',
      Object.keys(perOp).map(k=>({lab:k,val:perOp[k].n,txt:perOp[k].n,extra:perOp[k].c+' carichi - '+perOp[k].s+' scarichi'}))
        .sort((a,b)=>b.val-a.val),VIZ.s1);

  const avviso=filtroC?'<div class="info-box" style="margin-bottom:12px">Stai guardando la commessa <strong>'+filtroC+'</strong>. I carichi non hanno commessa, quindi i grafici su entrate, giacenze e fornitori restano su tutto il magazzino.</div>':'';

  return '<div class="viz">'+avviso+testa
    +vizSez('Andamento','Come si muove il magazzino nel periodo scelto')+'<div class="viz-grid">'+A+'</div>'
    +vizSez('Dove va il materiale','Cosa si consuma e su quali commesse')+'<div class="viz-grid">'+B+'</div>'
    +vizSez('Cosa e fermo','Materiale a magazzino che non si muove: e capitale bloccato')+'<div class="viz-grid">'+C+'</div>'
    +vizSez('Fornitori, tempi e persone','')+'<div class="viz-grid">'+D+'</div>'
    +'</div>';
}

// ---- RIPRISTINO DA BACKUP ----
function apriRipristino(){
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Ripristina da backup</h2>'
   +'<div class="alert alert-red"><strong>Attenzione:</strong> il ripristino reinserisce i dati dal file di backup nel database. I dati con lo stesso codice verranno <strong>sovrascritti</strong> con quelli del file. I dati creati dopo il backup che non sono nel file resteranno. Consigliato solo per recuperare dati persi.</div>'
   +'<div class="info-box">Scegli un file di backup (.json) scaricato in precedenza con il pulsante Backup.</div>'
   +'<button class="btn-primary" onclick="document.getElementById(\'restore-file\').click()">Scegli file di backup</button>'
   +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Annulla</button></div>');
}
function ripristinaBackup(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch(err){ toast("File non valido: non è un backup JSON","err"); return; }
    if(!data.articoli&&!data.movimenti){ toast("Il file non sembra un backup del magazzino","err"); return; }
    const conteggi=['articoli','pannelli','massicci','movimenti','commesse','fornitori'].map(k=>(data[k]||[]).length+' '+k).join(', ');
    openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Conferma ripristino</h2>'
     +'<div class="info-box">Backup del <strong>'+(data._data?new Date(data._data).toLocaleString('it-IT'):'data sconosciuta')+'</strong><br><br>Contiene: '+conteggi+'</div>'
     +'<div class="alert alert-red">Procedendo, questi dati verranno reinseriti nel database (sovrascrivendo quelli con lo stesso codice). Continuare?</div>'
     +'<div id="rip-prog" style="font-size:13px;color:var(--gray);margin-bottom:8px"></div>'
     +'<button class="btn-primary" style="background:var(--red)" onclick="eseguiRipristino()">Sì, ripristina ora</button>'
     +'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Annulla</button></div>');
    window._backupData=data;
  };
  reader.readAsText(file);
  input.value="";
}
async function eseguiRipristino(){
  const data=window._backupData; if(!data)return;
  const prog=document.getElementById("rip-prog");
  const setP=(t)=>{if(prog)prog.textContent=t;};
  const chunk=(arr,n)=>{const o=[];for(let i=0;i<arr.length;i+=n)o.push(arr.slice(i,i+n));return o;};
  async function up(table,rows,label){
    if(!rows||!rows.length)return;
    setP("Ripristino "+label+" ("+rows.length+")...");
    for(const c of chunk(rows,100)){ await sbUpsert(table,c); }
  }
  try{
    // ARTICOLI
    await up("articoli",(data.articoli||[]).map(a=>({id:a.ID,nome:a.Nome,categoria:a.Categoria,unita_misura:a.UnitaMisura,stock:parseFloat(a.Stock)||0,soglia_riordino:parseFloat(a.SogliaRiordino)||0,tipo_riordino:a.TipoRiordino||'manuale',urgenza:a.Urgenza||'media',fornitore:a.Fornitore||'',codice_fornitore:a.CodiceFornitore||'',is_pannello:(a.IsPannello===true||a.IsPannello==='SI'),note:a.Note||'',impegnato:parseFloat(a.Impegnato)||0})),"articoli");
    // FORNITORI

function scaricaBackup(){
  toast("Preparazione backup...");
  Promise.all([
    call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti"),
    call("getCommesse"),call("getFornitori"),call("getFabbisogno"),call("getOrdini"),
    call("getOfferte"),call("getRiserve"),call("getRettifiche"),call("getImmagini"),call("getModelli"),call("getVoci"),call("getPersonale"),call("getOre"),call("getDettature")
  ]).then(([articoli,pannelli,massicci,movimenti,commesse,fornitori,fabbisogni,ordini,offerte,riserve,rettifiche,immagini,modelli,voci,personale,ore,dettature])=>{
    const d=new Date();
    const pad=n=>String(n).padStart(2,"0");
    const stamp=pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear()+"_ore-"+pad(d.getHours())+"-"+pad(d.getMinutes());
    // 1) JSON completo (per il ripristino nell'app)
    const backup={_info:"Backup Magazzino Atelier Tonini",_data:new Date().toISOString(),articoli,pannelli,massicci,movimenti,commesse,fornitori,fabbisogni,ordini,offerte,riserve,rettifiche,immagini,modelli,voci,personale,ore,dettature};
    scaricaFile(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),"backup-magazzino_"+stamp+".json");
    // 2) Excel con un foglio per ogni tabella
    try{
      const wb=XLSX.utils.book_new();
      const aggiungi=(nome,dati)=>{ if(dati&&dati.length){ const ws=XLSX.utils.json_to_sheet(dati); XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,31)); } };
      aggiungi("Articoli",articoli); aggiungi("Pannelli",pannelli); aggiungi("Massicci",massicci);
      aggiungi("Movimenti",movimenti); aggiungi("Commesse",commesse); aggiungi("Fornitori",fornitori);
      aggiungi("Fabbisogni",fabbisogni); aggiungi("Ordini",ordini.map(o=>Object.assign({},o,{Righe:JSON.stringify(o.Righe||[])})));
      aggiungi("Offerte",offerte.map(o=>Object.assign({},o,{Dati:JSON.stringify(o.Dati||{})})));
      aggiungi("Riserve",riserve); aggiungi("Rettifiche",rettifiche); aggiungi("Immagini",immagini); aggiungi("Modelli",modelli); aggiungi("Altre voci",voci);
      const xbuf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      scaricaFile(new Blob([xbuf],{type:"application/octet-stream"}),"magazzino_"+stamp+".xlsx");
    }catch(e){console.error("Excel non generato:",e);}
    toast("Backup scaricato: JSON + Excel ("+(articoli.length)+" articoli, "+(pannelli.length)+" pannelli, "+(movimenti.length)+" movimenti)");
  }).catch(e=>toast("Errore backup: "+e.message,"err"));
}
function scaricaFile(blob,nome){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=nome;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function raccogliOrdine(){
  const g=riordiniRaggruppati().find(x=>x.fornitore===ORD_FORN); if(!g)return [];
  const righe=[];

    const qe=document.getElementById("ord-q-"+i),ne=document.getElementById("ord-n-"+i);
    const q=qe?qe.value:"",n=ne?ne.value:"";
    if(q&&+q>0)righe.push({ID:a.ID,Nome:a.Nome,CodiceFornitore:a.CodiceFornitore||"",Quantita:q,Unita:a.UnitaMisura,Note:n||""});
  });
  return righe;
}

function submitFornitore(nome){
  const em=[1,2,3].map(i=>document.getElementById("fo-email"+i).value.trim()).filter(Boolean).join(", ");
  const tel=document.getElementById("fo-tel").value.trim();
  const note=document.getElementById("fo-note").value.trim();

    if(!r.ok){showErr("fo-err",r.err||"Errore");return;}
    const i=STATE.fornitori.findIndex(x=>String(x.Nome).trim().toLowerCase()===String(nome).trim().toLowerCase());

let VISTA_DEF=(function(){try{return localStorage.getItem("at_vista")||"griglia";}catch(e){return "griglia";}})();
// densita delle griglie: quanto sono strette le schede. Salvata per utente.
const DENSITA={fitta:['150px','8px','Fitta'],media:['232px','12px','Media'],larga:['320px','16px','Larga']};
let DENS=(function(){try{return localStorage.getItem("at_densita")||"media";}catch(e){return "media";}})();
function applicaDensita(){
  const d=DENSITA[DENS]||DENSITA.media;
  try{document.body.style.setProperty('--pmin',d[0]);document.body.style.setProperty('--pgap',d[1]);}catch(e){}
}
function setDensita(v){DENS=v;try{localStorage.setItem("at_densita",v);}catch(e){}applicaDensita();}
function ctrlDensita(){
  return '<select onchange="setDensita(this.value)" title="Quanto stringere le schede" style="padding:6px 9px;border:1px solid var(--border);border-radius:9px;font-size:12px;background:#fff;cursor:pointer">'
    +Object.keys(DENSITA).map(k=>'<option value="'+k+'"'+(k===DENS?' selected':'')+'>'+DENSITA[k][2]+'</option>').join("")
    +'</select>';
}
function setVistaDefault(v){VISTA_DEF=v;ART_VIEW=PANN_VIEW=MASS_VIEW=v;try{localStorage.setItem("at_vista",v);}catch(e){}renderPage(STATE.pagina);toast("Vista "+(v==='griglia'?'Griglia':'Famiglie')+" impostata come predefinita");}
let ART_VIEW=VISTA_DEF;
function setArtView(v){setVistaDefault(v);}
function nomeTipo(id){const a=STATE.articoli.find(x=>x.ID===id);return a?a.Nome:id;}
function cardArticolo(a){const s=+a.Stock<=+a.SogliaRiordino;const sog=+a.SogliaRiordino||0;const pct=sog>0?Math.max(0,Math.min(100,(+a.Stock/(sog*2))*100)):(+a.Stock>0?100:0);const c=s?'var(--red)':colorPct(pct);const iu=imgUrlFor(a.ID);
  return '<div class="piece" onclick="openDettaglio(\'articolo\',\''+esc(a.ID)+'\')"><input type="checkbox" class="sel-chk" '+(SEL[a.ID]&&SELTIPO==='articolo'?'checked':'')+' onclick="toggleSel(event,\'articolo\',\''+esc(a.ID)+'\')"><div class="piece-row">'+(iu?'<img class="piece-thumb" src="'+iu+'" referrerpolicy="no-referrer">':'')+'<div class="piece-body"><h4>'+a.Nome+'</h4><small>'+a.ID+(ART_VIEW==='griglia'?(' - '+a.Categoria):'')+(a.Fornitore?(' - '+a.Fornitore):'')+'</small><div class="bar-wrap" style="margin-bottom:7px"><div class="bar-fill" style="width:'+pct+'%;background:'+c+'"></div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600;color:'+c+'">'+a.Stock+' '+a.UnitaMisura+(s?' (!)':'')+'</span><span style="color:var(--gray)">soglia '+a.SogliaRiordino+'</span></div>'+(impegnatoArt(a)>0?'<div style="margin-top:4px;font-size:10.5px;color:var(--accent)">di cui '+impegnatoArt(a)+' '+a.UnitaMisura+' destinati a commesse</div>':'')+'</div></div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn btn-green" style="flex:1" onclick="event.stopPropagation();openMovimento(\''+esc(a.ID)+'\',\'carico\')">Carico</button><button class="btn btn-red" style="flex:1" onclick="event.stopPropagation();openMovimento(\''+esc(a.ID)+'\',\'scarico\')">Scarico</button></div></div>';
}
function articoliCont(q,cat){
  let list=STATE.articoli.filter(a=>a.Categoria!=='Pannelli'&&a.Categoria!=='Massello'&&a.IsPannello!=='SI');
  if(cat)list=list.filter(a=>a.Categoria===cat);
  if(q){const s=q.toLowerCase();list=list.filter(a=>(a.Nome||"").toLowerCase().indexOf(s)>=0||(a.ID||"").toLowerCase().indexOf(s)>=0||(a.Fornitore||"").toLowerCase().indexOf(s)>=0||(a.CodiceFornitore||"").toLowerCase().indexOf(s)>=0||(a.Note||"").toLowerCase().indexOf(s)>=0);}
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessun articolo.</div>';
  if(ART_VIEW==='griglia'){const ord=list.slice().sort((a,b)=>String(a.Nome).localeCompare(String(b.Nome)));return '<div class="piece-grid">'+ord.map(cardArticolo).join("")+'</div>';}
  const g={}; list.forEach(a=>{(g[a.Categoria||'Altro']=g[a.Categoria||'Altro']||[]).push(a);});
  let html='';
  Object.keys(g).forEach(catName=>{
    const arr=g[catName],sotto=arr.filter(a=>+a.Stock<=+a.SogliaRiordino).length;
    html+='<div style="margin-bottom:26px"><div onclick="famTog(this)" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none"><span class="fam-c">▾</span><span style="font-weight:600;font-size:15px">'+catName+'</span><span class="badge badge-gray">'+arr.length+'</span>'+(sotto?'<span class="badge badge-red">'+sotto+' sotto soglia</span>':'')+'</div><div class="piece-grid">'+arr.map(cardArticolo).join("")+'</div></div>';
  });
  return html;
}
function filterArticoli(){
  document.getElementById("art-cont").innerHTML=articoliCont(document.getElementById("flt-art").value,document.getElementById("flt-cat").value);if(ART_VIEW==='fam')collassaFam();
}

function cardPannello(p){const pct=+p.Residuale_pct||0,c=colorPct(pct),iu=imgUrlFor(p.ArticoloID),art=STATE.articoli.find(a=>a.ID===p.ArticoloID);
  return '<div class="piece" onclick="openDettaglio(\'pannello\',\''+esc(p.ID)+'\')"><input type="checkbox" class="sel-chk" '+(SEL[p.ID]&&SELTIPO==='pannello'?'checked':'')+' onclick="toggleSel(event,\'pannello\',\''+esc(p.ID)+'\')"><div class="piece-row">'+(iu?'<img class="piece-thumb" src="'+iu+'" referrerpolicy="no-referrer">':'')+'<div class="piece-body"><h4>'+p.ID+'</h4><small>'+(PANN_VIEW==='griglia'?(nomeTipo(p.ArticoloID)+' - '):'')+p.Larghezza_mm+' x '+p.Altezza_mm+' mm</small><div class="bar-wrap" style="margin-bottom:7px"><div class="bar-fill" style="width:'+pct+'%;background:'+c+'"></div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600;color:'+c+'">'+pct.toFixed(0)+'%</span><span style="color:var(--gray)">'+(+p.M2_residuo||0).toFixed(2)+' m2</span></div>'+(p.Fornitore?'<div style="margin-top:5px;font-size:10.5px;color:var(--gray)">Forn: '+p.Fornitore+'</div>':'')+'</div></div><button class="btn btn-red" style="margin-top:9px;width:100%" onclick="event.stopPropagation();openScaricoPannello(\''+esc(p.ID)+'\')">Scarico</button></div>';

function pannelliCont(filtro){
  let list=STATE.pannelli;
  if(filtro){const q=filtro.toLowerCase();list=list.filter(p=>{const art=STATE.articoli.find(a=>a.ID===p.ArticoloID);return (p.ID+' '+(art?art.Nome:'')+' '+p.ArticoloID+' '+(p.Fornitore||'')+' '+(p.Note||'')).toLowerCase().indexOf(q)>=0;});}
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessun pannello.</div>';
  if(PANN_VIEW==='griglia'){const ord=list.slice().sort((a,b)=>String(a.ID).localeCompare(String(b.ID)));return '<div class="piece-grid">'+ord.map(cardPannello).join("")+'</div>';}
  const g={}; list.forEach(p=>{(g[p.ArticoloID]=g[p.ArticoloID]||[]).push(p);});
  let html='';
  Object.keys(g).forEach(id=>{
    const ps=g[id],art=STATE.articoli.find(a=>a.ID===id);
    const tot=ps.reduce((s,p)=>s+(+p.M2_residuo||0),0),us=ps.filter(p=>+p.Residuale_pct>10).length;const dest=destinatoPannelli(id);
    html+='<div style="margin-bottom:26px"><div onclick="famTog(this)" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none"><span class="fam-c">▾</span><span style="font-weight:600;font-size:15px">'+(art?art.Nome:id)+'</span><span class="badge badge-gray">'+id+'</span><span style="font-size:12px;color:var(--gray)">'+tot.toFixed(2)+' m2 residui'+(dest>0?(' <span style="color:var(--accent);text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();openDestinati(\''+esc(id)+'\',\'pannello\')">(di cui '+dest.toFixed(2)+' destinati a commesse)</span>'):'')+' - '+us+'/'+ps.length+' utilizzabili</span></div><div class="piece-grid">'+ps.map(cardPannello).join("")+'</div></div>';
  });
  return html;
}
function filtraPannelli(){document.getElementById("pann-cont").innerHTML=pannelliCont(document.getElementById("pann-q").value);if(PANN_VIEW==='fam')collassaFam();}

function cardMassiccio(p){const orig=+p.M3_originale||0,res=+p.M3_residuo||0,pct=orig>0?(res/orig)*100:0,c=colorPct(pct);const dim=p.Lunghezza_mm?(p.Lunghezza_mm+' x '+p.Larghezza_mm+' x '+p.Spessore_mm+' mm'):'lotto m3';const iu=imgUrlFor(p.ArticoloID),art=STATE.articoli.find(a=>a.ID===p.ArticoloID);

  const g={}; list.forEach(p=>{(g[p.ArticoloID]=g[p.ArticoloID]||[]).push(p);});
  let html='';
  Object.keys(g).forEach(id=>{
    const ps=g[id],art=STATE.articoli.find(a=>a.ID===id);

}
function filtraMassicci(){document.getElementById("mass-cont").innerHTML=massicciCont(document.getElementById("mass-q").value);if(MASS_VIEW==='fam')collassaFam();}

// -- MOVIMENTI --
let MOV_VIS=[];
function renderMovimenti(){
  return '<h1 class="page-title">Movimenti</h1>'
  +'<div class="filters"><select id="flt-tipo" onchange="filterMov()"><option value="">Tutti i tipi</option><option value="carico">Solo carichi</option><option value="scarico">Solo scarichi</option></select>'
  +'<input id="flt-comm" placeholder="Filtra commessa..." oninput="filterMov()">'
  +'<input id="flt-txt" placeholder="Cerca materiale, pezzo, note..." oninput="filterMov()"></div>'
  +'<div class="info-box">Spunta le caselle a sinistra per lavorare su piu movimenti insieme: cambiare la commessa o annullarli in blocco.</div>'
  +'<div class="table-wrap"><table><thead><tr><th style="width:34px"><input type="checkbox" id="mov-all" onclick="selAllMov(this)" style="width:17px;height:17px;accent-color:var(--accent);cursor:pointer"></th><th>Data</th><th>Operatore</th><th>Articolo</th><th>Cod. forn.</th><th>Tipo</th><th>Quantita</th><th>Fornitore</th><th>Commessa</th></tr></thead><tbody id="tbody-mov">'+rowsMov(STATE.movimenti.slice().reverse())+'</tbody></table></div>';
}
function selAllMov(chk){
  if(SELTIPO!=='movimento'){SEL={};SELTIPO='movimento';}
  if(chk.checked)MOV_VIS.forEach(id=>{SEL[id]=true;});
  else {MOV_VIS.forEach(id=>{delete SEL[id];});if(!Object.keys(SEL).length)SELTIPO=null;}
  document.getElementById("tbody-mov").innerHTML=rowsMov(movFiltrati());
  renderBulkBar();
}
function rowsMov(list){
  const cfDi=(m)=>{let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);return (art&&art.CodiceFornitore)||'-';};
  MOV_VIS=list.map(m=>m.ID);
  return list.map(m=>'<tr style="opacity:'+(m.Annullato==='SI'?.45:1)+'" onclick="openDettaglio(\'movimento\',\''+esc(m.ID)+'\')"><td><input type="checkbox" '+(SEL[m.ID]&&SELTIPO==='movimento'?'checked':'')+' onclick="toggleSel(event,\'movimento\',\''+esc(m.ID)+'\')" style="width:17px;height:17px;accent-color:var(--accent);cursor:pointer"></td><td style="font-size:11px;font-family:monospace;color:var(--gray)">'+String(m.Data||"").slice(0,16)+'</td><td style="font-size:12px">'+(m.Utente||"")+'</td><td style="font-weight:600">'+(m.NomeArticolo||"")+'</td><td style="font-size:11.5px;color:var(--gray)">'+cfDi(m)+'</td><td><span class="badge '+(m.Tipo==='carico'?'badge-green':'badge-red')+'">'+(m.Tipo||"")+'</span></td><td style="font-weight:600;color:'+(m.Tipo==='carico'?'var(--green)':'var(--red)')+'">'+(m.Tipo==='carico'?'+':'-')+m.Quantita+' '+m.UnitaMisura+'</td><td style="font-size:11.5px;color:var(--gray)">'+(m.Fornitore||'-')+'</td><td style="font-size:11px;font-family:monospace;color:var(--gray)">'+(m.Commessa||"-")+'</td></tr>').join("")||'<tr><td colspan="9" style="text-align:center;color:var(--gray);padding:26px">Nessun movimento</td></tr>';
}
function movFiltrati(){
  const te=document.getElementById("flt-tipo"),ce=document.getElementById("flt-comm"),xe=document.getElementById("flt-txt");
  const t=te?te.value:"",c=ce?ce.value.toLowerCase():"",x=xe?xe.value.toLowerCase():"";
  return STATE.movimenti.slice().reverse().filter(m=>(!t||m.Tipo===t)
    &&(!c||(m.Commessa||"").toLowerCase().includes(c))
    &&(!x||((m.NomeArticolo||'')+' '+(m.ArticoloID||'')+' '+(m.PezzoID||'')+' '+(m.Note||'')+' '+(m.Fornitore||'')+' '+(m.Utente||'')).toLowerCase().includes(x)));
}
function filterMov(){document.getElementById("tbody-mov").innerHTML=rowsMov(movFiltrati());}


// ---- OPERAZIONI IN BLOCCO SUI MOVIMENTI ----
function movSelezionati(){return Object.keys(SEL).map(id=>STATE.movimenti.find(m=>m.ID===id)).filter(Boolean);}
function openCommessaMovBulk(){
  const ms=movSelezionati(); if(!ms.length)return;
  const conPezzo=ms.filter(m=>String(m.PezzoID||'').trim()).length;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Cambia commessa a '+ms.length+' movimenti</h2>'
   +'<div class="info-box">La commessa verra riscritta su tutti i movimenti selezionati.'
   +(conPezzo?(' Per i '+conPezzo+' movimenti legati a un pezzo viene aggiornato anche il pezzo, cosi i report restano allineati.'):'')+'</div>'
   +'<div class="form-group"><label>Nuova commessa</label><select id="bm-comm">'+optCommesse()+'</select></div>'
   +'<div id="bm-err"></div><button class="btn-primary" onclick="submitCommessaMovBulk()">Applica a tutti</button></div>');
}
function submitCommessaMovBulk(){
  const c=document.getElementById("bm-comm").value;
  const ms=movSelezionati();
  toast("Aggiornamento di "+ms.length+" movimenti...");
  Promise.all(ms.map(function(m){
    const pezzi=String(m.PezzoID||'').split(',').map(s=>s.trim()).filter(Boolean);
    const p=call("modificaMovimento",{movId:m.ID,Commessa:c});
    // se il movimento riguarda un solo pezzo, allineo anche il pezzo
    if(pezzi.length===1){
      const tipo=STATE.pannelli.some(x=>x.ID===pezzi[0])?'pannello':(STATE.massicci.some(x=>x.ID===pezzi[0])?'massiccio':null);
      if(tipo)return p.then(()=>call("assegnaPezzoSingolo",{tipo:tipo,id:pezzi[0],commessa:c}));
    }
    return p;
  })).then(function(){
    Promise.all([call("getMovimenti"),call("getPannelli"),call("getMassicci")]).then(([mv,pn,mm])=>{
      STATE.movimenti=mv||[];STATE.pannelli=pn||[];STATE.massicci=mm||[];
      closeModal();clearSel(true);renderPage(STATE.pagina);toast("Commessa aggiornata su "+ms.length+" movimenti");});
  }).catch(e=>showErr("bm-err",e.message||"Errore"));
}
function openFornitoreMovBulk(){
  const ms=movSelezionati(); if(!ms.length)return;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Cambia fornitore a '+ms.length+' movimenti</h2>'
   +'<div class="form-group"><label>Fornitore</label><input id="bf-forn" list="bf-l" autocomplete="off"><datalist id="bf-l">'+(STATE.fornitori||[]).map(f=>'<option value="'+att(f.Nome)+'">').join("")+'</datalist></div>'
   +'<div id="bf-err"></div><button class="btn-primary" onclick="submitFornitoreMovBulk()">Applica a tutti</button></div>');
}

// ---- QUANTO E' STATO CARICATO A MAGAZZINO, per calcolare la % di utilizzo ----
// Pannelli e massicci: somma delle superfici/volumi originali dei pezzi.
// Articoli: somma dei movimenti di carico.
function caricatoDi(nome,unita){
  const p=STATE.pannelli.filter(x=>x.ArticoloID===nome).reduce((s,x)=>s+(+x.M2_originale||0),0);
  if(p>0)return p;
  const m=STATE.massicci.filter(x=>x.ArticoloID===nome).reduce((s,x)=>s+(+x.M3_originale||0),0);
  if(m>0)return m;
  return STATE.movimenti.filter(x=>x.Annullato!=='SI'&&x.Tipo==='carico'
    &&(x.NomeArticolo===nome||x.ArticoloID===nome)
    &&(!unita||x.UnitaMisura===unita)).reduce((s,x)=>s+(+x.Quantita||0),0);
}
function pctUsoTxt(usato,nome,unita){
  const car=caricatoDi(nome,unita);
  if(!car)return '-';
  return (usato/car*100).toFixed(1)+'%';
}
function pctUsoNum(usato,nome,unita){
  const car=caricatoDi(nome,unita);
  return car?(usato/car*100):null;
}
function colorePct(p){return p==null?'inherit':(p>=90?'var(--red)':(p>=60?'var(--amber)':'var(--green)'));}
// ---- UTILIZZO MATERIALI: dove e finito ogni materiale, quanto e quando ----
function utilizzoDati(filtro){
  const q=String(filtro||'').trim().toLowerCase();
  const mv=STATE.movimenti.filter(m=>m.Annullato!=='SI'&&m.Tipo==='scarico');
  const g={};
  const artDi=function(m){let a=(STATE.articoli||[]).find(x=>x.ID===m.ArticoloID);
    if(!a)a=(STATE.articoli||[]).find(x=>x.Nome===m.NomeArticolo||x.Nome===m.ArticoloID);return a||{};};
  mv.forEach(function(m){
    const nome=m.NomeArticolo||m.ArticoloID||'(senza nome)';
    const pezzi=String(m.PezzoID||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(q&&(nome+' '+pezzi.join(' ')+' '+(m.Commessa||'')+' '+(m.ArticoloID||'')+' '+(m.Note||'')+' '+(m.Utente||'')).toLowerCase().indexOf(q)<0)return;
    const a=artDi(m);
    const k=nome+'|'+(m.UnitaMisura||'');
    g[k]=g[k]||{nome:nome,unita:m.UnitaMisura||'',tot:0,nmov:0,pezziTot:[],forn:[],comm:{},
                codForn:a.CodiceFornitore||'',categoria:a.Categoria||''};
    const x=g[k];
    x.tot+=(+m.Quantita||0); x.nmov++;
    pezzi.forEach(p=>{if(x.pezziTot.indexOf(p)<0)x.pezziTot.push(p);});
    let forn=m.Fornitore||'';
    if(!forn&&pezzi.length){const pz=STATE.pannelli.find(p=>p.ID===pezzi[0])||STATE.massicci.find(p=>p.ID===pezzi[0]);if(pz)forn=pz.Fornitore||'';}
    if(!forn)forn=a.Fornitore||'';
    if(forn&&x.forn.indexOf(forn)<0)x.forn.push(forn);
    const c=m.Commessa||'(senza commessa)';
    const cc=x.comm[c]=x.comm[c]||{q:0,n:0,pezzi:[],dal:'',al:'',det:[]};
    cc.q+=(+m.Quantita||0); cc.n++;
    pezzi.forEach(p=>{if(cc.pezzi.indexOf(p)<0)cc.pezzi.push(p);});
    const d=String(m.Data||'').slice(0,10);
    if(d){if(!cc.dal||d<cc.dal)cc.dal=d;if(!cc.al||d>cc.al)cc.al=d;}
    cc.det.push({data:String(m.Data||'').slice(0,16),q:(+m.Quantita||0),unita:m.UnitaMisura||'',
      pezzo:pezzi.join(', ')||'-',note:m.Note||'',chi:m.Utente||'',forn:forn||''});
  });
  (STATE.voci||[]).forEach(function(v){
    const nome=v.Descrizione||'(senza descrizione)';
    if(q&&(nome+' '+(v.Categoria||'')+' '+(v.Commessa||'')+' '+(v.Fornitore||'')+' '+(v.NrFattura||'')+' '+(v.Note||'')).toLowerCase().indexOf(q)<0)return;
    const k='~voce|'+nome.toLowerCase()+'|'+(v.Categoria||'');
    g[k]=g[k]||{nome:nome,unita:v.Unita||'',tot:0,imp:0,nmov:0,pezziTot:[],forn:[],comm:{},
                voce:true,categoria:v.Categoria||'Altro',ft:[]};
    const x=g[k];
    x.tot+=(+v.Quantita||0); x.imp+=(+v.Importo||0); x.nmov++;
    if(v.Fornitore&&x.forn.indexOf(v.Fornitore)<0)x.forn.push(v.Fornitore);
    if(v.NrFattura&&x.ft.indexOf(v.NrFattura)<0)x.ft.push(v.NrFattura);
    const c=v.Commessa||'(senza commessa)';
    const cc=x.comm[c]=x.comm[c]||{q:0,imp:0,n:0,pezzi:[],dal:'',al:'',det:[]};
    cc.q+=(+v.Quantita||0); cc.imp+=(+v.Importo||0); cc.n++;
    const d=String(v.Data||'').slice(0,10);
    if(d){if(!cc.dal||d<cc.dal)cc.dal=d;if(!cc.al||d>cc.al)cc.al=d;}
    cc.det.push({data:d,q:(+v.Quantita||0),unita:v.Unita||'',imp:(+v.Importo||0),
      forn:v.Fornitore||'',ft:v.NrFattura||'',stato:v.Stato||'',note:v.Note||''});
  });
  return g;
}
function dataIt(d){if(!d)return '-';const p=String(d).slice(0,10).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):d;}
function nDec(u){return (u==='pz'||!u)?0:3;}
function periodoDi(x){let dal='',al='';Object.keys(x.comm).forEach(function(c){const cc=x.comm[c];
  if(cc.dal&&(!dal||cc.dal<dal))dal=cc.dal;if(cc.al&&(!al||cc.al>al))al=cc.al;});return [dal,al];}
function metaDi(x){
  const p=periodoDi(x),meta=[x.nmov+(x.voce?' voci':' movimenti'),Object.keys(x.comm).length+' commesse'];
  if(!x.voce&&x.pezziTot.length)meta.push(x.pezziTot.length+' pezzi');
  meta.push('dal '+dataIt(p[0])+' al '+dataIt(p[1]));
  if(x.forn.length)meta.push('fornitori: '+x.forn.join(', '));
  if(x.codForn)meta.push('cod. forn. '+x.codForn);
  if(x.voce&&x.ft&&x.ft.length)meta.push('fatture: '+x.ft.join(', '));
  return meta.join(' &middot; ');
}
function utilizzoCont(filtro){
  const g=utilizzoDati(filtro);
  const keys=Object.keys(g).sort((a,b)=>((g[a].voce?1:0)-(g[b].voce?1:0))||g[a].nome.localeCompare(g[b].nome));
  if(!keys.length)return '<div class="card" style="color:var(--gray)">Nessun consumo trovato'+(filtro?' per "'+filtro+'"':'')+'.</div>';
  return keys.map(function(k){
    const x=g[k],dec=nDec(x.unita);
    const testa='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">'
      +'<div><div style="font-weight:600;font-size:14px">'+x.nome
      +(x.voce?(' <span class="badge badge-accent">'+x.categoria+'</span>'):(x.categoria?(' <span class="badge badge-gray">'+x.categoria+'</span>'):''))+'</div>'
      +'<div style="font-size:11.5px;color:var(--gray);margin-top:3px">'+metaDi(x)+'</div></div>'
      +'<div style="text-align:right;white-space:nowrap"><div style="font-size:18px;font-weight:700;color:var(--accent)">'
      +(x.voce?('&euro; '+euro(x.imp)):(x.tot.toFixed(dec)+' '+x.unita))+'</div>'
      +(x.voce&&x.tot?('<div style="font-size:11.5px;color:var(--gray)">'+x.tot+' '+x.unita+'</div>'):'')
      +(!x.voce?('<div style="font-size:12px;font-weight:600;margin-top:2px;color:'+colorePct(pctUsoNum(x.tot,x.nome,x.unita))+'">'+pctUsoTxt(x.tot,x.nome,x.unita)+' del caricato</div>'):'')
      +'</div></div>';
    const righe=Object.keys(x.comm).sort().map(function(c){
      const cc=x.comm[c];
      const pctC=x.voce?(x.imp?((cc.imp/x.imp*100).toFixed(1)+'%'):'-'):pctUsoTxt(cc.q,x.nome,x.unita);
      const tot=(x.voce?('&euro; '+euro(cc.imp)+(cc.q?(' &middot; '+cc.q+' '+x.unita):'')):(cc.q.toFixed(dec)+' '+x.unita))
        +' <span style="font-weight:600;color:'+(x.voce?'var(--gray)':colorePct(pctUsoNum(cc.q,x.nome,x.unita)))+'">'+pctC+'</span>';
      const th=x.voce?['Data','Importo','%','Q.ta','Fornitore','Fattura','Stato','Note']:['Data','Quantita','%','Pezzi','Fornitore','Operatore','Note'];
      const det=cc.det.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).map(function(r){
        const pr=x.voce?(x.imp?((r.imp/x.imp*100).toFixed(1)+'%'):'-'):pctUsoTxt(r.q,x.nome,x.unita);
        const dx=x.voce
          ? [dataIt(r.data),(r.imp?('&euro; '+euro(r.imp)):''),pr,(r.q?(r.q+' '+r.unita):''),r.forn,(r.ft?('ft. '+r.ft):''),r.stato,r.note]
          : [dataIt(r.data),r.q.toFixed(dec)+' '+r.unita,pr,r.pezzo,r.forn,r.chi,r.note];
        return '<tr>'+dx.map(function(v,i){return '<td style="padding:3px 6px;border-top:1px solid var(--border)'+(i===1?';text-align:right;font-weight:600;white-space:nowrap':'')+(i===2?';text-align:center;color:var(--gray)':'')+'">'+(v||'-')+'</td>';}).join("")+'</tr>';
      }).join("");
      return '<div style="padding:10px 0;border-top:1px solid var(--border)">'
        +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:3px">'
        +'<span style="font-family:monospace;font-weight:700">'+c+'</span><span style="font-weight:700">'+tot+'</span></div>'
        +'<div style="font-size:11.5px;color:var(--gray);margin-bottom:5px">'+cc.n+(x.voce?' voci':' movimenti')+' &middot; dal '+dataIt(cc.dal)+' al '+dataIt(cc.al)+((!x.voce&&cc.pezzi.length)?(' &middot; '+cc.pezzi.length+' pezzi'):'')+'</div>'
        +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px"><thead><tr>'
        +th.map(function(t){return '<th style="text-align:left;padding:3px 6px;color:var(--gray);font-size:10px;text-transform:uppercase;letter-spacing:.4px">'+t+'</th>';}).join("")
        +'</tr></thead><tbody>'+det+'</tbody></table></div></div>';
    }).join("");
    return '<div class="card" style="margin-bottom:10px">'+testa+righe+'</div>';
  }).join("");
}

}
function buildReportCommessa(comm){

  const movs=movCommessa(comm).filter(m=>m.Tipo==="scarico");
  const cfDi=(m)=>{let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);return (art&&art.CodiceFornitore)||'';};
  const codeDi=(m)=>{if(m.PezzoID)return m.PezzoID;let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);return (art&&/^ART-/.test(art.ID))?art.ID:'-';};
  const tot={}; movs.forEach(m=>{const cf=cfDi(m);const k=m.NomeArticolo+'||'+m.UnitaMisura+'||'+cf; if(!tot[k])tot[k]={nome:m.NomeArticolo,unita:m.UnitaMisura,cf:cf,q:0,n:0,pezzi:[]}; tot[k].q+=(+m.Quantita||0); tot[k].n++; if(m.PezzoID)String(m.PezzoID).split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{if(tot[k].pezzi.indexOf(p)<0)tot[k].pezzi.push(p);});});
  const righeTot=Object.keys(tot).map(k=>{const t=tot[k];
    // Ordina i codici pezzo (P1014, P1015...) in ordine
    t.pezzi.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const nPezzi=t.pezzi.length;

  // ---- Manodopera e trasferte ----
  const oreC=oreDiCommessa(comm).slice().sort((a,b)=>String(b.Data).localeCompare(String(a.Data)));

    const rp=Object.keys(perP).sort().map(function(n){const x=oreTot(perP[n]);

    const rd=oreC.map(function(r){

       +(r.Note?(' <span style="color:#777">'+r.Note+'</span>'):'')+'</td>'

    oreBlock='<h3 style="font-size:15px;margin:18px 0 8px">Manodopera e trasferte</h3>'
     +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:10px"><thead>'

  // ---- Quadro economico: quello che sappiamo valorizzare in euro ----
  const totVociTutte=(STATE.voci||[]).filter(v=>v.Commessa===comm).reduce((s,v)=>s+(+v.Importo||0),0);
  let quadro='';
  if(totVociTutte||tOre.tot){
    const rQ=(k,v,g)=>'<tr'+(g?' style="background:#efefef;font-weight:bold"':'')+'><td>'+k+'</td><td align="right">&euro; '+euro(v)+'</td></tr>';
    quadro='<h3 style="font-size:15px;margin:18px 0 8px">Quadro economico</h3>'
     +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:6px"><tbody>'
     +rQ('Altre voci di commessa',totVociTutte)
     +rQ('Manodopera ('+nOre(tOre.ore)+' h)',tOre.costo)
     +rQ('Rimborsi chilometrici ('+nOre(tOre.km)+' km)',tOre.rimborso)
     +rQ('Totale costi valorizzati',totVociTutte+tOre.tot,true)
     +'</tbody></table>'
     +'<div style="font-size:11px;color:#999;margin-bottom:6px">I materiali di magazzino sono elencati in quantità e non sono valorizzati in euro.</div>';
  }
  const rett=(STATE.rettifiche||[]).filter(r=>r.Commessa===comm);
  const rettBlock=rett.length?('<h3 style="font-size:15px;margin:18px 0 8px">Rettifiche manuali</h3><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Voce</th><th align="left">Valore</th><th align="left">Note</th></tr></thead><tbody>'+rett.map(r=>'<tr><td>'+r.Voce+'</td><td>'+r.Valore+'</td><td>'+r.Note+'</td></tr>').join("")+'</tbody></table>'):'';
  const oggi=new Date().toLocaleDateString('it-IT');
  return '<div style="font-family:Georgia,serif;color:#3a342d">'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #8a6d4e;padding-bottom:10px;margin-bottom:16px"><div><div style="font-size:20px;font-weight:700;color:#8a6d4e">Atelier Tonini</div><div style="font-size:13px;color:#777">Report commessa</div></div><div style="text-align:right;font-size:12px;color:#777">Generato il '+oggi+'</div></div>'
   +'<table style="width:100%;font-size:13px;margin-bottom:16px"><tr><td style="color:#777;width:130px">Commessa</td><td style="font-weight:700">'+c.ID+'</td></tr>'+(c.Nome&&c.Nome!==c.ID?'<tr><td style="color:#777">Descrizione</td><td>'+c.Nome+'</td></tr>':'')+(c.Cliente?'<tr><td style="color:#777">Cliente</td><td>'+c.Cliente+'</td></tr>':'')+'</table>'
   +'<h3 style="font-size:15px;margin-bottom:8px">Materiali consumati</h3>'
   +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px;margin-bottom:18px"><thead><tr style="background:#f0e9e0"><th align="left">Materiale</th><th align="center">Cod. forn.</th><th align="right">Totale</th><th align="center">% del caricato</th><th align="center">N. pezzi</th><th align="right">N. mov.</th></tr></thead><tbody>'+righeTot+'</tbody></table>'
   +vociBlock
   +oreBlock
   +quadro
   +'<h3 style="font-size:15px;margin-bottom:8px">Dettaglio movimenti</h3>'
   +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Data</th><th align="left">Materiale</th><th align="center">Cod. forn.</th><th align="left">Codice</th><th align="right">Quantita</th><th align="center">% del caricato</th><th align="left">Note</th><th align="left">Operatore</th></tr></thead><tbody>'+righeMov+'</tbody></table>'
   +rettBlock
   +'</div>';
}
function openReportCommessa(comm){
  call("getRettifiche").then(rt=>{STATE.rettifiche=rt||[];_openReportCommessa(comm);}).catch(()=>{STATE.rettifiche=STATE.rettifiche||[];_openReportCommessa(comm);});
}

     +'<div class="det-row" style="border-bottom:none"><span style="font-weight:700">Totale</span>'

     +'<button class="btn btn-ghost" style="margin-top:10px" onclick="ORE_COMM=\''+esc(comm)+'\';ORE_DA=\'\';ORE_A=\'\';ORE_TAB=\'commessa\';closeModal();navTo(\'ore\')">Apri il mastrino di questa commessa</button>'
     +'</div>';
  } else {
    schedaOre='<div class="card" style="margin-top:14px"><div class="card-title">Manodopera e trasferte</div>'
     +'<div style="color:var(--gray);font-size:13px">Nessuna ora registrata su questa commessa.</div>'
     +'<button class="btn btn-accent" style="margin-top:10px" onclick="ORE_COMM=\''+esc(comm)+'\';closeModal();openNuovaOra()">Registra ore su questa commessa</button></div>';

    +'<div class="form-row" style="margin-top:8px"><div class="form-group" style="margin:0"><label>Voce</label><input id="rt-v" placeholder="es. Cerniere consegnate"></div><div class="form-group" style="margin:0"><label>Valore</label><input id="rt-val" placeholder="es. 50 pz"></div></div><div class="form-group"><label>Note</label><input id="rt-n"></div><button class="btn btn-accent" onclick="addRettifica(\''+esc(comm)+'\')">+ Aggiungi rettifica</button></div>';

    +'<div style="flex:1;font-family:Georgia,serif;font-size:17px;font-weight:600">Commessa '+comm+'</div>'

    +'<button class="btn btn-green" onclick="csvReportCommessa(\''+esc(comm)+'\')">CSV</button>'

// Riepilogo materiali DESTINATI a questa commessa ma NON ancora scaricati, con azioni
// quanto e gia stato scaricato di QUESTO pezzo su QUESTA commessa
function usatoSuCommessa(pezzoId,comm){
  return STATE.movimenti.filter(m=>m.Annullato!=='SI'&&m.Tipo==='scarico'&&m.Commessa===comm
    &&String(m.PezzoID||'').split(',').map(x=>x.trim()).indexOf(pezzoId)>=0)
    .reduce((s,m)=>s+(+m.Quantita||0),0);
}
function destinatiNonScaricati(comm){
  const out={articoli:[],pannelli:[],massicci:[]};
  // Articoli: dalle riserve
  (STATE.riserve||[]).filter(r=>r.Commessa===comm&&r.Quantita>0).forEach(r=>{
    const a=STATE.articoli.find(x=>x.ID===r.ArticoloID)||{};
    out.articoli.push({id:r.ArticoloID,nome:a.Nome||r.ArticoloID,q:r.Quantita,unita:a.UnitaMisura||''});
  });
  // Pannelli assegnati a questa commessa con residuo
  STATE.pannelli.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(comm)>=0 && (+p.M2_residuo>0)).forEach(p=>{
    out.pannelli.push({id:p.ID,nome:nomeTipo(p.ArticoloID),q:+p.M2_residuo||0,
      orig:+p.M2_originale||0,usato:usatoSuCommessa(p.ID,comm),unita:'m2',dec:2});
  });
  // Massicci assegnati con residuo
  STATE.massicci.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(comm)>=0 && (+p.M3_residuo>0)).forEach(p=>{
    out.massicci.push({id:p.ID,nome:nomeTipo(p.ArticoloID),q:+p.M3_residuo||0,
      orig:+p.M3_originale||0,usato:usatoSuCommessa(p.ID,comm),unita:'m3',dec:3});
  });
  return out;
}
function buildDestinatiSection(comm){
  const d=destinatiNonScaricati(comm);
  const tutti=d.articoli.concat(d.pannelli,d.massicci);
  if(!tutti.length)return '<div class="card" style="margin-top:14px"><div class="card-title">Materiale riservato a questa commessa</div><div style="color:var(--gray);font-size:13px">Niente in attesa: tutto il materiale destinato e gia stato scaricato.</div></div>';

  // separo i pezzi mai toccati da quelli gia usati in parte su questa commessa
  const mai=[],parz=[];
  d.articoli.forEach(it=>mai.push(Object.assign({tipo:'articolo'},it)));
  d.pannelli.forEach(it=>((it.usato>0)?parz:mai).push(Object.assign({tipo:'pannello'},it)));
  d.massicci.forEach(it=>((it.usato>0)?parz:mai).push(Object.assign({tipo:'massiccio'},it)));

  const riga=function(cls,it,destro,sotto){
    return '<label style="display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid var(--border);cursor:pointer">'
      +'<input type="checkbox" class="'+cls+'" data-tipo="'+it.tipo+'" value="'+esc(it.id)+'" style="width:17px;height:17px;margin-top:2px;accent-color:var(--accent)">'
      +'<span style="flex:1;font-size:13px">'+(/^[PMR]/.test(it.id)?('<strong>'+it.id+'</strong> - '):'')+it.nome
      +(sotto?('<div style="font-size:11.5px;color:var(--gray);margin-top:2px">'+sotto+'</div>'):'')+'</span>'
      +'<span style="font-size:12px;color:var(--gray);white-space:nowrap">'+destro+'</span></label>';
  };

  let h='';

  if(mai.length){
    h+='<div class="card" style="margin-top:14px"><div class="card-title">Riservati e non ancora usati &mdash; '+mai.length+'</div>'
      +'<div style="font-size:11.5px;color:var(--gray);margin-bottom:6px">Materiale messo da parte per questa commessa che non e ancora stato toccato. Qui ha senso chiedersi se scaricarlo tutto.</div>';
    mai.forEach(function(it){
      const q=it.tipo==='articolo'?(it.q+' '+(it.unita||'')):(nfmt(it.q,it.dec)+' '+it.unita);
      h+=riga('ds-chk-m',it,q,'');
    });
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
      +'<button class="btn btn-red" onclick="scaricaDestinati(\''+esc(comm)+'\',false,\'m\')">Scarica sulla commessa</button>'
      +'<button class="btn btn-ghost" onclick="scaricaDestinati(\''+esc(comm)+'\',true,\'m\')">Rimetti a magazzino</button>'
      +'</div><div style="font-size:11px;color:var(--gray);margin-top:6px">Senza spunte le azioni valgono per tutti quelli di questo gruppo.</div></div>';
  }

  if(parz.length){
    h+='<div class="card" style="margin-top:14px"><div class="card-title">Gia usati in parte su questa commessa &mdash; '+parz.length+'</div>'
      +'<div class="info-box" style="margin-bottom:8px">Questi pezzi li hai <strong>gia tagliati</strong> per la commessa. Il residuo non e materiale in attesa: e avanzo utilizzabile. Non serve deciderne la sorte adesso &mdash; lascialo cosi se pensi di continuare a usarlo qui, oppure rimettilo a magazzino se hai finito.</div>';
    parz.forEach(function(it){
      const pct=it.orig?Math.round(it.usato/it.orig*100):0;
      const resta=it.orig?Math.round(it.q/it.orig*100):0;
      h+=riga('ds-chk-p',it,nfmt(it.q,it.dec)+' '+it.unita+' liberi',
        'usato su questa commessa <strong>'+nfmt(it.usato,it.dec)+' '+it.unita+'</strong> ('+pct+'%) &middot; resta il '+resta+'% del pezzo');
    });
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
      +'<button class="btn btn-ghost" onclick="scaricaDestinati(\''+esc(comm)+'\',true,\'p\')">Ho finito: rimetti il residuo a magazzino</button>'
      +'<button class="btn btn-red" onclick="scaricaDestinati(\''+esc(comm)+'\',false,\'p\')">Addebita anche il residuo a questa commessa</button>'
      +'</div><div style="font-size:11px;color:var(--gray);margin-top:6px">Se non fai niente il pezzo resta riservato qui e lo ritrovi al prossimo taglio.</div></div>';
  }

  return h;
}
// Raccoglie le selezioni; se nessuna, prende tutto
function _raccogliDestinati(comm,gruppo){
  const cls='.ds-chk-'+(gruppo||'m');
  const chk=Array.prototype.slice.call(document.querySelectorAll(cls+':checked'));
  let sel=chk.map(c=>({tipo:c.getAttribute("data-tipo"),id:c.value}));
  if(!sel.length){
    // nessuna spunta: prendo tutte le righe di quel gruppo
    sel=Array.prototype.slice.call(document.querySelectorAll(cls))
      .map(c=>({tipo:c.getAttribute("data-tipo"),id:c.value}));
  }
  return sel;
}
function scaricaDestinati(comm,soloTogli,gruppo){
  const sel=_raccogliDestinati(comm,gruppo);
  if(!sel.length){toast("Niente da gestire","err");return;}
  const azione=soloTogli?"Rimessa a magazzino":"Scarico";
  toast(azione+" in corso...");
  const ops=sel.map(it=>{
    if(soloTogli){
      // Togli assegnazione: articoli via annullaAssegnazione, pezzi via assegnaPezzoSingolo vuoto
      if(it.tipo==='articolo')return call("annullaAssegnazione",{tipo:"articolo",artId:it.id,commessa:comm});
      return call("assegnaPezzoSingolo",{tipo:it.tipo,id:it.id,commessa:""});
    } else {
      // Scarica del tutto verso la commessa
      if(it.tipo==='articolo'){const a=STATE.articoli.find(x=>x.ID===it.id)||{};const r=(STATE.riserve||[]).find(x=>x.ArticoloID===it.id&&x.Commessa===comm);const q=r?r.Quantita:0;
        // scarico q, poi libera la riserva
        return call("registraMovimento",{ArticoloID:it.id,Tipo:"scarico",Quantita:q,Commessa:comm,Note:"Scarico da report commessa"}).then(()=>call("liberaRiserva",{artId:it.id,commessa:comm}));
      }
      if(it.tipo==='pannello')return call("scaricaPannelloTotale",{PannelloID:it.id,Commessa:comm,Note:"Scarico da report commessa"});
      return call("scaricaMassiccioTotale",{MassiccioID:it.id,Commessa:comm,Note:"Scarico da report commessa"});
    }
  });
  Promise.all(ops).then(()=>{
    Promise.all([call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti"),call("getRiserve")]).then(([a,p,m,mv,ri])=>{
      STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];STATE.movimenti=mv||[];STATE.riserve=ri||[];
      toast(azione+" completato: "+sel.length+" elementi");
      _openReportCommessa(comm);
    });
  }).catch(e=>toast("Errore: "+e.message,"err"));
}

function stampaHTML(html){
  const area=document.getElementById("print-area");
  area.innerHTML=html;
  let stampato=false;
  const fatto=function(){if(stampato)return;stampato=true;document.body.classList.add("printing");window.print();setTimeout(function(){document.body.classList.remove("printing");},600);};
  const imgs=Array.prototype.slice.call(area.querySelectorAll("img"));
  if(!imgs.length){fatto();return;}
  let n=0;const done=function(){if(++n>=imgs.length)fatto();};
  imgs.forEach(function(im){if(im.complete&&im.naturalWidth)done();else{im.onload=done;im.onerror=done;}});
  setTimeout(fatto,4000); // fallback se un'immagine non carica
}

function dettaglioVoce(v){
  const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'';
  return (v.Categoria||'')+(q?(' - '+q):'');

function dettaglioRiga(f){return f.__voce?dettaglioVoce(f):fabDettaglio(f);}
function fabDettaglio(f){
  if(f.Tipo==='articolo')return (f.Quantita||'')+' '+(f.UnitaMisura||'');
  if(f.Tipo==='pannello')return (f.NumPezzi||'')+' pz '+(f.Dim1||'')+'x'+(f.Dim2||'')+'mm';
  return (f.NumPezzi||'')+' pz '+(f.Dim1||'')+'x'+(f.Dim2||'')+'x'+(f.Dim3||'')+'mm';
}
function dispoFab(f){
  if(f.Tipo==='articolo'){const a=STATE.articoli.find(x=>x.ID===f.ArticoloID);const st=a?+a.Stock:0;const imp=a?impegnatoArt(a):0;const lib=Math.max(0,st-imp);const u=a?a.UnitaMisura:(f.UnitaMisura||'');return {ok:lib>=(+f.Quantita||0),libero:lib,testo:'a mag. '+st+' '+u+' - destinati '+imp+' - liberi '+lib};}
  if(f.Tipo==='pannello'){const lib=STATE.pannelli.filter(p=>p.ArticoloID===f.ArticoloID&&!String(p.Commesse||'').trim()).reduce((s,p)=>s+(+p.M2_residuo||0),0);const need=((+f.Dim1||0)/1000)*((+f.Dim2||0)/1000)*(+f.NumPezzi||0);return {ok:lib>=need,libero:lib,testo:'liberi '+lib.toFixed(2)+' / serve '+need.toFixed(2)+' m2'};}
  const lib=STATE.massicci.filter(p=>p.ArticoloID===f.ArticoloID&&!String(p.Commesse||'').trim()).reduce((s,p)=>s+(+p.M3_residuo||0),0);const need=((+f.Dim1||0)/1000)*((+f.Dim2||0)/1000)*((+f.Dim3||0)/1000)*(+f.NumPezzi||0);return {ok:lib>=need,libero:lib,testo:'liberi '+lib.toFixed(3)+' / serve '+need.toFixed(3)+' m3'};
}
// Conta quanti pezzi/quantita sono REALMENTE assegnati a questo fabbisogno (in tempo reale)
function assegnatoReale(f){
  if(f.Tipo==='articolo'){
    const r=(STATE.riserve||[]).find(x=>x.ArticoloID===f.ArticoloID&&x.Commessa===f.Commessa);
    return r?(+r.Quantita||0):0;
  }
  const pezzi=(f.Tipo==='pannello'?STATE.pannelli:STATE.massicci)
    .filter(p=>p.ArticoloID===f.ArticoloID && String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(f.Commessa)>=0);
  return pezzi.length;
}
// Stato effettivo calcolato dalla realta (non dal flag salvato)
function statoEffettivo(f){
  if(f.Stato==='ricevuto')return 'ricevuto';
  const ass=assegnatoReale(f);
  if(f.Tipo==='articolo'){
    const need=parseFloat(f.Quantita)||0;
    if(ass>0&&ass>=need)return 'assegnato';
    if(ass>0)return 'parziale';
  } else {
    const need=parseInt(f.NumPezzi)||1;
    if(ass>=need)return 'assegnato';
    if(ass>0)return 'parziale';
  }
  return (f.Stato==='ordinato')?'ordinato':'da_ordinare';
}

  let ordini=Object.keys(gruppi).map(fo=>{

function tipiDi(tipo){
  const arr=tipo==='pannello'?STATE.pannelli:STATE.massicci;
  const cat=tipo==='pannello'?'Pannelli':'Massello';
  const seen={},out=[];
  STATE.articoli.forEach(a=>{if(a.Categoria===cat||(tipo==='pannello'&&a.IsPannello==='SI')){out.push({id:a.ID,nome:a.Nome});seen[a.ID]=1;}});
  arr.forEach(p=>{const id=p.ArticoloID;if(id&&!seen[id]){const a=STATE.articoli.find(x=>x.ID===id);out.push({id:id,nome:a?a.Nome:id});seen[id]=1;}});
  return out;
}
// ---- SUGGERIMENTI NOMI MATERIALE (evita i doppioni di nome) ----
// Raccoglie i nomi gia usati per pannelli o massicci, senza ripetizioni.
function nomiMateriali(tipo){
  if(tipo==='categoria')return categorieVoci();
  const seen={},out=[];
  const push=function(n){n=String(n||"").trim();const k=n.toLowerCase();if(n&&!seen[k]){seen[k]=1;out.push(n);}};
  (tipo==='pannello'?STATE.pannelli:STATE.massicci).forEach(p=>push(p.ArticoloID));
  const cat=tipo==='pannello'?'Pannelli':'Massello';
  STATE.articoli.forEach(a=>{if(a.Categoria===cat||(tipo==='pannello'&&a.IsPannello==='SI'))push(a.Nome);});
  return out.sort(function(a,b){return a.localeCompare(b);});
}

function hintNome(inputId,hintId,tipo){
  const el=document.getElementById(inputId),h=document.getElementById(hintId);
  if(!el||!h)return;
  const v=(el.value||"").trim();
  if(!v){h.innerHTML="";return;}
  const nomi=nomiMateriali(tipo),q=v.toLowerCase();
  const et=tipo==='categoria'?'Categoria':'Materiale';
  if(nomi.some(n=>n.toLowerCase()===q)){h.innerHTML='<span style="color:var(--green)">'+et+' gia esistente: nessun doppione.</span>';return;}
  const simili=nomi.filter(n=>{const l=n.toLowerCase();return l.indexOf(q)>=0||q.indexOf(l)>=0;}).slice(0,4);
  let msg='<span style="color:var(--amber)">Nome nuovo: verra creata una '+(tipo==='categoria'?'categoria nuova':'voce nuova')+'.</span>';
  if(simili.length)msg+='<br><span style="color:var(--gray)">Gia in uso, forse intendevi: </span>'+simili.map(n=>'<a style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="usaNome(\''+esc(inputId)+'\',\''+esc(n)+'\',\''+esc(hintId)+'\',\''+tipo+'\')">'+n+'</a>').join(' &middot; ');

function submitFabbisogno(){
  const tipo=document.getElementById("fb-tipo").value, forn=document.getElementById("fb-forn").value;
  const artId=comboVal('fb'); const typed=(document.getElementById("fb-q").value||"").trim();
  const proc=(aid,desc)=>{
    const d={Commessa:FAB_COMM,Tipo:tipo,ArticoloID:aid,Descrizione:desc,Fornitore:forn,Stato:"da_ordinare",Note:(document.getElementById("fb-nota")||{}).value||""};
    if(tipo==='articolo'){const q=document.getElementById("fb-qta").value;if(!q){showErr("fb-err","Inserisci la quantita.");return;}d.Quantita=q;const a=STATE.articoli.find(x=>x.ID===aid);d.UnitaMisura=a?a.UnitaMisura:'';}
    else if(tipo==='pannello'){let w=document.getElementById("fb-w").value,h=document.getElementById("fb-h").value;const np=document.getElementById("fb-np").value;if(!np){showErr("fb-err","Inserisci il numero di pezzi.");return;}if((!w||!h)&&aid){const ex=STATE.pannelli.find(p=>p.ArticoloID===aid&&p.Larghezza_mm);if(ex){w=w||ex.Larghezza_mm;h=h||ex.Altezza_mm;}}if(!w||!h){showErr("fb-err","Dimensioni non trovate per questo tipo: inseriscile.");return;}d.Dim1=w;d.Dim2=h;d.NumPezzi=np;d.UnitaMisura="m2";}
    else{let l=document.getElementById("fb-l").value,mw=document.getElementById("fb-mw").value,s=document.getElementById("fb-s").value;const np=document.getElementById("fb-mnp").value;if(!np){showErr("fb-err","Inserisci il numero di pezzi.");return;}if((!l||!mw||!s)&&aid){const ex=STATE.massicci.find(p=>p.ArticoloID===aid&&p.Lunghezza_mm);if(ex){l=l||ex.Lunghezza_mm;mw=mw||ex.Larghezza_mm;s=s||ex.Spessore_mm;}}if(!l||!mw||!s){showErr("fb-err","Dimensioni non trovate per questo tipo: inseriscile.");return;}d.Dim1=l;d.Dim2=mw;d.Dim3=s;d.NumPezzi=np;d.UnitaMisura="m3";}
    call("aggiungiFabbisogno",d).then(r=>{if(!r.ok){showErr("fb-err",r.err||"Errore");return;}
      const finalizza=()=>call("getFabbisogno").then(fb=>{STATE.fabbisogni=fb||[];closeModal();
        const disp=dispoFab(d); toast(FAB_EDIT_ID?"Riga modificata":(disp.ok?"Materiale aggiunto (disponibile a magazzino)":"Aggiunto: mancante, in lista riordino"));
        FAB_EDIT_ID=null;
        renderPage(STATE.pagina);});
      // Se stiamo modificando, elimina la vecchia riga
      if(FAB_EDIT_ID){call("eliminaFabbisogno",{id:FAB_EDIT_ID}).then(finalizza);}
      else finalizza();
    });
  };
  if(artId){const a=STATE.articoli.find(x=>x.ID===artId);proc(artId,a?a.Nome:typed);}
  else if(typed){
    if(tipo==='articolo'){
      call("salvaArticolo",{Nome:typed,Categoria:'Altro',UnitaMisura:'pz',Fornitore:forn,Stock:0,IsPannello:false}).then(r=>{
        if(!r.ok){showErr("fb-err","Errore creazione tipo");return;}
        call("getArticoli").then(a=>{STATE.articoli=a||[];proc(r.id,typed);});
      });
    } else proc(typed,typed);
  } else showErr("fb-err","Scegli o scrivi un materiale.");
}

// Finestra: scegli quali codici (pannelli/massicci liberi) assegnare alla commessa del fabbisogno
function apriSceltaCodici(fabId){
  const f=STATE.fabbisogni.find(x=>x.ID===fabId); if(!f)return;
  const lista=(f.Tipo==='pannello'?STATE.pannelli:STATE.massicci)
    .filter(p=>p.ArticoloID===f.ArticoloID && !String(p.Commesse||'').trim() && (+(f.Tipo==='pannello'?p.M2_residuo:p.M3_residuo)||0)>0);
  const need=parseInt(f.NumPezzi)||lista.length;
  if(!lista.length){toast("Nessun codice libero di questo tipo. Va ordinato.","err");return;}
  const righe=lista.map(p=>{
    const dim=f.Tipo==='pannello'?((p.Larghezza_mm||'')+'x'+(p.Altezza_mm||'')+'mm'):((p.Lunghezza_mm||'')+'x'+(p.Larghezza_mm||'')+'x'+(p.Spessore_mm||'')+'mm');
    const res=f.Tipo==='pannello'?((+p.M2_residuo||0).toFixed(3)+' m2'):((+p.M3_residuo||0).toFixed(4)+' m3');
    return '<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" class="sc-chk" value="'+esc(p.ID)+'" style="width:18px;height:18px;accent-color:var(--accent)"><span style="flex:1"><strong>'+p.ID+'</strong> <span style="color:var(--gray);font-size:12px">'+dim+' - '+res+(p.Note?(' - '+p.Note):'')+'</span></span></label>';
  }).join("");
  openModal('<div class="modal" style="width:520px"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Scegli i codici da assegnare</h2>'
    +'<div class="info-box">Commessa <strong>'+f.Commessa+'</strong> - servono <strong>'+need+'</strong> pezzi di "'+f.Descrizione+'". Seleziona quali codici destinare.</div>'
    +'<div style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:11px;padding:4px 10px">'+righe+'</div>'
    +'<div id="sc-err" style="color:var(--red);font-size:13px;margin-top:8px"></div>'
    +'<button class="btn-primary" onclick="confermaSceltaCodici(\''+esc(fabId)+'\')">Assegna i selezionati</button></div>');
}
function confermaSceltaCodici(fabId){
  const f=STATE.fabbisogni.find(x=>x.ID===fabId); if(!f)return;
  const ids=Array.prototype.slice.call(document.querySelectorAll(".sc-chk:checked")).map(c=>c.value);
  if(!ids.length){document.getElementById("sc-err").textContent="Seleziona almeno un codice.";return;}
  toast("Assegnazione in corso...");
  // Assegna ogni pezzo scelto alla commessa
  Promise.all(ids.map(pid=>call("assegnaPezzoSingolo",{tipo:f.Tipo,id:pid,commessa:f.Commessa})))
    .then(()=>{
      const need=parseInt(f.NumPezzi)||ids.length;
      const nuovoStato=ids.length>=need?'assegnato':'da_ordinare';
      call("aggiornaStatoFabbisogno",{id:fabId,stato:nuovoStato}).then(()=>{
        Promise.all([call("getFabbisogno"),call("getPannelli"),call("getMassicci")]).then(([fb,p,m])=>{STATE.fabbisogni=fb||[];STATE.pannelli=p||[];STATE.massicci=m||[];
          closeModal();toast("Assegnati "+ids.length+" codici alla commessa"+(ids.length<need?(" (restano "+(need-ids.length)+" da ordinare)"):""));renderPage(STATE.pagina);});
      });
    });
}

function renderOrdiniEvasi(){
  const list=STATE.ordini||[];
  let h='<h1 class="page-title">Ordini</h1>';
  if(!list.length)return h+'<div class="card" style="color:var(--gray)">Nessun ordine emesso. Gli ordini compaiono qui dopo l\'invio dalla pagina "Crea ordine".</div>';
  const daRic=list.filter(o=>String(o.Stato).toLowerCase()!=='ricevuto');
  const arch=list.filter(o=>String(o.Stato).toLowerCase()==='ricevuto');
  h+='<div class="op-sec" style="margin-top:0">Da ricevere ('+daRic.length+')</div>'+(daRic.length?daRic.map(ordineCard).join(""):'<div class="card" style="color:var(--gray)">Nessun ordine in attesa.</div>');
  h+='<div class="op-sec">Archiviati / ricevuti ('+arch.length+')</div>'+(arch.length?arch.map(ordineCard).join(""):'<div class="card" style="color:var(--gray)">Nessun ordine archiviato.</div>');
  return h;

function ordineCard(o){

   +'<p style="margin-top:18px;font-size:13px">Cordiali saluti,<br>Atelier Tonini</p>'
   +'</div>';

function buildOffertaPDF(o){
  const D=o.Dati||{},righe=D.righe||[];
  let body='',sezPrec=null,tot=0;
  righe.forEach(r=>{const q=parseFloat(r.qta)||0,p=parseFloat(r.prezzo)||0,t=q*p;tot+=t;
    if((r.sezione||'')!==sezPrec){sezPrec=r.sezione||'';if(sezPrec)body+='<tr><td></td><td></td><td style="font-weight:bold;padding-top:14px;padding-bottom:4px">'+sezPrec+'</td><td></td><td></td><td></td></tr>';}
    body+='<tr><td style="vertical-align:top;padding:3px 0">'+(r.pr||'')+'</td><td style="vertical-align:top;padding:3px 8px 3px 0">'+(r.cod||'')+'</td><td style="white-space:pre-wrap;padding:3px 12px 3px 0;line-height:1.45">'+(r.descrizione||'')+'</td><td align="center" style="vertical-align:top;padding:3px 0">'+(r.qta||'')+'</td><td align="right" style="vertical-align:top;padding:3px 0;white-space:nowrap">'+(p?euro(p):'')+'</td><td align="right" style="vertical-align:top;padding:3px 0;white-space:nowrap">'+(t?euro(t):'')+'</td></tr>';});
  const posa=parseFloat(D.posa)||0,imp=tot+posa;
  const tr=(l,v)=>'<tr style="background:#efefef"><td colspan="5" align="right" style="font-weight:bold;padding:7px 8px">'+l+'</td><td align="right" style="font-weight:bold;padding:7px 8px;white-space:nowrap">'+euro(v)+'</td></tr>';
  const escl=String(D.esclusioni||"").split("\n").filter(Boolean).map(e=>'<div style="padding:1px 0">- '+e+'</div>').join("");

  STATE.massicci.forEach(p=>{const c=String(p.Commesse||'').trim();if(c&&(+p.M3_residuo>0)){(byC[c]=byC[c]||{pan:[],mas:[]}).mas.push(p);}});
