     +gruppi[fo].map(f=>'<div style="font-size:12.5px;color:var(--gray);padding:3px 0">'+f.Descrizione+' - '+dettaglioRiga(f)+(f.__voce?' <span class="badge badge-accent">altra voce</span>':'')+'</div>').join("")+'</div>';
  }).join("");
  return '<div class="card" style="margin-bottom:16px"><div class="card-title">Materiali della commessa '+FAB_COMM+'</div>'+rows+'</div>'+(ordini?'<div class="op-sec">Riordino per questa commessa</div>'+ordini:'');

function tipiDi(tipo){
  const arr=tipo==='pannello'?STATE.pannelli:STATE.massicci;
  const cat=tipo==='pannello'?'Pannelli':'Massello';
  const seen={},out=[];
  STATE.articoli.forEach(a=>{if(a.Categoria===cat||(tipo==='pannello'&&a.IsPannello==='SI')){out.push({id:a.ID,nome:a.Nome});seen[a.ID]=1;}});
  arr.forEach(p=>{const id=p.ArticoloID;if(id&&!seen[id]){const a=STATE.articoli.find(x=>x.ID===id);out.push({id:id,nome:a?a.Nome:id});seen[id]=1;}});
  return out;
}
// ---- SUGGERIMENTI NOMI MATERIALE (evita i doppioni di nome) ----
// Raccoglie i nomi gia usati per pannelli o massicci, senza ripetizioni.
function nomiMateriali(tipo){
  if(tipo==='categoria')return categorieVoci();
  const seen={},out=[];
  const push=function(n){n=String(n||"").trim();const k=n.toLowerCase();if(n&&!seen[k]){seen[k]=1;out.push(n);}};
  (tipo==='pannello'?STATE.pannelli:STATE.massicci).forEach(p=>push(p.ArticoloID));
  const cat=tipo==='pannello'?'Pannelli':'Massello';
  STATE.articoli.forEach(a=>{if(a.Categoria===cat||(tipo==='pannello'&&a.IsPannello==='SI'))push(a.Nome);});
  return out.sort(function(a,b){return a.localeCompare(b);});
}
function datalistHTML(id,tipo){
  return '<datalist id="'+id+'">'+nomiMateriali(tipo).map(n=>'<option value="'+att(n)+'">').join("")+'</datalist>';
}
// Avvisa se il nome scritto e nuovo e propone quelli simili gia in uso
function hintNome(inputId,hintId,tipo){
  const el=document.getElementById(inputId),h=document.getElementById(hintId);
  if(!el||!h)return;
  const v=(el.value||"").trim();
  if(!v){h.innerHTML="";return;}
  const nomi=nomiMateriali(tipo),q=v.toLowerCase();
  const et=tipo==='categoria'?'Categoria':'Materiale';
  if(nomi.some(n=>n.toLowerCase()===q)){h.innerHTML='<span style="color:var(--green)">'+et+' gia esistente: nessun doppione.</span>';return;}
  const simili=nomi.filter(n=>{const l=n.toLowerCase();return l.indexOf(q)>=0||q.indexOf(l)>=0;}).slice(0,4);
  let msg='<span style="color:var(--amber)">Nome nuovo: verra creata una '+(tipo==='categoria'?'categoria nuova':'voce nuova')+'.</span>';
  if(simili.length)msg+='<br><span style="color:var(--gray)">Gia in uso, forse intendevi: </span>'+simili.map(n=>'<a style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="usaNome(\''+esc(inputId)+'\',\''+esc(n)+'\',\''+esc(hintId)+'\',\''+tipo+'\')">'+n+'</a>').join(' &middot; ');
  h.innerHTML=msg;
}
function usaNome(inputId,nome,hintId,tipo){
  const el=document.getElementById(inputId);
  if(el)el.value=nome;
  hintNome(inputId,hintId,tipo);
}

function submitFabbisogno(){
  const tipo=document.getElementById("fb-tipo").value, forn=document.getElementById("fb-forn").value;
  const artId=comboVal('fb'); const typed=(document.getElementById("fb-q").value||"").trim();
  const proc=(aid,desc)=>{
    const d={Commessa:FAB_COMM,Tipo:tipo,ArticoloID:aid,Descrizione:desc,Fornitore:forn,Stato:"da_ordinare",Note:(document.getElementById("fb-nota")||{}).value||""};
    if(tipo==='articolo'){const q=document.getElementById("fb-qta").value;if(!q){showErr("fb-err","Inserisci la quantita.");return;}d.Quantita=q;const a=STATE.articoli.find(x=>x.ID===aid);d.UnitaMisura=a?a.UnitaMisura:'';}
    else if(tipo==='pannello'){let w=document.getElementById("fb-w").value,h=document.getElementById("fb-h").value;const np=document.getElementById("fb-np").value;if(!np){showErr("fb-err","Inserisci il numero di pezzi.");return;}if((!w||!h)&&aid){const ex=STATE.pannelli.find(p=>p.ArticoloID===aid&&p.Larghezza_mm);if(ex){w=w||ex.Larghezza_mm;h=h||ex.Altezza_mm;}}if(!w||!h){showErr("fb-err","Dimensioni non trovate per questo tipo: inseriscile.");return;}d.Dim1=w;d.Dim2=h;d.NumPezzi=np;d.UnitaMisura="m2";}
    else{let l=document.getElementById("fb-l").value,mw=document.getElementById("fb-mw").value,s=document.getElementById("fb-s").value;const np=document.getElementById("fb-mnp").value;if(!np){showErr("fb-err","Inserisci il numero di pezzi.");return;}if((!l||!mw||!s)&&aid){const ex=STATE.massicci.find(p=>p.ArticoloID===aid&&p.Lunghezza_mm);if(ex){l=l||ex.Lunghezza_mm;mw=mw||ex.Larghezza_mm;s=s||ex.Spessore_mm;}}if(!l||!mw||!s){showErr("fb-err","Dimensioni non trovate per questo tipo: inseriscile.");return;}d.Dim1=l;d.Dim2=mw;d.Dim3=s;d.NumPezzi=np;d.UnitaMisura="m3";}
    call("aggiungiFabbisogno",d).then(r=>{if(!r.ok){showErr("fb-err",r.err||"Errore");return;}
      const finalizza=()=>call("getFabbisogno").then(fb=>{STATE.fabbisogni=fb||[];closeModal();
        const disp=dispoFab(d); toast(FAB_EDIT_ID?"Riga modificata":(disp.ok?"Materiale aggiunto (disponibile a magazzino)":"Aggiunto: mancante, in lista riordino"));
        FAB_EDIT_ID=null;
        renderPage(STATE.pagina);});
      // Se stiamo modificando, elimina la vecchia riga
      if(FAB_EDIT_ID){call("eliminaFabbisogno",{id:FAB_EDIT_ID}).then(finalizza);}
      else finalizza();
    });
  };
  if(artId){const a=STATE.articoli.find(x=>x.ID===artId);proc(artId,a?a.Nome:typed);}
  else if(typed){
    if(tipo==='articolo'){
      call("salvaArticolo",{Nome:typed,Categoria:'Altro',UnitaMisura:'pz',Fornitore:forn,Stock:0,IsPannello:false}).then(r=>{
        if(!r.ok){showErr("fb-err","Errore creazione tipo");return;}
        call("getArticoli").then(a=>{STATE.articoli=a||[];proc(r.id,typed);});
      });
    } else proc(typed,typed);
  } else showErr("fb-err","Scegli o scrivi un materiale.");
}

    else{if(document.getElementById("fb-l"))document.getElementById("fb-l").value=f.Dim1||"";if(document.getElementById("fb-mw"))document.getElementById("fb-mw").value=f.Dim2||"";if(document.getElementById("fb-s"))document.getElementById("fb-s").value=f.Dim3||"";if(document.getElementById("fb-mnp"))document.getElementById("fb-mnp").value=f.NumPezzi||"1";}

  },60);
}

  // Pannelli/massicci: togli la commessa da tutti i pezzi di questo tipo assegnati a questa commessa
  const pezzi=(f.Tipo==='pannello'?STATE.pannelli:STATE.massicci)
    .filter(p=>p.ArticoloID===f.ArticoloID && String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(f.Commessa)>=0);
  Promise.all(pezzi.map(p=>call("assegnaPezzoSingolo",{tipo:f.Tipo,id:p.ID,commessa:""})))
    .then(()=>{call("aggiornaStatoFabbisogno",{id:id,stato:'da_ordinare'}).then(()=>{Promise.all([call("getFabbisogno"),call("getPannelli"),call("getMassicci")]).then(([fb,p,m])=>{STATE.fabbisogni=fb||[];STATE.pannelli=p||[];STATE.massicci=m||[];toast("Assegnazione annullata");renderPage(STATE.pagina);});});});
}
function assegnaFab(id){
  const f=STATE.fabbisogni.find(x=>x.ID===id); if(!f)return;
  // Articoli: assegnazione per quantita (come prima)
  if(f.Tipo==='articolo'){
    call("assegnaArticoloCommessa",{artId:f.ArticoloID,commessa:f.Commessa,quantita:f.Quantita}).then(r=>{if(!r.ok){toast(r.err||"Errore","err");return;}
      const dao=+r.daOrdinare||0; const nuovoStato=dao>0?'da_ordinare':'assegnato';
      call("aggiornaStatoFabbisogno",{id:id,stato:nuovoStato}).then(()=>{
        Promise.all([call("getFabbisogno"),call("getArticoli"),call("getRiserve")]).then(([fb,a,ri])=>{STATE.fabbisogni=fb||[];STATE.articoli=a||[];STATE.riserve=ri||[];
          toast(dao>0?("Assegnato il disponibile; restano "+dao+" da ordinare"):"Materiale assegnato alla commessa");renderPage(STATE.pagina);});
      });
    });
    return;
  }
  // Pannelli/Massicci: scegli i codici specifici da assegnare
  apriSceltaCodici(id);
}
// Finestra: scegli quali codici (pannelli/massicci liberi) assegnare alla commessa del fabbisogno
function apriSceltaCodici(fabId){
  const f=STATE.fabbisogni.find(x=>x.ID===fabId); if(!f)return;
  const lista=(f.Tipo==='pannello'?STATE.pannelli:STATE.massicci)
    .filter(p=>p.ArticoloID===f.ArticoloID && !String(p.Commesse||'').trim() && (+(f.Tipo==='pannello'?p.M2_residuo:p.M3_residuo)||0)>0);
  const need=parseInt(f.NumPezzi)||lista.length;
  if(!lista.length){toast("Nessun codice libero di questo tipo. Va ordinato.","err");return;}
  const righe=lista.map(p=>{
    const dim=f.Tipo==='pannello'?((p.Larghezza_mm||'')+'x'+(p.Altezza_mm||'')+'mm'):((p.Lunghezza_mm||'')+'x'+(p.Larghezza_mm||'')+'x'+(p.Spessore_mm||'')+'mm');
    const res=f.Tipo==='pannello'?((+p.M2_residuo||0).toFixed(3)+' m2'):((+p.M3_residuo||0).toFixed(4)+' m3');
    return '<label style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" class="sc-chk" value="'+esc(p.ID)+'" style="width:18px;height:18px;accent-color:var(--accent)"><span style="flex:1"><strong>'+p.ID+'</strong> <span style="color:var(--gray);font-size:12px">'+dim+' - '+res+(p.Note?(' - '+p.Note):'')+'</span></span></label>';
  }).join("");
  openModal('<div class="modal" style="width:520px"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Scegli i codici da assegnare</h2>'
    +'<div class="info-box">Commessa <strong>'+f.Commessa+'</strong> - servono <strong>'+need+'</strong> pezzi di "'+f.Descrizione+'". Seleziona quali codici destinare.</div>'
    +'<div style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:11px;padding:4px 10px">'+righe+'</div>'
    +'<div id="sc-err" style="color:var(--red);font-size:13px;margin-top:8px"></div>'
    +'<button class="btn-primary" onclick="confermaSceltaCodici(\''+esc(fabId)+'\')">Assegna i selezionati</button></div>');
}
function confermaSceltaCodici(fabId){
  const f=STATE.fabbisogni.find(x=>x.ID===fabId); if(!f)return;
  const ids=Array.prototype.slice.call(document.querySelectorAll(".sc-chk:checked")).map(c=>c.value);
  if(!ids.length){document.getElementById("sc-err").textContent="Seleziona almeno un codice.";return;}
  toast("Assegnazione in corso...");
  // Assegna ogni pezzo scelto alla commessa
  Promise.all(ids.map(pid=>call("assegnaPezzoSingolo",{tipo:f.Tipo,id:pid,commessa:f.Commessa})))
    .then(()=>{
      const need=parseInt(f.NumPezzi)||ids.length;
      const nuovoStato=ids.length>=need?'assegnato':'da_ordinare';
      call("aggiornaStatoFabbisogno",{id:fabId,stato:nuovoStato}).then(()=>{
        Promise.all([call("getFabbisogno"),call("getPannelli"),call("getMassicci")]).then(([fb,p,m])=>{STATE.fabbisogni=fb||[];STATE.pannelli=p||[];STATE.massicci=m||[];
          closeModal();toast("Assegnati "+ids.length+" codici alla commessa"+(ids.length<need?(" (restano "+(need-ids.length)+" da ordinare)"):""));renderPage(STATE.pagina);});
      });
    });
}
function inviaOrdComm(forn){
  const list=STATE.fabbisogni.filter(f=>f.Commessa===FAB_COMM&&f.Stato!=='ricevuto'&&((f.Fornitore||'(senza fornitore)')===forn));

  if(!em){toast("Imposta prima l'email del fornitore","err");openFornitore(forn);return;}
  const voci=vociDaOrdinare(FAB_COMM).filter(v=>(v.Fornitore||'(senza fornitore)')===forn);
  if(!list.length&&!voci.length){toast("Nessun materiale da ordinare","err");return;}
  const righe=list.map(f=>({fabId:f.ID,tipo:f.Tipo,artId:f.ArticoloID,descrizione:f.Descrizione,dettaglio:fabDettaglio(f),numPezzi:f.NumPezzi,dim1:f.Dim1,dim2:f.Dim2,dim3:f.Dim3,quantita:f.Quantita,unita:f.UnitaMisura,note:f.Note||""}))
    .concat(voci.map(v=>({voceId:v.ID,tipo:'voce',artId:'',descrizione:v.Descrizione,dettaglio:dettaglioVoce(v),quantita:v.Quantita,unita:v.Unita||'',note:v.Note||""})));
  toast("Invio in corso...");
  call("emettiOrdineCommessa",{commessa:FAB_COMM,fornitore:forn,email:em,righe:righe}).then(r=>{if(!r.ok){toast(r.err||"Errore","err");return;}
    Promise.all(voci.map(v=>call("aggiornaStatoVoce",{id:v.ID,stato:'ordinato',ordineId:r.id}))).then(()=>{
      toast("Ordine registrato per "+forn+" (esporta il PDF per inviarlo)");
      Promise.all([call("getFabbisogno"),call("getOrdini"),call("getVoci")]).then(([fb,or,vc])=>{STATE.fabbisogni=fb||[];STATE.ordini=or||[];STATE.voci=vc||[];renderPage(STATE.pagina);});
    });
  });
}
function stampaOrdineCommessa(forn){
  const list=STATE.fabbisogni.filter(f=>f.Commessa===FAB_COMM&&f.Stato!=='ricevuto'&&((f.Fornitore||'(senza fornitore)')===forn));
  const oggi=new Date().toLocaleDateString('it-IT');
  const fornObj=(STATE.fornitori||[]).find(f=>String(f.Nome).trim().toLowerCase()===String(forn).trim().toLowerCase())||{};
  const email=fornObj.Email||'';
  const tel=fornObj.Telefono||'';
  const righe=list.map(f=>{
    const iu=imgUrlFor(f.ArticoloID);
    const art=(STATE.articoli||[]).find(a=>a.ID===f.ArticoloID)||{};
    const cf=art.CodiceFornitore||'';
    // Codice gestionale: ART-NNNN per articoli, oppure il codice del tipo per pannelli/massicci
    const codGest=(art&&/^ART-/.test(art.ID))?art.ID:(f.ArticoloID||'-');
    return '<tr>'
      +'<td style="text-align:center;width:60px">'+(iu?'<img src="'+iu+'" referrerpolicy="no-referrer" style="width:50px;height:50px;object-fit:cover;border-radius:6px">':'')+'</td>'
      +'<td>'+f.Descrizione+'<div style="font-size:11px;color:#777">'+fabDettaglio(f)+(f.Note?(' - '+f.Note):'')+'</div></td>'
      +'<td style="text-align:center;font-size:11px;font-family:monospace;color:#555">'+codGest+'</td>'
      +'<td style="text-align:center;font-size:12px">'+(cf||'-')+'</td>'
      +'</tr>';
  }).join("")
  + vociDaOrdinare(FAB_COMM).filter(v=>(v.Fornitore||'(senza fornitore)')===forn).map(function(v){
      return '<tr><td></td><td>'+v.Descrizione+'<div style="font-size:11px;color:#777">'+dettaglioVoce(v)+(v.Note?(' - '+v.Note):'')+'</div></td><td style="text-align:center;font-size:11px;color:#555">-</td><td style="text-align:center;font-size:12px">-</td></tr>';
    }).join("")
  || '<tr><td colspan="4" style="color:#888">Nessun materiale</td></tr>';
  // Cerca il numero ordine piu recente per questa commessa+fornitore
  const ord=(STATE.ordini||[]).filter(o=>o.Commessa===FAB_COMM&&String(o.Fornitore).trim().toLowerCase()===String(forn).trim().toLowerCase()).sort((a,b)=>String(b.Data).localeCompare(String(a.Data)))[0];
  const numOrd=ord?ord.ID:'(da emettere)';
  let fornBox='<div style="margin:14px 0;padding:10px 14px;background:#f7f3ec;border-radius:8px;font-size:13px"><strong>Fornitore:</strong> '+forn;
  if(email)fornBox+=' &nbsp;|&nbsp; <strong>Email:</strong> '+email;
  if(tel)fornBox+=' &nbsp;|&nbsp; <strong>Tel:</strong> '+tel;
  fornBox+='</div>';
  stampaHTML('<div style="font-family:Georgia,serif;color:#3a342d">'
   +'<div style="display:flex;justify-content:space-between;border-bottom:2px solid #8a6d4e;padding-bottom:10px;margin-bottom:6px"><div><div style="font-size:20px;font-weight:700;color:#8a6d4e">Atelier Tonini</div><div style="font-size:13px;color:#777">Ordine n. '+numOrd+' - commessa '+FAB_COMM+'</div></div><div style="font-size:12px;color:#777">'+oggi+'</div></div>'
   +fornBox
   +'<p style="font-size:13px">Spett.le <strong>'+forn+'</strong>, per la commessa <strong>'+FAB_COMM+'</strong> Vi richiediamo i seguenti materiali:</p>'
   +'<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px"><thead><tr style="background:#f0e9e0"><th align="center">Foto</th><th align="left">Materiale</th><th align="center">Cod. gestionale</th><th align="center">Cod. fornitore</th></tr></thead><tbody>'+righe+'</tbody></table>'
   +'<p style="margin-top:18px">Cordiali saluti,<br>Atelier Tonini</p></div>');
}

function buildOffertaPDF(o){
  const D=o.Dati||{},righe=D.righe||[];

  righe.forEach(r=>{const q=parseFloat(r.qta)||0,p=parseFloat(r.prezzo)||0,t=q*p;tot+=t;
    if((r.sezione||'')!==sezPrec){sezPrec=r.sezione||'';if(sezPrec)body+='<tr><td></td><td></td><td style="font-weight:bold;padding-top:14px;padding-bottom:4px">'+sezPrec+'</td><td></td><td></td><td></td></tr>';}

  const posa=parseFloat(D.posa)||0,imp=tot+posa;
  const tr=(l,v)=>'<tr style="background:#efefef"><td colspan="5" align="right" style="font-weight:bold;padding:7px 8px">'+l+'</td><td align="right" style="font-weight:bold;padding:7px 8px;white-space:nowrap">'+euro(v)+'</td></tr>';

  const pr=D.pagRighe||[]; let pagHtml='';
  if(pr.length){const iva=D.pagIva!==false,base=imp*(iva?1.22:1);
    const prows=pr.map(r=>{const pct=parseFloat(r.pct)||0;return '<tr><td style="padding:3px 8px 3px 0;font-weight:600">'+(r.label||'')+'</td><td style="padding:3px 8px 3px 0">'+(r.descr||'')+'</td><td align="right" style="padding:3px 0;white-space:nowrap">&euro; '+euro(pct/100*base)+'</td></tr>';}).join("");
    pagHtml='<div style="margin-top:18px"><div style="font-weight:bold;margin-bottom:4px">Pagamenti'+(iva?' (importi IVA 22% inclusa)':'')+'</div><table style="width:100%;border-collapse:collapse;font-size:11.5px">'+prows+'<tr style="border-top:1px solid #000"><td colspan="2" style="font-weight:bold;padding:4px 0">Totale'+(iva?' IVA inclusa':'')+'</td><td align="right" style="font-weight:bold;padding:4px 0;white-space:nowrap">&euro; '+euro(base)+'</td></tr></table></div>';
  } else pagHtml='<div style="margin-top:14px;font-size:11.5px"><strong>Pagamenti:</strong> da concordare</div>';
  return '<div style="font-family:\'Helvetica Neue\',Arial,sans-serif;color:#1a1a1a;font-size:12px;line-height:1.55;padding:18px 14px">'
   +'<div style="display:flex;justify-content:flex-end">'+LOGO_TONINI+'</div>'
   +'<div style="text-align:right;margin-top:44px">Spett.le<br><strong>'+(o.Cliente||'')+'</strong><br>'+String(D.clienteIndirizzo||"").replace(/\n/g,'<br>')+'</div>'
   +'<div style="text-align:right;margin-top:14px">'+(D.luogo||"Maserada")+', '+String(o.Data||"").slice(0,10)+'</div>'
   +(o.Commessa?'<div style="margin-top:30px;font-weight:bold">COMMESSA: '+o.Commessa+'</div>':'')
   +'<div style="margin-top:'+(o.Commessa?'8px':'30px')+';font-weight:bold">OGGETTO: '+(o.Oggetto||'')+'</div>'
   +'<p style="margin-top:16px;font-weight:bold;line-height:1.6">'+String(D.intro||"").replace(/\n/g,'<br>')+'</p>'
   +'<table style="width:100%;border-collapse:collapse;margin-top:18px;font-size:11.5px"><thead><tr style="border-bottom:1.5px solid #000"><th align="left" style="padding-bottom:5px">PR</th><th align="left">COD</th><th align="left">DESCRIZIONE</th><th align="center">Q.TA\'</th><th align="right">EURO CAD</th><th align="right">EURO TOT</th></tr></thead><tbody>'+body+'</tbody></table>'

  const byC={};
  STATE.pannelli.forEach(p=>{const c=String(p.Commesse||'').trim();if(c&&(+p.M2_residuo>0)){(byC[c]=byC[c]||{pan:[],mas:[]}).pan.push(p);}});
  STATE.massicci.forEach(p=>{const c=String(p.Commesse||'').trim();if(c&&(+p.M3_residuo>0)){(byC[c]=byC[c]||{pan:[],mas:[]}).mas.push(p);}});
  const keys=Object.keys(byC);
  h+='<div class="op-sec">Pannelli e massicci per commessa</div>';
  if(!keys.length)return h+'<div class="card" style="color:var(--gray)">Nessun pezzo riservato.</div>';
  keys.forEach(c=>{const g=byC[c];
    let body=g.pan.map(p=>'<div class="alert-row" style="border-top:1px solid var(--border)" onclick="openDettaglio(\'pannello\',\''+esc(p.ID)+'\')"><span>'+p.ID+' - '+nomeTipo(p.ArticoloID)+'</span><span style="color:var(--gray)">'+(+p.M2_residuo).toFixed(2)+' m2</span></div>').join("");
    body+=g.mas.map(p=>'<div class="alert-row" style="border-top:1px solid var(--border)" onclick="openDettaglio(\'massiccio\',\''+esc(p.ID)+'\')"><span>'+p.ID+' - '+nomeTipo(p.ArticoloID)+'</span><span style="color:var(--gray)">'+(+p.M3_residuo).toFixed(3)+' m3</span></div>').join("");
    h+='<div class="card" style="margin-bottom:10px"><div class="card-title">Commessa '+c+' ('+(g.pan.length+g.mas.length)+' pezzi)</div>'+body+'</div>';
  });
  return h;
}

function renderQR(){
  return '<div class="qr-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><h1 class="page-title" style="margin:0">QR Code</h1><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="stampaQR(true)">Stampa selezionati</button><button class="btn btn-accent" onclick="stampaQR(false)">Stampa tutti</button></div></div>'
  +(!APP_URL?'<div class="alert alert-amber">URL app non disponibile: verifica che getWebAppUrl sia presente in Code.gs.</div>':'')
  +'<div class="filters"><input id="qr-search" placeholder="Cerca per codice, nome o tipo..." oninput="qrFilter()"></div>'
  +'<div class="qr-grid" id="qr-grid">'+qrGridHTML("")+'</div>';
}
function qrGridHTML(filtro){
  let items=qrItems();
  if(filtro){const q=filtro.toLowerCase();items=items.filter(it=>(it.id+" "+it.n+" "+it.t).toLowerCase().indexOf(q)>=0);}
  return items.map(it=>'<div class="qr-card" style="position:relative"><input type="checkbox" '+(QRSEL[it.id]?'checked':'')+' onclick="qrToggle(event,\''+esc(it.id)+'\')" style="position:absolute;top:8px;left:8px;width:18px;height:18px;accent-color:var(--accent)"><img src="'+qrImg(it.id)+'" loading="lazy"><div class="qr-id">'+it.id+'</div><div style="font-size:11.5px;color:var(--gray)">'+it.n+'</div><div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px">'+it.t+(it.d?(' - '+it.d.slice(0,10)):'')+'</div></div>').join("")||'<div style="color:var(--gray)">Nessun elemento.</div>';
}
function qrFilter(){document.getElementById("qr-grid").innerHTML=qrGridHTML(document.getElementById("qr-search").value);}
function qrToggle(ev,id){ev.stopPropagation();if(QRSEL[id])delete QRSEL[id];else QRSEL[id]=true;}
function stampaQR(soloSel){
  let ids;
  if(soloSel){ids=Object.keys(QRSEL);if(!ids.length){toast("Seleziona almeno un QR","err");return;}}
  else ids=qrItems().map(i=>i.id);
  const map={};qrItems().forEach(i=>map[i.id]=i);
  const cells=ids.map(id=>{const it=map[id];if(!it)return "";return '<div style="display:inline-block;width:31%;text-align:center;border:1px solid #000;padding:8px;margin:3px;vertical-align:top;box-sizing:border-box">'+(it.img?'<img src="'+it.img+'" referrerpolicy="no-referrer" style="width:70px;height:70px;object-fit:cover;border-radius:6px;margin-bottom:4px"><br>':'')+'<img src="'+qrImg(id)+'" width="110" height="110"><div style="font-family:monospace;font-size:11px;font-weight:bold;margin-top:4px">'+id+'</div><div style="font-size:11px">'+it.n+'</div>'+(it.f?'<div style="font-size:10px;color:#666">'+it.f+(it.cf?(' - '+it.cf):'')+'</div>':'')+'</div>';}).join("");
  stampaHTML('<div>'+cells+'</div>');
}

// ============================================================
function statCommessa(cId){
  // Materiali destinati a questa commessa
  const ris=(STATE.riserve||[]).filter(r=>r.Commessa===cId&&r.Quantita>0).length;
  const pan=STATE.pannelli.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(cId)>=0).length;
  const mas=STATE.massicci.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(cId)>=0).length;
  const mov=STATE.movimenti.filter(m=>m.Commessa===cId&&m.Annullato!=="SI").length;
  return {ris:ris,pan:pan,mas:mas,mov:mov};
}
function renderCommesse(){
  const list=(STATE.commesse||[]).slice().sort((a,b)=>String(b.ID).localeCompare(String(a.ID)));
  const rows=list.map(c=>{
    const s=statCommessa(c.ID);
    const stato=String(c.Stato||'aperta').toLowerCase();
    const badgeStato=stato==='chiusa'?'<span class="badge badge-gray">chiusa</span>':'<span class="badge badge-green">aperta</span>';
    const info=[];
    if(s.ris)info.push(s.ris+' articoli destinati');
    if(s.pan)info.push(s.pan+' pannelli');
    if(s.mas)info.push(s.mas+' massicci');
    if(s.mov)info.push(s.mov+' movimenti');
    const infoTxt=info.length?info.join(' - '):'nessun materiale collegato';
    return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">'
      +'<div style="flex:1;min-width:200px"><div style="font-weight:600;font-size:15px">'+c.ID+' '+badgeStato+'</div>'
      +'<div style="font-size:13px;color:var(--gray);margin-top:2px">'+(c.Nome&&c.Nome!==c.ID?(c.Nome+' '):'')+(c.Cliente?('- '+c.Cliente):'')+'</div>'
      +'<div style="font-size:12px;color:var(--gray);margin-top:4px">'+infoTxt+'</div>'
      +(c.Note?'<div style="font-size:12px;color:var(--gray);margin-top:4px;font-style:italic">'+c.Note+'</div>':'')+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-accent" onclick="openModificaCommessa(\''+esc(c.ID)+'\')">Modifica</button>'
      +'<button class="btn btn-ghost" onclick="navTo(\'ordini\');setTimeout(function(){if(typeof ordSelComm===\'function\')ordSelComm(\''+esc(c.ID)+'\');},100)">Materiali</button>'
      +'<button class="btn btn-red" onclick="confEliminaCommessa(\''+esc(c.ID)+'\')">Elimina</button></div></div></div>';
  }).join("")||'<div class="card" style="color:var(--gray)">Nessuna commessa. Creane una col pulsante qui sopra.</div>';
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h1 class="page-title" style="margin:0">Commesse</h1><button class="btn btn-accent" onclick="openNuovaCommessa()">+ Nuova commessa</button></div>'+rows;
}
function openModificaCommessa(id){
  const c=STATE.commesse.find(x=>x.ID===id); if(!c)return;
  const stato=String(c.Stato||'aperta').toLowerCase();
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica commessa</h2>'
   +'<div class="info-box">Codice: <strong>'+c.ID+'</strong> (il codice non si puo cambiare)</div>'

   +'<div class="form-group"><label>Stato</label><select id="mc-stato"><option value="aperta"'+(stato==='aperta'?' selected':'')+'>Aperta</option><option value="chiusa"'+(stato==='chiusa'?' selected':'')+'>Chiusa</option></select></div>'
   +'<div class="form-group"><label>Note</label><input id="mc-note" value="'+(c.Note||'').replace(/"/g,"&quot;")+'"></div>'

function submitModificaCommessa(id){
  const d={ID:id,Nome:document.getElementById("mc-nome").value.trim(),Cliente:document.getElementById("mc-cli").value.trim(),Stato:document.getElementById("mc-stato").value,Note:document.getElementById("mc-note").value.trim()};

   +'<div class="alert alert-red">Stai per eliminare la commessa <strong>'+id+'</strong>.'+(haRoba?'<br><br><strong>Attenzione:</strong> ci sono materiali ancora destinati a questa commessa. Eliminandola, i pannelli/massicci resteranno assegnati al suo codice ma la commessa non sara piu in elenco. Conviene prima togliere le assegnazioni.':'')+'</div>'
   +'<div id="ec-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitEliminaCommessa(\''+esc(id)+'\')">Elimina definitivamente</button></div>');

function submitEliminaCommessa(id){
  call("eliminaCommessa",{id:id}).then(r=>{if(!r.ok){showErr("ec-err",r.err||"Errore");return;}
    call("getCommesse").then(c=>{STATE.commesse=c||[];closeModal();toast("Commessa eliminata");renderPage(STATE.pagina);});});

function openNuovaCommessa(){openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Nuova commessa</h2><div class="form-group"><label>Codice *</label><input id="nc-nome" placeholder="es. C2026.002.01"></div><div class="form-group"><label>Cliente / descrizione</label><input id="nc-cli" placeholder="es. Cameretta - Mario Rossi"></div><div id="nc-err"></div><button class="btn-primary" onclick="submitNuovaCommessa()">Crea commessa</button></div>');}
function submitNuovaCommessa(){const n=document.getElementById("nc-nome").value.trim();if(!n){showErr("nc-err","Inserisci il codice/nome.");return;}

let VOCI_COMM="", VOCI_CAT="";
function vociDi(comm){return (STATE.voci||[]).filter(v=>!comm||v.Commessa===comm);}
function categorieVoci(){
  const s={};CAT_VOCI.forEach(c=>s[c]=1);(STATE.voci||[]).forEach(v=>{if(v.Categoria)s[v.Categoria]=1;});
  return Object.keys(s).sort();
}
function renderVoci(){
  const comms=(STATE.commesse||[]).slice().sort((a,b)=>String(b.ID).localeCompare(String(a.ID)));
  const optC='<option value="">Tutte le commesse</option>'+comms.map(c=>'<option value="'+att(c.ID)+'"'+(c.ID===VOCI_COMM?' selected':'')+'>'+c.ID+(c.Nome&&c.Nome!==c.ID?(' - '+c.Nome):'')+'</option>').join("");

   +'<div class="filters"><select id="vc-comm" onchange="vociFiltro()">'+optC+'</select><select id="vc-cat" onchange="vociFiltro()">'+optK+'</select></div>'
   +'<div id="vc-cont">'+vociCont()+'</div>';
}
function vociFiltro(){
  VOCI_COMM=document.getElementById("vc-comm").value;
  VOCI_CAT=document.getElementById("vc-cat").value;
  document.getElementById("vc-cont").innerHTML=vociCont();
}
function badgeStatoVoce(s){
  const m={da_ordinare:['badge-amber','da ordinare'],ordinato:['badge-accent','ordinato'],ricevuto:['badge-green','ricevuto'],solo_costo:['badge-gray','solo costo']};
  const x=m[s]||['badge-gray',s];return '<span class="badge '+x[0]+'">'+x[1]+'</span>';
}
function vociCont(){
  let list=vociDi(VOCI_COMM);
  if(VOCI_CAT)list=list.filter(v=>v.Categoria===VOCI_CAT);
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessuna voce. Usa "+ Nuova voce" per aggiungerne una.</div>';
  // riepilogo per categoria
  const perCat={};let tot=0;
  list.forEach(v=>{const k=v.Categoria||'Altro';perCat[k]=(perCat[k]||0)+(+v.Importo||0);tot+=(+v.Importo||0);});
  const riep='<div class="card" style="margin-bottom:14px"><div class="card-title">Totale '+(VOCI_COMM?('commessa '+VOCI_COMM):'di tutte le commesse')+'</div>'
    +Object.keys(perCat).sort().map(k=>'<div class="det-row"><span>'+k+'</span><span>&euro; '+euro(perCat[k])+'</span></div>').join("")
    +'<div class="det-row" style="border-bottom:none"><span style="font-weight:700">Totale</span><span style="font-weight:700">&euro; '+euro(tot)+'</span></div></div>';
  // raggruppa per commessa quando le vedo tutte
  const g={};list.forEach(v=>{(g[v.Commessa||'(senza commessa)']=g[v.Commessa||'(senza commessa)']||[]).push(v);});
  const blocchi=Object.keys(g).sort().map(function(c){
    const righe=g[c].sort((a,b)=>String(b.Data).localeCompare(String(a.Data))).map(function(v){
      const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'';
      return '<div style="padding:11px 0;border-top:1px solid var(--border)">'
       +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px">'
       +'<div style="font-weight:600">'+v.Descrizione+' '+badgeStatoVoce(v.Stato)+(v.InOrdine?' <span class="badge badge-accent">negli ordini</span>':'')+'</div>'
       +'<div style="font-size:12px;color:var(--gray);margin-top:2px">'+v.Categoria+(v.Fornitore?(' &middot; '+v.Fornitore):'')+(q?(' &middot; '+q):'')+' &middot; '+String(v.Data||'').slice(0,10)+(v.NrFattura?(' &middot; ft. '+v.NrFattura):'')+'</div>'
       +(v.Note?'<div style="font-size:12px;color:var(--gray);font-style:italic;margin-top:2px">'+v.Note+'</div>':'')
       +'</div><div style="text-align:right;white-space:nowrap"><div style="font-weight:700">'+(v.Importo!=null&&v.Importo!==""?('&euro; '+euro(v.Importo)):'-')+'</div>'
       +'<div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-accent" onclick="openNuovaVoce(\''+esc(v.ID)+'\')">Modifica</button><button class="btn btn-red" onclick="confEliminaVoce(\''+esc(v.ID)+'\')">Elimina</button></div>'
       +'</div></div></div>';
    }).join("");
    const totC=g[c].reduce((s,v)=>s+(+v.Importo||0),0);
    return '<div class="card" style="margin-bottom:12px"><div class="card-title">'+(c==='(senza commessa)'?c:('Commessa '+c))+' &nbsp;<span style="font-weight:400;color:var(--gray)">'+g[c].length+' voci &middot; &euro; '+euro(totC)+'</span></div>'+righe+'</div>';
  }).join("");
  return riep+blocchi;
}

function aggiornaDestinazione(){
  const t=document.getElementById("mov-tipo").value;
  const c=document.getElementById("mov-comm").value;
  const w=document.getElementById("dest-wrap");
  if(w)w.style.display=(t==='carico'&&c)?'block':'none';
}
function setTipo(t){document.getElementById("mov-tipo").value=t;document.getElementById("t-c").className=t==='carico'?'on-green':'';document.getElementById("t-s").className=t==='scarico'?'on-red':'';document.getElementById("forn-wrap").style.display=t==='carico'?'block':'none';aggiornaDestinazione();}
function updStock(){const a=STATE.articoli.find(x=>x.ID===comboVal('mov'));const b=document.getElementById("stk");if(a){b.style.display="block";document.getElementById("stk-v").textContent=a.Stock+" "+a.UnitaMisura;const f=document.getElementById("mov-forn");if(f&&!f.value)f.value=a.Fornitore||"";}else b.style.display="none";}
function submitMov(){
  const id=comboVal('mov'),t=document.getElementById("mov-tipo").value,q=parseFloat(document.getElementById("mov-qty").value),c=document.getElementById("mov-comm").value,n=document.getElementById("mov-note").value;
  const forn=t==='carico'?document.getElementById("mov-forn").value:"";
  const dest=(document.getElementById("mov-dest")||{}).value||"destina";
  if(!id||!q||q<=0){showErr("mov-err","Compila articolo e quantita.");return;}
  const a=STATE.articoli.find(x=>x.ID===id);
  if(t==="scarico"&&q>+a.Stock){showErr("mov-err","Stock insufficiente. Disponibile: "+a.Stock+" "+a.UnitaMisura);return;}
  // CARICO con commessa + "scarica subito": carico e poi scarico immediato nella commessa
  if(t==='carico'&&c&&dest==='scarica'){
    call("registraMovimento",{ArticoloID:id,Tipo:"carico",Quantita:q,Commessa:"",Note:n,Fornitore:forn}).then(r1=>{
      if(!r1.ok){showErr("mov-err",r1.err);return;}
      call("registraMovimento",{ArticoloID:id,Tipo:"scarico",Quantita:q,Commessa:c,Note:n||("Consumo diretto commessa "+c)}).then(r2=>{
        if(!r2.ok){showErr("mov-err",r2.err);return;}
        refreshDopoMov();toast("Caricato e scaricato subito nella commessa "+c);
      });
    });
    return;
  }
  // CARICO con commessa + "destina": carico normale + riserva alla commessa
  if(t==='carico'&&c&&dest==='destina'){
    call("registraMovimento",{ArticoloID:id,Tipo:"carico",Quantita:q,Commessa:"",Note:n,Fornitore:forn}).then(r1=>{
      if(!r1.ok){showErr("mov-err",r1.err);return;}
      call("assegnaArticoloSingolo",{artId:id,commessa:c,quantita:q}).then(()=>{
        refreshDopoMov();toast("Caricato e destinato alla commessa "+c);
      });
    });
    return;
  }
  // Caso normale (solo carico senza commessa, o scarico)
  call("registraMovimento",{ArticoloID:id,Tipo:t,Quantita:q,Commessa:c,Note:n,Fornitore:forn}).then(r=>{
    if(!r.ok){showErr("mov-err",r.err);return;}
    STATE.articoli=STATE.articoli.map(x=>x.ID===id?Object.assign({},x,{Stock:r.nuovoStock}):x);
    STATE.movimenti.push({ID:r.id,Data:new Date().toISOString().slice(0,19).replace("T"," "),Utente:STATE.utente.Nome,ArticoloID:id,NomeArticolo:a.Nome,Tipo:t,Quantita:q,UnitaMisura:a.UnitaMisura,Commessa:c,Note:n,Fornitore:forn,Annullato:"NO"});
    closeModal();toast((t==='carico'?'Carico':'Scarico')+" registrato");renderPage(STATE.pagina);
    if(t==='scarico'&&c)setTimeout(function(){call("getRiserve").then(rs=>{const r2=(rs||[]).find(x=>x.ArticoloID===id&&x.Commessa===c);if(r2&&r2.Quantita>0)promptRiserva(id,c,r2.Quantita,a.UnitaMisura);});},300);
  });
}
function refreshDopoMov(){
  Promise.all([call("getArticoli"),call("getMovimenti"),call("getRiserve")]).then(([a,m,ri])=>{STATE.articoli=a||[];STATE.movimenti=m||[];STATE.riserve=ri||[];closeModal();renderPage(STATE.pagina);});

   +'<div class="info-box">Per la commessa <strong>'+commessa+'</strong> restano <strong>'+q+' '+(unita||'')+'</strong> ancora riservati a magazzino. Cosa vuoi fare?</div>'

function cpDestChange(){const c=document.getElementById("cp-comm").value;const w=document.getElementById("cp-destwrap");if(w)w.style.display=c?'block':'none';}
function cpTipoChange(){
  hintNome('cp-tipo','cp-hint','pannello');
  const v=(document.getElementById("cp-tipo").value||"").trim();
  if(!v)return;
  // riprende fornitore e misure dai pannelli gia caricati dello stesso tipo
  const a=STATE.articoli.find(x=>x.ID===v||x.Nome===v);
  const f=document.getElementById("cp-forn");
  const ult=STATE.pannelli.filter(p=>p.ArticoloID===v).slice(-1)[0];
  if(f&&!f.value)f.value=(ult&&ult.Fornitore)||(a&&a.Fornitore)||"";
  if(ult){
    const w=document.getElementById("cp-w"),h=document.getElementById("cp-h");
    if(w&&!w.value&&ult.Larghezza_mm)w.value=ult.Larghezza_mm;
    if(h&&!h.value&&ult.Altezza_mm)h.value=ult.Altezza_mm;
    cpPrev();
  }
}
function cpPrev(){const w=+document.getElementById("cp-w").value,h=+document.getElementById("cp-h").value,q=+document.getElementById("cp-q").value,f=+document.getElementById("cp-f").value,p=document.getElementById("cp-prev");
  if(w&&h&&q&&f){p.style.display="block";p.innerHTML='Crea P'+String(f).padStart(4,"0")+' - P'+String(f+q-1).padStart(4,"0")+' ('+((w/1000)*(h/1000)*q).toFixed(2)+' m2 totali)';}else p.style.display="none";}
function submitCP(){
  const tipo=document.getElementById("cp-tipo").value.trim(),w=document.getElementById("cp-w").value,h=document.getElementById("cp-h").value,q=document.getElementById("cp-q").value,f=document.getElementById("cp-f").value,forn=document.getElementById("cp-forn").value;
  if(!tipo){showErr("cp-err","Scrivi o scegli il tipo di pannello.");return;}
  const d={ArticoloID:tipo,Larghezza_mm:w,Altezza_mm:h,Quantita:q,PrimoID:f,Fornitore:forn,Note:document.getElementById("cp-note").value};
  if(!w||!h||!q||!f){showErr("cp-err","Compila dimensioni, quantita e primo ID.");return;}
  call("caricaPannelli",d).then(r=>{
    if(!r.ok){showErr("cp-err",r.err||"Errore.");return;}
    const c=document.getElementById("cp-comm").value;
    const dest=(document.getElementById("cp-dest")||{}).value||"destina";
    const ids=r.ids||[];
    if(c&&ids.length){
      // Destina o scarica i pannelli appena creati
      const azione=dest==='scarica'
        ? ids.map(pid=>call("scaricaPannelloTotale",{PannelloID:pid,Commessa:c,Note:"Consumo diretto commessa "+c}))
        : ids.map(pid=>call("assegnaPezzoSingolo",{tipo:"pannello",id:pid,commessa:c}));
      Promise.all(azione).then(()=>{
        Promise.all([call("getPannelli"),call("getMovimenti")]).then(([pn,mv])=>{STATE.pannelli=pn||[];STATE.movimenti=mv||[];closeModal();toast(dest==='scarica'?("Caricati e scaricati "+ids.length+" pannelli nella commessa "+c):("Caricati "+ids.length+" pannelli destinati a "+c));renderPage(STATE.pagina);});
      });
      return;
    }
    closeModal();toast("Caricati "+q+" pannelli - "+r.totM2+" m2");
    Promise.all([call("getPannelli"),call("getArticoli")]).then(([pn,ar])=>{STATE.pannelli=pn||[];STATE.articoli=ar||[];renderPage(STATE.pagina);});
  });
}

function togliDestinazione(tipo,id,commessa){

      if(!r.ok){toast(r.err||"Errore","err");return;}

    });

    call("assegnaPezzoSingolo",{tipo:tipo,id:id,commessa:""}).then(r=>{
      if(!r.ok){toast(r.err||"Errore","err");return;}
      Promise.all([call("getPannelli"),call("getMassicci"),call("getFabbisogno")]).then(([p,m,fb])=>{STATE.pannelli=p||[];STATE.massicci=m||[];STATE.fabbisogni=fb||[];toast("Pezzo "+id+" tolto dalla commessa");closeModal();renderPage(STATE.pagina);});

}

    btns='<button class="det-btn" style="background:var(--red-light);color:var(--red)" onclick="closeModal();openScaricoPannello(\''+esc(p.ID)+'\')">Scarico pannello</button><button class="det-btn" style="background:var(--accent-light);color:var(--accent)" onclick="openAssegnaItem(\'pannello\',\''+esc(p.ID)+'\')">'+(String(p.Commesse||'').trim()?'Cambia / togli commessa':'Assegna a commessa')+'</button><button class="det-btn" style="background:var(--red);color:#fff" onclick="confElimina(\'pannello\',\''+esc(p.ID)+'\')">Elimina pannello</button>';

    btns=m.Annullato==='SI'?'':'<button class="det-btn" style="background:var(--accent-light);color:var(--accent)" onclick="closeModal();openModificaMovimento(\''+esc(m.ID)+'\')">Modifica movimento</button><button class="det-btn" style="background:#efebe3;color:var(--gray)" onclick="closeModal();openAnnulla(\''+esc(m.ID)+'\')">Annulla movimento</button>';
  }
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button>'+head+rows+btns+(hist?'<div class="det-hist"><h4>Storico movimenti</h4>'+hist+'</div>':'')+'</div>');

// -- COMBOBOX con suggerimenti --
let COMBO={}, COMBOCB={};
function comboInit(idBase,items,cb){COMBO[idBase]=items||[];COMBOCB[idBase]=cb||null;}
function comboHTML(idBase,placeholder,valId,valLabel){
  return '<div style="position:relative"><input id="'+idBase+'-q" value="'+(valLabel||"").replace(/"/g,"&quot;")+'" placeholder="'+placeholder+'" autocomplete="off" oninput="comboFilter(\''+idBase+'\')" onfocus="comboShow(\''+idBase+'\')"><input type="hidden" id="'+idBase+'-val" value="'+(valId||"")+'"><div id="'+idBase+'-list" class="combo-list" style="display:none"></div></div>';
}
function comboFilter(idBase){
  const q=(document.getElementById(idBase+"-q").value||"").toLowerCase();
  const all=(COMBO[idBase]||[]).filter(it=>it.label.toLowerCase().indexOf(q)>=0);
  const items=all.slice(0,300);
  const list=document.getElementById(idBase+"-list");
  let html=items.map(it=>'<div class="combo-item" style="display:flex;align-items:center;gap:9px" onclick="comboPick(\''+idBase+'\',\''+esc(it.id)+'\')">'+(it.img?'<img src="'+it.img+'" referrerpolicy="no-referrer" style="width:34px;height:34px;object-fit:cover;border-radius:6px;flex-shrink:0">':'<div style="width:34px;height:34px;border-radius:6px;background:var(--accent-light);flex-shrink:0"></div>')+'<span>'+it.label+'</span></div>').join("");
  if(all.length>items.length)html+='<div class="combo-item" style="color:var(--gray);font-size:12px;text-align:center">...e altri '+(all.length-items.length)+'. Scrivi per filtrare.</div>';
  if(!items.length)html='<div class="combo-item" style="color:var(--gray)">'+(idBase==='fb'?'Nessun tipo esistente — scrivi un nome per crearne uno nuovo, poi compila le misure.':'Nessun risultato')+'</div>';
  list.innerHTML=html;
  list.style.display="block";
}
function comboShow(idBase){comboFilter(idBase);}
function comboPick(idBase,id){const it=(COMBO[idBase]||[]).find(x=>x.id===id);document.getElementById(idBase+"-val").value=id;document.getElementById(idBase+"-q").value=it?it.label:id;document.getElementById(idBase+"-list").style.display="none";if(COMBOCB[idBase])COMBOCB[idBase]();}
function comboVal(idBase){return document.getElementById(idBase+"-val").value;}

// -- IMMAGINI --
function imgUrlFor(rifId){const x=(STATE.immagini||[]).find(i=>i.RifID===rifId);return x?x.ThumbUrl:"";}
function imgBlock(rifId){
  const url=imgUrlFor(rifId);
  let h='<div style="text-align:center;margin-bottom:14px">';
  if(url)h+='<img src="'+url+'" referrerpolicy="no-referrer" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--border)"><br>';
  else h+='<div style="height:80px;display:flex;align-items:center;justify-content:center;background:var(--accent-light);border-radius:12px;color:var(--accent);font-size:13px;margin-bottom:8px">Nessuna immagine</div>';
  h+='<button class="btn btn-ghost" onclick="caricaImmagine(\''+esc(rifId)+'\')">'+(url?'Cambia immagine':'Carica immagine')+'</button>';
  if(url)h+=' <button class="btn btn-red" onclick="rimuoviImmagine(\''+esc(rifId)+'\')">Rimuovi</button>';
  return h+'</div>';
}
function caricaImmagine(rifId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){const f=inp.files[0]; if(!f)return; if(f.size>5000000){toast("Immagine troppo grande (max 5MB)","err");return;}
    const rd=new FileReader();
    rd.onload=function(){const b64=String(rd.result).split(",")[1]; toast("Caricamento immagine...");
      call("salvaImmagine",{rifId:rifId,base64:b64,mime:f.type,nome:rifId}).then(r=>{if(!r.ok){toast(r.err||"Errore","err");return;}
        call("getImmagini").then(im=>{STATE.immagini=im||[];toast("Immagine salvata");
          if(CURRENT_DETAIL)openDettaglio(CURRENT_DETAIL.tipo,CURRENT_DETAIL.id); else renderPage(STATE.pagina);});
      });
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function rimuoviImmagine(rifId){call("eliminaImmagine",{rifId:rifId}).then(()=>{call("getImmagini").then(im=>{STATE.immagini=im||[];toast("Immagine rimossa");if(CURRENT_DETAIL)openDettaglio(CURRENT_DETAIL.tipo,CURRENT_DETAIL.id);else renderPage(STATE.pagina);});});}

// -- ELIMINA ELEMENTO --
function confElimina(tipo,id){
  const extra=tipo==='articolo'?'<br>Verranno eliminati anche eventuali pannelli/massicci collegati a questo tipo.':'';
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Elimina '+tipo+'</h2><div class="alert alert-red">Stai per eliminare definitivamente <strong>'+id+'</strong>. L\'operazione non e reversibile.'+extra+'</div><div id="el-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitElimina(\''+tipo+'\',\''+esc(id)+'\')">Elimina definitivamente</button></div>');
}
function submitElimina(tipo,id){
  const fn=tipo==='articolo'?'eliminaArticolo':tipo==='pannello'?'eliminaPannello':'eliminaMassiccio';
  call(fn,{id:id}).then(r=>{if(!r.ok){showErr("el-err",r.err||"Errore");return;}
    closeModal();toast("Eliminato: "+id);
    Promise.all([call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti")]).then(([a,p,m,mv])=>{STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];STATE.movimenti=mv||[];renderPage(STATE.pagina);});
  });
}

// -- MODIFICA MOVIMENTO --
function openModificaMovimento(id){
  const m=STATE.movimenti.find(x=>x.ID===id); if(!m)return;
  const pezzi=String(m.PezzoID||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(m.Tipo==='carico'&&pezzi.length&&pezzi[0].charAt(0)==='P')return openModCaricoPannelli(id,pezzi);
  if(m.Tipo==='carico'&&pezzi.length&&pezzi[0].charAt(0)==='M')return openModCaricoMassicci(id,pezzi);
  const haPezzi=pezzi.length>0;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica movimento</h2>'
   +'<div class="info-box">'+m.NomeArticolo+' - '+m.Tipo+'</div>'
   +(haPezzi?'<div class="info-box">Movimento legato a un pezzo: puoi correggere fornitore, commessa e note.</div>':'<div class="form-group"><label>Quantita ('+m.UnitaMisura+')</label><input type="number" step="any" id="mm-q" value="'+m.Quantita+'"></div>')
   +'<div class="form-group"><label>Fornitore</label><input id="mm-forn" value="'+(m.Fornitore||'').replace(/"/g,"&quot;")+'"></div>'
   +'<div class="form-group"><label>Commessa</label><select id="mm-comm" onchange="onCommessaChange(\'mm-comm\')">'+optCommesse(m.Commessa)+'</select></div>'
   +'<div class="form-group"><label>Note</label><input id="mm-note" value="'+(m.Note||'').replace(/"/g,"&quot;")+'"></div>'
   +'<div id="mm-err"></div><button class="btn-primary" onclick="submitModificaMovimento(\''+esc(id)+'\')">Salva modifiche</button></div>');
}

   +'<div class="form-row"><div class="form-group"><label>N. pannelli *</label><input type="number" id="mcp-q" min="1" value="'+pezzi.length+'"></div><div class="form-group"><label>Primo ID *</label><input type="number" id="mcp-f" value="'+primo+'"></div></div>'
   +'<div class="form-group"><label>Fornitore</label><input id="mcp-forn" value="'+((first.Fornitore||m.Fornitore||'')+'').replace(/"/g,"&quot;")+'"></div>'

function submitModCaricoPannelli(id){

function openModCaricoMassicci(id,pezzi){

function mcmModo(mo){document.getElementById("mcm-modo").value=mo;document.getElementById("mcm-tm").className=mo==='misure'?'on-accent':'';document.getElementById("mcm-tt").className=mo==='totale'?'on-accent':'';document.getElementById("mcm-misure").style.display=mo==='misure'?'block':'none';document.getElementById("mcm-totale").style.display=mo==='totale'?'block':'none';}
function submitModCaricoMassicci(id){
  const modo=document.getElementById("mcm-modo").value;
  const d={movId:id,modo:modo,PrimoID:document.getElementById("mcm-f").value,Fornitore:document.getElementById("mcm-forn").value};

  else d.M3totale=document.getElementById("mcm-m3").value;
  call("modificaCaricoMassicci",d).then(r=>{if(!r.ok){showErr("mcm-err",r.err||"Errore");return;}
    Promise.all([call("getMassicci"),call("getArticoli"),call("getMovimenti")]).then(([p,a,mv])=>{STATE.massicci=p||[];STATE.articoli=a||[];STATE.movimenti=mv||[];closeModal();toast("Carico modificato");renderPage(STATE.pagina);});
  });
}
function submitModificaMovimento(id){
  const m=STATE.movimenti.find(x=>x.ID===id); if(!m)return;
  const haPezzi=String(m.PezzoID||"").trim()!=="";
  const d={movId:id,Commessa:document.getElementById("mm-comm").value,Fornitore:document.getElementById("mm-forn").value,Note:document.getElementById("mm-note").value};
  if(!haPezzi){const q=document.getElementById("mm-q"); if(q)d.Quantita=q.value;}
  call("modificaMovimento",d).then(r=>{if(!r.ok){showErr("mm-err",r.err||"Errore");return;}
    Promise.all([call("getMovimenti"),call("getArticoli")]).then(([mv,a])=>{STATE.movimenti=mv||[];STATE.articoli=a||[];closeModal();toast("Movimento aggiornato");renderPage(STATE.pagina);});
  });
}

// -- RICERCA DIGITABILE NELLE TENDINE --
function filtraOpzioni(selId,q){
  const s=document.getElementById(selId); if(!s)return;
  q=(q||"").toLowerCase();
  for(let i=0;i<s.options.length;i++){const o=s.options[i];if(o.value==="")continue;o.hidden=o.text.toLowerCase().indexOf(q)<0;}
}
function openAnnulla(mid){openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Annulla movimento</h2><div class="alert alert-amber">L\'annullamento inverte lo stock.</div><div class="form-group"><label>Motivo *</label><textarea id="an-n" rows="3" placeholder="es. inserimento errato"></textarea></div><div id="an-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitAnnulla(\''+mid+'\')">Conferma annullamento</button></div>');}
function submitAnnulla(mid){const n=document.getElementById("an-n").value.trim();if(!n){showErr("an-err","Inserisci il motivo.");return;}
  call("annullaMovimento",{movId:mid,nota:n}).then(r=>{if(!r.ok){showErr("an-err",r.err||"Errore.");return;}STATE.movimenti=STATE.movimenti.map(m=>m.ID===mid?Object.assign({},m,{Annullato:"SI"}):m);closeModal();toast("Movimento annullato");renderPage(STATE.pagina);});}
</script>
