<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --accent:#8a6d4e;--accent-light:#f0e9e0;
    --green:#5c6b4f;--green-light:#eaeee3;
    --red:#a4513f;--red-light:#f4e6e1;
    --amber:#b08534;--amber-light:#f6eedd;
    --gray:#7a736b;--border:#e7e1d7;--white:#fff;
    --bg:#f7f4ee;--ink:#3a342d;--radius:16px
  }
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  h1,h2,.serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:.3px}

  #app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  main{flex:1;overflow:auto;padding:26px 30px}

  .sidebar-header{padding:22px 18px 16px;border-bottom:1px solid var(--border)}
  .sidebar-header h1{font-size:17px;color:var(--accent)}
  .sidebar-header small{color:var(--gray);font-size:11px;display:block;margin-top:4px}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 18px;color:var(--gray);text-decoration:none;font-size:13.5px;cursor:pointer;transition:.15s}
  nav a:hover{background:var(--accent-light);color:var(--ink)}
  nav a.active{background:var(--accent-light);color:var(--accent);font-weight:600;border-left:3px solid var(--accent)}
  .nav-dot{width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.55;flex-shrink:0}
  .nav-badge{margin-left:auto;background:var(--red-light);color:var(--red);font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
  .sidebar-footer{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border)}
  .btn-nuovo{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:600;font-size:13.5px}
  .btn-nuovo:hover{background:#74583c}

  .page-title{font-size:22px;margin-bottom:20px;color:var(--ink)}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 3px rgba(80,60,40,.05)}
  .card-title{font-size:14px;font-weight:600;margin-bottom:14px}
  details.acc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 3px rgba(80,60,40,.05);margin-bottom:14px;overflow:hidden}
  details.acc>summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;user-select:none}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--gray);font-weight:400}
  details.acc[open]>summary::after{content:"\2013"}
  details.acc>summary .sum-badge{margin-left:auto;background:var(--red-light);color:var(--red);font-size:12px;padding:2px 10px;border-radius:11px}
  details.acc[open]>summary .sum-badge{margin-left:0}
  .acc-body{padding:0 20px 18px}
  .big-op{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .big-op button{padding:22px 14px;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(80,60,40,.08)}
  .op-sec{font-family:Georgia,serif;font-size:18px;margin:18px 0 10px}
  .reorder-forn{border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:12px}
  .reorder-forn h4{font-size:14px;font-weight:700;margin-bottom:2px}

  .stat{display:flex;justify-content:space-between;align-items:flex-start}
  .stat-label{font-size:11.5px;color:var(--gray);margin-bottom:7px}
  .stat-value{font-size:30px;font-weight:600;line-height:1}
  .stat-sub{font-size:11px;color:var(--gray);margin-top:6px}
  .ico-tile{min-width:46px;height:46px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}

  .qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
  .qa{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:0 1px 3px rgba(80,60,40,.05);transition:.15s;display:flex;align-items:center;gap:14px}
  .qa:hover{box-shadow:0 6px 18px rgba(80,60,40,.12);transform:translateY(-2px)}
  .qa-txt b{display:block;font-size:14px;font-weight:600}
  .qa-txt span{font-size:11.5px;color:var(--gray)}

  .alert{padding:14px 18px;border-radius:var(--radius);margin-bottom:20px;font-size:13px}
  .alert-red{background:var(--red-light);border:1px solid #e6c4b8;color:var(--red)}
  .alert-amber{background:var(--amber-light);border:1px solid #e6cf9f;color:#7c5a16}
  .alert-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;cursor:pointer}
  .alert-row+.alert-row{border-top:1px solid rgba(0,0,0,.06)}

  .table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--white)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{background:#faf8f4}
  th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
  td{padding:11px 14px;border-bottom:1px solid var(--border)}
  tbody tr{cursor:pointer}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#faf8f4}

  .badge{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600}
  .badge-green{background:var(--green-light);color:var(--green)}
  .badge-red{background:var(--red-light);color:var(--red)}
  .badge-amber{background:var(--amber-light);color:#7c5a16}
  .badge-accent{background:var(--accent-light);color:var(--accent)}
  .badge-gray{background:#efebe3;color:var(--gray)}

  .btn{padding:6px 12px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
  .btn-green{background:var(--green-light);color:var(--green)}
  .btn-red{background:var(--red-light);color:var(--red)}
  .btn-accent{background:var(--accent-light);color:var(--accent)}
  .btn-ghost{background:#efebe3;color:var(--gray);border:1px solid var(--border)}

  .bar-wrap{height:7px;background:#ece6dc;border-radius:5px;overflow:hidden}
  .bar-fill{height:7px;border-radius:5px}

  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .filters input,.filters select{padding:10px 12px;border:1px solid var(--border);border-radius:11px;font-size:13px;background:#fff;outline:none}
  .filters input{flex:1;min-width:140px}
  .filters input:focus,.filters select:focus{border-color:var(--accent)}
  .combo-list{position:absolute;z-index:60;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:3px;max-height:220px;overflow:auto;box-shadow:0 8px 22px rgba(60,45,30,.16)}
  .combo-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
  .combo-item:last-child{border-bottom:none}
  .combo-item:hover{background:var(--accent-light)}

  .piece-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pmin,232px),1fr));gap:var(--pgap,12px)}
  .piece{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(80,60,40,.05);position:relative}
  .piece-row{display:flex;gap:11px;align-items:flex-start}
  .piece-thumb{width:60px;height:60px;flex-shrink:0;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
  .piece-body{flex:1;min-width:0;padding-right:18px}
  .sel-chk{position:absolute;top:10px;right:10px;width:20px;height:20px;cursor:pointer;accent-color:var(--accent)}
  #bulk-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:940;background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;display:none;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13px;font-weight:600}
  #bulk-bar button{border:none;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
  .piece:hover{box-shadow:0 5px 14px rgba(80,60,40,.10);transform:translateY(-1px)}
  .piece h4{font-size:14px;font-weight:600;margin-bottom:3px}
  .piece small{color:var(--gray);font-size:11px;display:block;margin-bottom:9px}

  .modal-overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
  .modal{background:#fff;border-radius:18px;padding:24px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.25)}
  .modal h2{font-size:18px;margin-bottom:18px}
  .modal-close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray);margin-top:-6px}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;color:var(--gray);margin-bottom:5px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;outline:none;font-family:inherit}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .btn-primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:600;font-size:14.5px;margin-top:6px}
  .btn-primary:hover{background:#74583c}
  .toggle{display:flex;gap:9px;margin-bottom:15px}
  .toggle button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--border);cursor:pointer;font-weight:600;font-size:13px;background:#faf8f4;color:var(--gray)}
  .toggle button.on-green{background:var(--green-light);color:var(--green);border-color:#b9c4a8}
  .toggle button.on-red{background:var(--red-light);color:var(--red);border-color:#e0bbac}
  .toggle button.on-accent{background:var(--accent-light);color:var(--accent);border-color:#d6c3aa}
  .info-box{background:#faf8f4;border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--gray);margin-bottom:12px}
  .err-box{background:var(--red-light);border:1px solid #e6c4b8;color:var(--red);padding:10px 13px;border-radius:11px;font-size:13px;margin-bottom:12px}

  .det-tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:11px;padding:3px 11px;border-radius:11px;font-weight:600;margin-bottom:10px}
  .det-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .det-row span:first-child{color:var(--gray)}
  .det-row span:last-child{font-weight:600;text-align:right}
  .det-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
  .det-hist{margin-top:16px}
  .det-hist h4{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);margin-bottom:8px}
  .det-mov{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}

  #toast{position:fixed;bottom:26px;right:26px;z-index:9999;padding:13px 20px;border-radius:12px;font-weight:600;font-size:13px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  #toast.ok{background:var(--green-light);color:var(--green);border:1px solid #b9c4a8}
  #toast.err{background:var(--red-light);color:var(--red);border:1px solid #e0bbac}

  .spinner{display:inline-block;width:18px;height:18px;border:2px solid #ece6dc;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-page{display:flex;align-items:center;justify-content:center;min-height:240px;color:var(--gray)}

  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .qr-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;text-align:center}
  .qr-card img{width:130px;height:130px}
  .qr-id{font-family:monospace;font-size:12px;font-weight:600;margin-top:6px}

  .mobile-nav{display:none}
  .fab{display:none}
  #ver-badge{position:fixed;top:8px;right:54px;z-index:950;font-size:10px;color:var(--gray);background:var(--white);border:1px solid var(--border);padding:3px 9px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #btn-refresh{position:fixed;top:6px;right:10px;z-index:952;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:18px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
  #btn-backup{position:fixed;bottom:18px;right:18px;z-index:951;height:42px;padding:0 14px;border-radius:22px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);cursor:pointer;font-size:14px;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
  #btn-restore{position:fixed;bottom:18px;right:150px;z-index:951;height:42px;padding:0 14px;border-radius:22px;background:#fff;color:var(--gray);border:1.5px solid var(--border);cursor:pointer;font-size:14px;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
  #btn-backup:hover{background:var(--accent);color:#fff}
  #btn-restore:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:768px){#btn-backup{bottom:150px;right:14px;padding:0;width:42px;border-radius:50%}#btn-backup .bk-txt{display:none}#btn-restore{bottom:200px;right:14px;padding:0;width:42px;border-radius:50%}#btn-restore .bk-txt{display:none}}
  #btn-refresh:hover{background:#74583c}
  #btn-refresh.spin-on{animation:spin .7s linear infinite}
  @media(max-width:680px){
    aside{display:none}
    main{padding:16px 14px 86px}
    .table-wrap{overflow-x:auto}
    table{min-width:600px}
    .grid-4{grid-template-columns:1fr 1fr}
    .grid-2,.grid-3,.qa-grid{grid-template-columns:1fr}

    .mobile-nav a{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:5px 0;font-size:9px;color:var(--gray);text-decoration:none;font-weight:600;text-align:center}

       --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;}

document.addEventListener("DOMContentLoaded", () => {

  APP_URL = window.location.origin + window.location.pathname;
  try {
    const params = new URLSearchParams(window.location.search);
    const q = params.get("qr"); if (q) QR_TARGET = q;
    const p = params.get("p"); if (p) PAGINA_INIZIALE = p;
    SOLO_DETTATURA = (params.get("solo") === "1");
    // se la scorciatoia porta alla dettatura, l'icona da mettere in home

    if (PAGINA_INIZIALE === "dettatura") {
      const ic = document.getElementById("icona-home");
      if (ic) ic.setAttribute("href", ICONA_MIC);
      const tt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (tt) tt.setAttribute("content", "Detta");
      // su Android l'icona in home parte da quello che dice il manifest,
      // non dall'indirizzo aperto: gliene do uno che punta alla dettatura
      const mf = document.querySelector('link[rel="manifest"]');
      if (mf) mf.setAttribute("href", "manifest-dettatura.json");
    }
  } catch(e){}
  const savedLogin = localStorage.getItem("at_utente");
  if (savedLogin) { try { UTENTE_CORRENTE = JSON.parse(savedLogin); } catch(e){} }

function loadAll() {
  try{var sl=document.getElementById("side-logo");if(sl)sl.src=LOGO_IMG;}catch(e){}

  .then(res => {
    const errs = [];
    const ok = (v,name,def) => { if (v && v.__err) { errs.push(name); return def; } return (v==null?def:v); };
    STATE.articoli  = ok(res[0],"Articoli",[]);
    STATE.pannelli  = ok(res[1],"Pannelli",[]);
    STATE.massicci  = ok(res[2],"Massicci",[]);
    STATE.movimenti = ok(res[3],"Movimenti",[]);
    STATE.commesse  = ok(res[4],"Commesse",[]);
    STATE.fornitori = ok(res[5],"Fornitori",[]);
    STATE.fabbisogni= ok(res[6],"Fabbisogni",[]);
    STATE.modelli   = ok(res[7],"Modelli",[]);
    STATE.immagini  = ok(res[8],"Immagini",[]);
    STATE.ordini    = ok(res[9],"Ordini",[]);
    STATE.utente    = ok(res[10],"Utente",{});

  const ids=Object.keys(SEL),tipo=SELTIPO;

function submitBulk(){
  const ids=Object.keys(SEL),tipo=SELTIPO,c=document.getElementById("bk-comm").value,n=document.getElementById("bk-note").value;
  if(!ids.length){closeModal();return;}
  call("scaricaBulk",{tipo:tipo,ids:ids,commessa:c,note:n}).then(r=>{
    if(!r.ok){showErr("bk-err",r.err||"Errore.");return;}
    const falliti=(r.risultati||[]).filter(x=>!x.ok);
    closeModal(); SEL={};SELTIPO=null;

      STATE.pannelli=pn||[];STATE.massicci=ms||[];STATE.articoli=ar||[];STATE.movimenti=mv||[];

      toast(falliti.length?("Scaricati "+(ids.length-falliti.length)+"/"+ids.length+" ("+falliti.length+" errori)"):("Scaricati "+ids.length+" elementi"),falliti.length?"err":"ok");
    });
  });
}

async function sbGet(table, params) {
  let url = SB_URL + "/rest/v1/" + table + "?";
  if (params) url += params;
  else url += "select=*";
  const r = await fetch(url, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
async function sbPatch(table, filter, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + table + "?" + filter, {
    method: "PATCH",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json", Prefer: "return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, filter) {
  const r = await fetch(SB_URL + "/rest/v1/" + table + "?" + filter, {
    method: "DELETE",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}

      const movId = newId("MOV-");
      await sbPost("movimenti", { id: movId, data: nowStr(), utente: UTENTE_CORRENTE ? UTENTE_CORRENTE.Nome : "Utente", articolo_id: p.articolo_id, nome_articolo: p.articolo_id, tipo: "scarico", quantita: m2_usati, unita_misura: "m²", commessa: d.Commessa || "", pezzo_id: d.PannelloID, note: d.Note || "Scarico totale residuo", annullato: false, fornitore: "" });
      return { ok: true, newStock: null };
    }
    // Modifica anagrafica di un pezzo gia caricato (pannello o massiccio).
    // Se cambiano le misure, ricalcola la superficie/volume mantenendo la
    // stessa percentuale di residuo gia consumata.
    if (fn === "modificaPezzo") {
      const d = args, pan = d.tipo === "pannello";
      const tab = pan ? "pannelli" : "massicci";
      const rows = await sbGet(tab, "select=*&id=eq." + encodeURIComponent(d.id));
      if (!rows.length) return { ok: false, err: "Pezzo non trovato." };
      const p = rows[0];
      const upd = { articolo_id: d.Materiale || p.articolo_id, fornitore: d.Fornitore || "", note: d.Note || "" };
      if (pan) {
        const w = parseInt(d.Larghezza_mm) || p.larghezza_mm, h = parseInt(d.Altezza_mm) || p.altezza_mm;
        if (w !== p.larghezza_mm || h !== p.altezza_mm) {
          const nuovoOrig = round5((w/1000)*(h/1000));
          const frazione = (+p.m2_originale > 0) ? (+p.m2_residuo / +p.m2_originale) : 1;
          upd.larghezza_mm = w; upd.altezza_mm = h;
          upd.m2_originale = nuovoOrig;
          upd.m2_residuo = round5(nuovoOrig * frazione);
          upd.residuale_pct = Math.round(frazione * 10000) / 100;
        }
      } else {
        const L = parseInt(d.Lunghezza_mm) || p.lunghezza_mm, W = parseInt(d.Larghezza_mm) || p.larghezza_mm, S = parseInt(d.Spessore_mm) || p.spessore_mm;
        if (L !== p.lunghezza_mm || W !== p.larghezza_mm || S !== p.spessore_mm) {
          const nuovoOrig = round5((L/1000)*(W/1000)*(S/1000));
          const frazione = (+p.m3_originale > 0) ? (+p.m3_residuo / +p.m3_originale) : 1;
          upd.lunghezza_mm = L; upd.larghezza_mm = W; upd.spessore_mm = S;
          upd.m3_originale = nuovoOrig;
          upd.m3_residuo = round5(nuovoOrig * frazione);
        }
      }
      await sbPatch(tab, "id=eq." + encodeURIComponent(d.id), upd);
      // se cambia il nome del materiale, allineo anche i movimenti del pezzo
      if (d.Materiale && d.Materiale !== p.articolo_id) {
        await sbPatch("movimenti", "pezzo_id=eq." + encodeURIComponent(d.id),
          { articolo_id: d.Materiale, nome_articolo: d.Materiale }).catch(()=>{});
      }
      return { ok: true };
    }
    if (fn === "eliminaPannello") {
      const id = typeof args === "string" ? args : args.id;
      await sbDelete("pannelli", "id=eq." + encodeURIComponent(id));
      return { ok: true };
    }

    // ---- MASSICCI (indipendenti: non toccano lo stock articoli) ----
    if (fn === "caricaRefiloMassiccio") {
      const d = args;
      const desc = (d.Descrizione || "").trim();
      if (!desc) return { ok: false, err: "Inserisci una descrizione." };
      const L = parseInt(d.Lunghezza_mm) || null, W = parseInt(d.Larghezza_mm) || null, S = parseInt(d.Spessore_mm) || null;
      const forn = d.Fornitore || "";
      let m3 = 0;
      if (L && W && S) m3 = round5((L/1000)*(W/1000)*(S/1000));
      else if (d.M3) m3 = round5(parseFloat(d.M3));
      // Codice RM-progressivo nascosto
      const tutti = await sbGet("massicci", "select=id");
      let mx = 0;
      tutti.forEach(p => { const m = String(p.id||"").match(/^RM(\d+)$/); if (m) { const n = parseInt(m[1],10)||0; if (n>mx) mx=n; } });
      const mid = "RM" + String(mx + 1).padStart(4, "0");
      await sbPost("massicci", { id: mid, articolo_id: desc, lunghezza_mm: L, larghezza_mm: W, spessore_mm: S, m3_originale: m3, m3_residuo: m3, commesse: "", fornitore: forn, data_carico: nowStr(), note: d.Note || "REFILO" });
      const movId = newId("MOV-");
      await sbPost("movimenti", { id: movId, data: nowStr(), utente: UTENTE_CORRENTE ? UTENTE_CORRENTE.Nome : "Utente", articolo_id: desc, nome_articolo: desc, tipo: "carico", quantita: m3, unita_misura: "m³", commessa: "", pezzo_id: mid, note: "Carico refilo massello: " + desc, annullato: false, fornitore: forn });
      return { ok: true, id: mid, m3 };
    }
    if (fn === "caricaMassicci") {
      const d = args;
      const tipo = d.ArticoloID || d.NuovoTipo || "Massiccio";
      const forn = d.Fornitore || "";
      const start = parseInt(d.PrimoID) || 1;
      const nuovi = [], rows = [];
      let totM3 = 0;
      if (d.modo === "totale") {
        const m3 = round5(parseFloat(d.M3totale));
        if (!m3 || m3 <= 0) return { ok: false, err: "m3 non validi." };
        const mid = "M" + String(start).padStart(4, "0");
        nuovi.push(mid); rows.push({ id: mid, articolo_id: tipo, lunghezza_mm: null, larghezza_mm: null, spessore_mm: null, m3_originale: m3, m3_residuo: m3, commesse: "", fornitore: forn, data_carico: nowStr(), note: d.Note || "" });
        totM3 = m3;
      } else {
        const L = parseInt(d.Lunghezza_mm), W = parseInt(d.Larghezza_mm), S = parseInt(d.Spessore_mm), qty = parseInt(d.Quantita);
        if (!L||!W||!S||!qty) return { ok: false, err: "Dati non validi." };
        const m3 = round5((L/1000)*(W/1000)*(S/1000));
        for (let i = 0; i < qty; i++) {
          const mid = "M" + String(start + i).padStart(4, "0");
          nuovi.push(mid); rows.push({ id: mid, articolo_id: tipo, lunghezza_mm: L, larghezza_mm: W, spessore_mm: S, m3_originale: m3, m3_residuo: m3, commesse: "", fornitore: forn, data_carico: nowStr(), note: d.Note || "" });
        }
        totM3 = round5(m3 * qty);
      }
      for (const row of rows) await sbPost("massicci", row);
      const movId = newId("MOV-");
      await sbPost("movimenti", { id: movId, data: nowStr(), utente: UTENTE_CORRENTE ? UTENTE_CORRENTE.Nome : "Utente", articolo_id: tipo, nome_articolo: tipo, tipo: "carico", quantita: totM3, unita_misura: "m³", commessa: "", pezzo_id: nuovi.join(","), note: "Carico massiccio", annullato: false, fornitore: forn });
      return { ok: true, ids: nuovi, totM3, newStock: null, articoloId: tipo };
    }
    if (fn === "scaricaMassiccio") {
      const d = args;
      const pRows = await sbGet("massicci", "select=*&id=eq." + encodeURIComponent(d.MassiccioID));
      if (!pRows.length) return { ok: false, err: "Massiccio non trovato." };
      const p = pRows[0];
      let uso = 0;
      if (d.modo === "misure") uso = round5((d.L/1000)*(d.W/1000)*(d.S/1000));
      else uso = round5(parseFloat(d.UsoM3));
      const nuovo = round5(p.m3_residuo - uso);
      if (nuovo < 0) return { ok: false, err: "Supera il residuo." };
      const comm = p.commesse ? p.commesse.split(",").map(s=>s.trim()).filter(Boolean) : [];
      if (d.Commessa && comm.indexOf(d.Commessa) === -1) comm.push(d.Commessa);
      await sbPatch("massicci", "id=eq." + encodeURIComponent(d.MassiccioID), { m3_residuo: nuovo, commesse: comm.join(", ") });
      const movId = newId("MOV-");
      await sbPost("movimenti", { id: movId, data: nowStr(), utente: UTENTE_CORRENTE ? UTENTE_CORRENTE.Nome : "Utente", articolo_id: p.articolo_id, nome_articolo: p.articolo_id, tipo: "scarico", quantita: uso, unita_misura: "m³", commessa: d.Commessa || "", pezzo_id: d.MassiccioID, note: d.Note || "", annullato: false, fornitore: "" });
      return { ok: true, nuovo_m3_residuo: nuovo, newStock: null };
    }
    if (fn === "scaricaMassiccioTotale") {
      const d = args;
      const pRows = await sbGet("massicci", "select=*&id=eq." + encodeURIComponent(d.MassiccioID));
      if (!pRows.length) return { ok: false, err: "Massiccio non trovato." };
      const p = pRows[0];
      const uso = p.m3_residuo;
      const comm = p.commesse ? p.commesse.split(",").map(s=>s.trim()).filter(Boolean) : [];
      if (d.Commessa && comm.indexOf(d.Commessa) === -1) comm.push(d.Commessa);
      await sbPatch("massicci", "id=eq." + encodeURIComponent(d.MassiccioID), { m3_residuo: 0, commesse: comm.join(", ") });
      const movId = newId("MOV-");
      await sbPost("movimenti", { id: movId, data: nowStr(), utente: UTENTE_CORRENTE ? UTENTE_CORRENTE.Nome : "Utente", articolo_id: p.articolo_id, nome_articolo: p.articolo_id, tipo: "scarico", quantita: uso, unita_misura: "m³", commessa: d.Commessa || "", pezzo_id: d.MassiccioID, note: d.Note || "Scarico totale", annullato: false, fornitore: "" });
      return { ok: true, newStock: null };
    }
    if (fn === "eliminaMassiccio") {
      const id = typeof args === "string" ? args : args.id;
      await sbDelete("massicci", "id=eq." + encodeURIComponent(id));
      return { ok: true };
    }

    // ---- BULK ----
    if (fn === "eliminaBulk") {
      for (const id of args.ids) await call(args.tipo === "pannello" ? "eliminaPannello" : args.tipo === "massiccio" ? "eliminaMassiccio" : "eliminaArticolo", { id });
      return { ok: true };
    }
    if (fn === "scaricaBulk") {
      const risultati = [];
      for (const id of args.ids) {
        let r;
        if (args.tipo === "pannello") r = await call("scaricaPannelloTotale", { PannelloID: id, Commessa: args.commessa, Note: args.note });
        else if (args.tipo === "massiccio") r = await call("scaricaMassiccioTotale", { MassiccioID: id, Commessa: args.commessa, Note: args.note });
        else r = await call("registraMovimento", { ArticoloID: id, Tipo: "scarico", Quantita: (STATE.articoli.find(a=>a.ID===id)||{}).Stock || 0, Commessa: args.commessa, Note: args.note });
        risultati.push(r);
      }
      return { ok: true, risultati };
    }

    // ---- FORNITORI ----
    if (fn === "salvaFornitore") {
      const d = args;
      const exists = await sbGet("fornitori", "select=nome&nome=eq." + encodeURIComponent(d.Nome));
      if (exists.length) await sbPatch("fornitori", "nome=eq." + encodeURIComponent(d.Nome), { email: d.Email || "", telefono: d.Telefono || "", note: d.Note || "" });
      else await sbPost("fornitori", { nome: d.Nome, email: d.Email || "", telefono: d.Telefono || "", note: d.Note || "" });
      return { ok: true };
    }
    if (fn === "eliminaFornitore") {
      await sbDelete("fornitori", "nome=eq." + encodeURIComponent(args.Nome));
      return { ok: true };
    }

    // ---- COMMESSE ----
    if (fn === "salvaCommessa") {
      const d = args;
      if (d.ID) {
        await sbPatch("commesse", "id=eq." + encodeURIComponent(d.ID), { nome: d.Nome, cliente: d.Cliente, stato: d.Stato, note: d.Note });
        return { ok: true, id: d.ID };
      } else {
        // Il codice/nome digitato diventa l'ID della commessa (es. "C2026.002.01")
        const id = (d.Nome || "").trim() || newId("C-");
        // Evita duplicati
        const esiste = await sbGet("commesse", "select=id&id=eq." + encodeURIComponent(id));
        if (esiste.length) return { ok: false, err: "Esiste già una commessa con questo codice." };
        await sbPost("commesse", { id, nome: d.Nome, cliente: d.Cliente || "", data_apertura: new Date().toISOString().slice(0,10), stato: d.Stato || "aperta", note: d.Note || "" });
        return { ok: true, id };
      }
    }
    // ---- CAMBIO DEL CODICE DI UNA COMMESSA (aggiorna tutto lo storico) ----
    if (fn === "cambiaCodiceCommessa") {
      const v = String(args.vecchio || "").trim();
      const n = String(args.nuovo || "").trim();
      if (!v || !n) return { ok: false, err: "Manca il codice." };
      if (v === n) return { ok: false, err: "Il codice nuovo è uguale a quello vecchio." };
      const vecchia = await sbGet("commesse", "select=*&id=eq." + encodeURIComponent(v));
      if (!vecchia.length) return { ok: false, err: "Non trovo la commessa " + v + "." };
      const esiste = await sbGet("commesse", "select=*&id=eq." + encodeURIComponent(n));
      if (esiste.length && !args.unisci)
        return { ok: false, err: "Esiste già una commessa con il codice " + n + ". Se vuoi unire le due, spunta la casella." };
      // 1) creo la commessa con il codice nuovo (se non c'e' gia')
      if (!esiste.length) {
        const c = vecchia[0];
        await sbPost("commesse", { id: n,
          nome: (args.nome !== undefined && args.nome !== null) ? args.nome : (c.nome || n),
          cliente: c.cliente || "", data_apertura: c.data_apertura || null,
          stato: c.stato || "aperta", note: c.note || "" });
      }
      // 2) sposto tutti i riferimenti dal codice vecchio a quello nuovo
      const risultato = {};
      const tabelle = [["movimenti","movimenti"],["voci_commessa","altre voci"],["ore","ore"],
                       ["fabbisogni","righe di Crea ordine"],["ordini","ordini"],
                       ["riserve","riserve"],["rettifiche","rettifiche"],["offerte","offerte"]];
      for (const t of tabelle) {
        try { const r = await sbPatch(t[0], "commessa=eq." + encodeURIComponent(v), { commessa: n });
              if ((r || []).length) risultato[t[1]] = r.length; }
        catch (e) { risultato[t[1]] = "errore"; }
      }
      // 3) pannelli e massicci: il campo puo' contenere piu' commesse separate da virgola
      for (const t of [["pannelli","pannelli"],["massicci","massicci"]]) {
        let k = 0;
        try {
          const rows = await sbGet(t[0], "select=id,commesse");
          for (const row of rows) {
            const lista = String(row.commesse || "").split(",").map(x => x.trim()).filter(Boolean);
            if (lista.indexOf(v) < 0) continue;
            const nuova = [];
            lista.forEach(function (x) { const y = (x === v) ? n : x; if (nuova.indexOf(y) < 0) nuova.push(y); });
            await sbPatch(t[0], "id=eq." + encodeURIComponent(row.id), { commesse: nuova.join(",") });
            k++;
          }
        } catch (e) { risultato[t[1]] = "errore"; continue; }
        if (k) risultato[t[1]] = k;
      }
      // 4) tolgo la commessa vecchia
      await sbDelete("commesse", "id=eq." + encodeURIComponent(v));
      return { ok: true, risultato: risultato, unito: !!esiste.length };
    }
    // ---- CREAZIONE DI PIU' COMMESSE IN UNA VOLTA ----
    if (fn === "creaCommesseBulk") {
      const gia = (await sbGet("commesse", "select=id")).map(r => String(r.id));
      const oggi = new Date().toISOString().slice(0, 10);
      const nuove = [], saltate = [];
      (args.righe || []).forEach(function (r) {
        const id = String(r.ID || "").trim();
        if (!id) return;
        if (gia.indexOf(id) >= 0 || nuove.filter(x => x.id === id).length) { saltate.push(id); return; }
        nuove.push({ id: id, nome: String(r.Nome || "").trim() || id, cliente: String(r.Cliente || "").trim(),
          data_apertura: oggi, stato: "aperta", note: "" });

      if (nuove.length) await sbPost("commesse", nuove);
      return { ok: true, create: nuove.length, saltate: saltate };
    }
    if (fn === "eliminaCommessa") {
      await sbDelete("commesse", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }

    // ---- ASSEGNAZIONI ----
    if (fn === "assegnaPezzoSingolo") {
      const tabP = args.tipo === "pannello" ? "pannelli" : "massicci";
      await sbPatch(tabP, "id=eq." + encodeURIComponent(args.id), { commesse: args.commessa || "" });
      // IMPORTANTE: i report leggono i MOVIMENTI, non il campo commesse del pezzo.
      // Se il pezzo e' gia' stato scaricato, allineo anche i suoi movimenti di
      // scarico, altrimenti resterebbe nel report della vecchia commessa.
      // Gli scarichi hanno sempre un solo pezzo, quindi il confronto esatto e' sicuro.
      let allineati = 0;
      try {
        const mv = await sbPatch("movimenti",
          "pezzo_id=eq." + encodeURIComponent(args.id) + "&tipo=eq.scarico&annullato=is.false",
          { commessa: args.commessa || "" });
        allineati = (mv || []).length;
      } catch (e) { /* nessun movimento da allineare */ }
      return { ok: true, movAllineati: allineati };
    }

    // ---- INVIO ORDINE ----
    if (fn === "inviaOrdineFornitore") {
      // Senza email server, salva solo l'ordine
      const id = newId("ORD-");
      await sbPost("ordini", { id, data: nowStr(), commessa: "", fornitore: args.fornitore || "", stato: "emesso", righe: JSON.stringify(args.articoli || []), note: args.note || "", email: args.email || "" }).catch(()=>{});
      return { ok: true };
    }

    // ---- MODIFICA CARICO PANNELLI/MASSICCI ----
    if (fn === "modificaCaricoPannelli") {
      const d = args;
      const movRows = await sbGet("movimenti", "select=*&id=eq." + encodeURIComponent(d.movId));
      if (!movRows.length) return { ok: false, err: "Movimento non trovato." };
      const m = movRows[0];
      if (m.annullato) return { ok: false, err: "Movimento annullato." };
      const oldIds = (m.pezzo_id || "").split(",").map(s=>s.trim()).filter(Boolean);
      for (const pid of oldIds) await call("eliminaPannello", { id: pid });
      return call("caricaPannelli", { ArticoloID: m.articolo_id, Larghezza_mm: d.Larghezza_mm, Altezza_mm: d.Altezza_mm, Quantita: d.Quantita, PrimoID: d.PrimoID, Fornitore: d.Fornitore });
    }
    if (fn === "modificaCaricoMassicci") {
      const d = args;
      const movRows = await sbGet("movimenti", "select=*&id=eq." + encodeURIComponent(d.movId));
      if (!movRows.length) return { ok: false, err: "Movimento non trovato." };
      const m = movRows[0];
      if (m.annullato) return { ok: false, err: "Movimento annullato." };
      const oldIds = (m.pezzo_id || "").split(",").map(s=>s.trim()).filter(Boolean);
      for (const mid of oldIds) await call("eliminaMassiccio", { id: mid });
      return call("caricaMassicci", { ArticoloID: m.articolo_id, modo: d.modo, Lunghezza_mm: d.Lunghezza_mm, Larghezza_mm: d.Larghezza_mm, Spessore_mm: d.Spessore_mm, Quantita: d.Quantita, M3totale: d.M3totale, PrimoID: d.PrimoID, Fornitore: d.Fornitore });
    }

    // ---- RISERVE ----
    async function setRiserva(artId, commessa, delta) {
      const rows = await sbGet("riserve", "select=*&articolo_id=eq." + encodeURIComponent(artId) + "&commessa=eq." + encodeURIComponent(commessa));
      const cur = rows.length ? (parseFloat(rows[0].quantita) || 0) : 0;
      const nuovo = round5(cur + delta);
      if (rows.length) {
        if (nuovo <= 0) await sbDelete("riserve", "articolo_id=eq." + encodeURIComponent(artId) + "&commessa=eq." + encodeURIComponent(commessa));
        else await sbPatch("riserve", "articolo_id=eq." + encodeURIComponent(artId) + "&commessa=eq." + encodeURIComponent(commessa), { quantita: nuovo });
      } else if (nuovo > 0) {
        await sbPost("riserve", { articolo_id: artId, commessa: commessa, quantita: nuovo });
      }
      return Math.max(0, nuovo);
    }
    async function aggiornaImpegnato(artId, delta, segno) {
      const rows = await sbGet("articoli", "select=stock,impegnato&id=eq." + encodeURIComponent(artId));
      if (!rows.length) return null;
      const cur = parseFloat(rows[0].impegnato) || 0, stock = parseFloat(rows[0].stock) || 0;
      let nuovo = (segno === "add") ? cur + (+delta) : cur - (+delta);
      nuovo = Math.max(0, Math.min(round5(nuovo), stock));
      await sbPatch("articoli", "id=eq." + encodeURIComponent(artId), { impegnato: nuovo });
      return nuovo;
    }
    if (fn === "liberaRiserva") {
      const rows = await sbGet("riserve", "select=*&articolo_id=eq." + encodeURIComponent(args.artId) + "&commessa=eq." + encodeURIComponent(args.commessa));
      if (!rows.length) return { ok: true, liberato: 0 };
      const q = parseFloat(rows[0].quantita) || 0;
      await sbDelete("riserve", "articolo_id=eq." + encodeURIComponent(args.artId) + "&commessa=eq." + encodeURIComponent(args.commessa));
      if (q > 0) await aggiornaImpegnato(args.artId, q, "sub");
      return { ok: true, liberato: q };
    }
    if (fn === "annullaAssegnazione") {
      if (args.tipo === "articolo") {
        const rows = await sbGet("riserve", "select=*&articolo_id=eq." + encodeURIComponent(args.artId) + "&commessa=eq." + encodeURIComponent(args.commessa));
        const cur = rows.length ? (parseFloat(rows[0].quantita) || 0) : 0;
        const q = parseFloat(args.quantita) || cur;
        const rel = Math.min(q, cur);
        if (rel > 0) { await setRiserva(args.artId, args.commessa, -rel); await aggiornaImpegnato(args.artId, rel, "sub"); }
        return { ok: true, liberato: rel };
      }
      const tab = args.tipo === "pannello" ? "pannelli" : "massicci";
      const pezzi = await sbGet(tab, "select=*&articolo_id=eq." + encodeURIComponent(args.artId));
      let freed = 0; const n = parseInt(args.numPezzi) || 0;
      for (const p of pezzi) {
        if (String(p.commesse || "").trim() === String(args.commessa)) {
          if (n && freed >= n) break;
          await sbPatch(tab, "id=eq." + encodeURIComponent(p.id), { commesse: "" });
          freed++;
        }
      }
      return { ok: true, liberati: freed };
    }

    // Aggiorna assegnaArticoloSingolo/assegnaPezzoSingolo per usare le riserve
    if (fn === "assegnaArticoloSingolo") {
      const rows = await sbGet("articoli", "select=stock,impegnato&id=eq." + encodeURIComponent(args.artId));
      if (!rows.length) return { ok: false, err: "Articolo non trovato." };
      const stock = parseFloat(rows[0].stock) || 0, imp = parseFloat(rows[0].impegnato) || 0;
      const libero = Math.max(0, round5(stock - imp));
      const q = Math.min(parseFloat(args.quantita) || 0, libero);
      if (q <= 0) return { ok: false, err: "Niente di disponibile da assegnare (libero " + libero + ")." };
      await sbPatch("articoli", "id=eq." + encodeURIComponent(args.artId), { impegnato: round5(imp + q) });
      await setRiserva(args.artId, args.commessa, q);
      return { ok: true, assegnato: q, daOrdinare: round5(Math.max(0, (parseFloat(args.quantita) || 0) - q)) };
    }
    // assegnaArticoloCommessa = come assegnaArticoloSingolo (usato da "assegna a magazzino")
    if (fn === "assegnaArticoloCommessa") {
      return call("assegnaArticoloSingolo", { artId: args.artId, commessa: args.commessa, quantita: args.quantita });
    }
    // assegnaPezziCommessa: assegna N pezzi liberi del tipo alla commessa (primo disponibile)
    if (fn === "assegnaPezziCommessa") {
      const tab = args.tipo === "pannello" ? "pannelli" : "massicci";
      const pezzi = await sbGet(tab, "select=*&articolo_id=eq." + encodeURIComponent(args.artId));
      const n = parseInt(args.numPezzi) || 0;
      let ass = 0;
      for (const p of pezzi) {
        if (ass >= n) break;
        const res = args.tipo === "pannello" ? p.m2_residuo : p.m3_residuo;
        if ((parseFloat(res) || 0) > 0 && !String(p.commesse || "").trim()) {
          await sbPatch(tab, "id=eq." + encodeURIComponent(p.id), { commesse: args.commessa });
          ass++;
        }
      }
      return { ok: true, assegnati: ass, daOrdinare: Math.max(0, n - ass) };
    }

    // ---- RETTIFICHE ----
    if (fn === "salvaRettifica") {
      const id = args.ID || newId("RET-");
      const exists = args.ID ? await sbGet("rettifiche", "select=id&id=eq." + encodeURIComponent(id)) : [];
      const row = { id, commessa: args.Commessa || "", voce: args.Voce || "", valore: args.Valore || "", note: args.Note || "", data: nowStr() };
      if (exists.length) await sbPatch("rettifiche", "id=eq." + encodeURIComponent(id), row);
      else await sbPost("rettifiche", row);
      return { ok: true, id };
    }
    if (fn === "eliminaRettifica") {
      await sbDelete("rettifiche", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }

    // ---- MODELLI ----
    if (fn === "salvaModello") {
      const upd = {};
      if (args.Oggetto !== undefined) upd.oggetto = args.Oggetto || "";
      if (args.Corpo !== undefined) upd.corpo = args.Corpo || "";
      await sbPatch("modelli", "chiave=eq." + encodeURIComponent(args.Chiave), upd);
      return { ok: true };
    }

    // ---- OFFERTE ----
    if (fn === "salvaOfferta") {
      const anno = new Date().getFullYear();
      const id = args.ID || ("OFF-" + anno + "-" + Date.now().toString(36).slice(-4).toUpperCase());
      const row = { id, data: args.Data || nowStr(), cliente: args.Cliente || "", commessa: args.Commessa || "", oggetto: args.Oggetto || "", dati: JSON.stringify(args.Dati || {}) };
      const exists = args.ID ? await sbGet("offerte", "select=id&id=eq." + encodeURIComponent(id)) : [];
      if (exists.length) await sbPatch("offerte", "id=eq." + encodeURIComponent(id), row);
      else await sbPost("offerte", row);
      return { ok: true, id };
    }
    if (fn === "eliminaOfferta") {
      await sbDelete("offerte", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }

    // ---- IMMAGINI (Supabase Storage) ----
    if (fn === "salvaImmagine") {
      try {
        // Decodifica base64 in blob
        const mime = args.mime || "image/jpeg";
        const ext = mime.indexOf("png") >= 0 ? "png" : mime.indexOf("webp") >= 0 ? "webp" : "jpg";
        const byteChars = atob(args.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: mime });
        const fileName = encodeURIComponent(args.rifId) + "_" + Date.now() + "." + ext;
        // Rimuovi vecchia immagine collegata
        const old = await sbGet("immagini", "select=*&rif_id=eq." + encodeURIComponent(args.rifId));
        if (old.length && old[0].file_id) {
          await fetch(SB_URL + "/storage/v1/object/immagini/" + old[0].file_id, { method: "DELETE", headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } }).catch(()=>{});
        }
        // Carica la nuova
        const up = await fetch(SB_URL + "/storage/v1/object/immagini/" + fileName, {
          method: "POST",
          headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": mime },
          body: blob
        });
        if (!up.ok) return { ok: false, err: "Upload fallito: " + (await up.text()) };
        const thumbUrl = SB_URL + "/storage/v1/object/public/immagini/" + fileName;
        const row = { rif_id: args.rifId, file_id: fileName, thumb_url: thumbUrl, data: nowStr() };
        if (old.length) await sbPatch("immagini", "rif_id=eq." + encodeURIComponent(args.rifId), row);
        else await sbPost("immagini", row);
        return { ok: true, thumbUrl, fileId: fileName };
      } catch (e) { return { ok: false, err: e.message }; }
    }
    if (fn === "eliminaImmagine") {
      const old = await sbGet("immagini", "select=*&rif_id=eq." + encodeURIComponent(args.rifId));
      if (old.length && old[0].file_id) {
        await fetch(SB_URL + "/storage/v1/object/immagini/" + old[0].file_id, { method: "DELETE", headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } }).catch(()=>{});
      }
      await sbDelete("immagini", "rif_id=eq." + encodeURIComponent(args.rifId));
      return { ok: true };
    }

    // ---- FABBISOGNI ----
    if (fn === "aggiungiFabbisogno") {
      const id = newId("FAB-");
      await sbPost("fabbisogni", { id, commessa: args.Commessa || "", tipo: args.Tipo || "articolo", articolo_id: args.ArticoloID || "", descrizione: args.Descrizione || "", num_pezzi: args.NumPezzi || null, dim1: args.Dim1 || null, dim2: args.Dim2 || null, dim3: args.Dim3 || null, quantita: args.Quantita || null, unita_misura: args.UnitaMisura || "", fornitore: args.Fornitore || "", stato: args.Stato || "da_ordinare", data_richiesta: nowStr(), note: args.Note || "" });
      return { ok: true, id };
    }
    if (fn === "aggiornaStatoFabbisogno") {
      await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(args.id), { stato: args.stato });
      return { ok: true };
    }
    if (fn === "eliminaFabbisogno") {
      await sbDelete("fabbisogni", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }
    if (fn === "riceviFabbisogno") {
      const rows = await sbGet("fabbisogni", "select=*&id=eq." + encodeURIComponent(args.id));
      if (!rows.length) return { ok: false, err: "Riga non trovata." };
      const r = rows[0];
      if (String(r.stato).toLowerCase() === "ricevuto") return { ok: false, err: "Già ricevuto." };
      const num = parseInt(r.num_pezzi) || 1, d1 = parseInt(r.dim1) || 0, d2 = parseInt(r.dim2) || 0, d3 = parseInt(r.dim3) || 0, qta = parseFloat(r.quantita) || 0;
      if (!r.articolo_id) return { ok: false, err: "Manca il tipo/articolo." };
      if (r.tipo === "articolo") {
        if (qta > 0) await call("registraMovimento", { ArticoloID: r.articolo_id, Tipo: "carico", Quantita: qta, Fornitore: r.fornitore, Commessa: r.commessa, Note: "Ricezione ordine commessa " + r.commessa });
      } else if (r.tipo === "pannello") {
        if (d1 && d2) await call("caricaPannelli", { ArticoloID: r.articolo_id, Larghezza_mm: d1, Altezza_mm: d2, Quantita: num, Fornitore: r.fornitore });
      } else {
        if (d1 && d2 && d3) await call("caricaMassicci", { ArticoloID: r.articolo_id, modo: "misure", Lunghezza_mm: d1, Larghezza_mm: d2, Spessore_mm: d3, Quantita: num, Fornitore: r.fornitore });
      }
      await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(args.id), { stato: "ricevuto" });
      return { ok: true };
    }

    // ---- ORDINI ----
    async function nextNumeroOrdine() {
      const anno = String(new Date().getFullYear());
      const rows = await sbGet("ordini", "select=id");
      let mx = 0;
      rows.forEach(r => { const m = String(r.id || "").match(/^(\d{4})\s*-\s*(\d+)/); if (m && m[1] === anno) { const n = parseInt(m[2], 10) || 0; if (n > mx) mx = n; } });
      return anno + " - " + String(mx + 1).padStart(3, "0");
    }
    if (fn === "emettiOrdineCommessa") {
      const id = await nextNumeroOrdine();
      await sbPost("ordini", { id, data: nowStr(), commessa: args.commessa || "", fornitore: args.fornitore || "", stato: "emesso", righe: JSON.stringify(args.righe || []), note: "", email: args.email || "" });
      // Segna i fabbisogni come ordinati
      for (const a of (args.righe || [])) {
        if (a.fabId) await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(a.fabId), { stato: "ordinato" }).catch(()=>{});
      }
      return { ok: true, id, _noemail: true };
    }
    if (fn === "emettiOrdineGenerico") {
      const id = await nextNumeroOrdine();
      const righe = (args.righe || []).map(r => ({ tipo: "generico", artId: "", descrizione: r.descrizione, nome: r.descrizione, dettaglio: (r.quantita || "") + " " + (r.unita || ""), quantita: r.quantita, unita: r.unita || "pz", note: r.note || "" }));
      await sbPost("ordini", { id, data: nowStr(), commessa: "", fornitore: args.fornitore || "", stato: "emesso", righe: JSON.stringify(righe), note: "GENERICO", email: args.email || "" });
      return { ok: true, id, _noemail: true };
    }
    if (fn === "riceviOrdine") {
      const rows = await sbGet("ordini", "select=*&id=eq." + encodeURIComponent(args.id));
      if (!rows.length) return { ok: false, err: "Ordine non trovato." };
      if (String(rows[0].stato).toLowerCase() === "ricevuto") return { ok: false, err: "Ordine già ricevuto." };
      const righe = typeof rows[0].righe === "string" ? JSON.parse(rows[0].righe || "[]") : (rows[0].righe || []);
      const commessa = rows[0].commessa || "", forn = rows[0].fornitore || "";
      for (const r of righe) {
        const num = parseInt(r.numPezzi) || 1, d1 = parseInt(r.dim1) || 0, d2 = parseInt(r.dim2) || 0, d3 = parseInt(r.dim3) || 0, qta = parseFloat(r.quantita) || 0;
        if (r.tipo === "generico") {
          if (qta > 0) await call("registraMovimento", { ArticoloID: r.artId || (await call("salvaArticolo", { Nome: r.nome || r.descrizione, Categoria: "Generici", UnitaMisura: r.unita || "pz", Stock: 0 })).id, Tipo: "carico", Quantita: qta, Fornitore: forn, Note: "Ricezione ordine generico" });
        } else if (r.artId) {
          if (r.tipo === "articolo" && qta > 0) {
            await call("registraMovimento", { ArticoloID: r.artId, Tipo: "carico", Quantita: qta, Fornitore: forn, Commessa: commessa, Note: "Ricezione ordine commessa " + commessa });
            if (commessa) { await aggiornaImpegnato(r.artId, qta, "add"); await setRiserva(r.artId, commessa, qta); }
          } else if (r.tipo === "pannello" && d1 && d2) {
            await call("caricaPannelli", { ArticoloID: r.artId, Larghezza_mm: d1, Altezza_mm: d2, Quantita: num, Fornitore: forn });
          } else if (r.tipo === "massiccio" && d1 && d2 && d3) {
            await call("caricaMassicci", { ArticoloID: r.artId, modo: "misure", Lunghezza_mm: d1, Larghezza_mm: d2, Spessore_mm: d3, Quantita: num, Fornitore: forn });
          }
        }
        if (r.fabId) await sbPatch("fabbisogni", "id=eq." + encodeURIComponent(r.fabId), { stato: "ricevuto" }).catch(()=>{});
        if (r.voceId) await sbPatch("voci_commessa", "id=eq." + encodeURIComponent(r.voceId), { stato: "ricevuto" }).catch(()=>{});
      }
      await sbPatch("ordini", "id=eq." + encodeURIComponent(args.id), { stato: "ricevuto" });
      return { ok: true };
    }
    if (fn === "eliminaOrdine") {
      await sbDelete("ordini", "id=eq." + encodeURIComponent(args.id));
      return { ok: true };
    }
    if (fn === "segnalaOrdine") {
      const rows = await sbGet("ordini", "select=*&id=eq." + encodeURIComponent(args.id));
      if (rows.length) await sbPatch("ordini", "id=eq." + encodeURIComponent(args.id), { note: (rows[0].note || "") + " [SEGNALATO: " + (args.problema || "") + "]" });
      return { ok: true, _noemail: true };
    }


    console.warn("call() funzione non implementata:", fn);
    return { ok: true };
  } catch (e) {
    console.error("Errore call(" + fn + "):", e);
    return { ok: false, err: e.message || String(e) };
  }
}
function toast(msg,tipo){const el=document.getElementById("toast");el.textContent=msg;el.className=tipo||"ok";el.style.display="block";setTimeout(()=>el.style.display="none",3500);}

async function doLogin(){
  const email=document.getElementById("lg-email").value.trim();
  const pwd=document.getElementById("lg-pwd").value.trim();
  const err=document.getElementById("lg-err");
  if(!email||!pwd){err.textContent="Inserisci email e password.";return;}
  try {
    const rows = await sbGet("utenti","select=*&email=eq."+encodeURIComponent(email));
    if(!rows.length){err.textContent="Utente non trovato.";return;}
    const u=rows[0];
    if(u.password!==pwd){err.textContent="Password errata.";return;}
    if(!u.attivo){err.textContent="Account disabilitato.";return;}
    UTENTE_CORRENTE={Email:u.email,Nome:u.nome||u.email,Ruolo:u.ruolo||"operator",autorizzato:true};
    localStorage.setItem("at_utente",JSON.stringify(UTENTE_CORRENTE));
    document.querySelector("aside").style.display="";
    document.querySelector(".mobile-nav").style.display="";

    var bb2=document.getElementById("btn-backup");if(bb2)bb2.style.display="";

}
function doLogout(){
  if(!confirm("Vuoi uscire dall'app? Dovrai reinserire la password al prossimo accesso."))return;
  try{localStorage.removeItem("at_utente");}catch(e){}
  UTENTE_CORRENTE=null;
  location.reload();
}
// Aggiorna: ricarica i dati dal foglio senza cambiare pagina.
// Reload completo della pagina con doppio click o pressione prolungata (utile dopo una nuova pubblicazione).
let _refreshTimer=null;
function refreshApp(){
  const btn=document.getElementById("btn-refresh"); if(btn)btn.classList.add("spin-on");
  const cur=STATE.pagina||"dashboard";
  const sc=fn=>call(fn).catch(()=>[]);
  Promise.all([sc("getArticoli"),sc("getPannelli"),sc("getMassicci"),sc("getMovimenti"),sc("getCommesse"),sc("getFornitori"),sc("getFabbisogno"),sc("getModelli"),sc("getImmagini"),sc("getOrdini"),sc("getRiserve"),sc("getVoci"),sc("getPersonale"),sc("getOre"),sc("getDettature")])
  .then(([a,p,m,mv,c,f,fb,md,im,or,ri,vc,pe,oe,de])=>{
    STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];STATE.movimenti=mv||[];
    STATE.commesse=c||[];STATE.fornitori=f||[];STATE.fabbisogni=fb||[];STATE.modelli=md||[];STATE.immagini=im||[];STATE.ordini=or||[];STATE.riserve=ri||[];STATE.voci=vc||[];STATE.personale=pe||[];STATE.ore=oe||[];STATE.dettature=de||[];
    renderPage(cur);toast("Dati aggiornati");
  })
  .catch(()=>toast("Errore durante l'aggiornamento da Supabase","err"))
  .then(()=>{if(btn)btn.classList.remove("spin-on");});
}
function reloadApp(){ toast("Ricarico l'app..."); setTimeout(function(){ try{location.reload();}catch(e){window.location.href=window.location.href;} },150); }
document.addEventListener("DOMContentLoaded",()=>{
  const b=document.getElementById("btn-refresh"); if(!b)return;
  b.addEventListener("dblclick",e=>{e.preventDefault();reloadApp();});
  b.addEventListener("mousedown",()=>{_refreshTimer=setTimeout(reloadApp,650);});
  b.addEventListener("touchstart",()=>{_refreshTimer=setTimeout(reloadApp,650);},{passive:true});
  ["mouseup","mouseleave","touchend","touchmove"].forEach(ev=>b.addEventListener(ev,()=>{if(_refreshTimer){clearTimeout(_refreshTimer);_refreshTimer=null;}}));
});
function esc(s){return String(s==null?"":s).replace(/'/g,"\\'");}
function colorPct(p){return p>60?"var(--green)":p>30?"var(--amber)":"var(--red)";}
// Quota "destinata a commesse": articoli da Impegnato, pannelli/massicci dai pezzi assegnati a commessa
function impegnatoArt(a){return +a.Impegnato||0;}
function destinatoPannelli(artId){return STATE.pannelli.filter(p=>p.ArticoloID===artId&&String(p.Commesse||"").trim()).reduce((s,p)=>s+(+p.M2_residuo||0),0);}
function destinatoMassicci(artId){return STATE.massicci.filter(p=>p.ArticoloID===artId&&String(p.Commesse||"").trim()).reduce((s,p)=>s+(+p.M3_residuo||0),0);}

function riordiniRaggruppati(){
  const sotto=STATE.articoli.filter(a=>+a.Stock<=+a.SogliaRiordino);
  const emailDi={}; STATE.fornitori.forEach(f=>emailDi[String(f.Nome).trim().toLowerCase()]=f.Email||"");
  const g={};
  sotto.forEach(a=>{const forn=a.Fornitore||"(senza fornitore)";if(!g[forn])g[forn]={fornitore:forn,email:emailDi[String(forn).trim().toLowerCase()]||"",articoli:[]};g[forn].articoli.push(a);});
  return Object.keys(g).map(k=>g[k]);
}
function renderReorderBody(){
  const gruppi=riordiniRaggruppati();
  if(!gruppi.length)return '<div class="acc-body" style="color:var(--gray);font-size:13.5px">Nessun materiale sotto soglia. Tutto in ordine.</div>';
  const opt=gruppi.map(g=>'<option value="'+esc(g.fornitore)+'">'+g.fornitore+' ('+g.articoli.length+' da ordinare)</option>').join("");
  return '<div class="acc-body"><div class="form-group"><label>Fornitore da riordinare</label><select id="ri-sel" onchange="mostraRiordino(this.value)">'+opt+'</select></div><div id="ri-box">'+riordinoBoxHTML(gruppi[0].fornitore)+'</div></div>';
}
function riordinoBoxHTML(forn){

  h+='<div style="font-size:11.5px;color:var(--gray);margin-bottom:8px">'+(g.email?('Email fornitore: '+g.email):'<span style="color:var(--red)">email mancante</span>')+' &nbsp;<a onclick="openFornitore(\''+esc(forn)+'\')" style="color:var(--accent);cursor:pointer;text-decoration:underline">modifica</a></div>';
  g.articoli.forEach(a=>{h+='<div class="alert-row" style="border-top:1px solid var(--border)" onclick="openDettaglio(\'articolo\',\''+esc(a.ID)+'\')"><span>'+a.Nome+(a.CodiceFornitore?' <span style="color:var(--gray);font-size:11px">cod. '+a.CodiceFornitore+'</span>':'')+'</span><span>'+a.Stock+' '+a.UnitaMisura+' / soglia '+a.SogliaRiordino+'</span></div>';});
  return h;
}
function mostraRiordino(forn){const b=document.getElementById("ri-box");if(b)b.innerHTML=riordinoBoxHTML(forn);}

function renderPanoramicaBody(){
  const m2=STATE.pannelli.reduce((s,p)=>s+(+p.M2_residuo||0),0);
  const m3=STATE.massicci.reduce((s,p)=>s+(+p.M3_residuo||0),0);
  const byC={}; STATE.movimenti.filter(m=>m.Commessa&&m.Annullato!=='SI'&&m.Tipo==='scarico').forEach(m=>{const k=m.Commessa;if(!byC[k])byC[k]={};const u=m.UnitaMisura||'pz';byC[k][u]=(byC[k][u]||0)+(+m.Quantita||0);});
  const sc=(lbl,val)=>'<div class="card" style="padding:14px 16px"><div class="stat-label">'+lbl+'</div><div class="stat-value" style="font-size:24px">'+val+'</div></div>';
  const comm=Object.keys(byC).map(c=>{const parti=Object.keys(byC[c]).map(u=>byC[c][u].toFixed(u==='pz'?0:3)+' '+u).join(' - ');return '<div class="alert-row" style="border-top:1px solid var(--border)" onclick="navTo(\'report\')"><span style="font-weight:600;font-family:monospace">'+c+'</span><span style="color:var(--gray)">'+parti+'</span></div>';}).join("")||'<div style="color:var(--gray);font-size:13px">Nessun consumo registrato per commessa.</div>';
  return '<div class="acc-body"><div class="grid-4" style="margin-bottom:16px">'+sc("Articoli",STATE.articoli.length)+sc("Pannelli (m2 residui)",m2.toFixed(2))+sc("Massicci (m3 residui)",m3.toFixed(3))+sc("Commesse attive",Object.keys(byC).length)+'</div><div style="font-weight:600;margin-bottom:6px">Consumi per commessa</div>'+comm+reportBox()+'</div>';
}

// ============================================================
//  ESPORTAZIONE CSV
//  Stessi dati dei PDF, ma apribili in Excel: separatore punto e
//  virgola, virgola decimale, BOM per gli accenti.
// ============================================================
function csvCella(v){
  let t=String(v==null?'':v);
  t=t.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]*>/g,'')
     .replace(/&euro;/g,'EUR').replace(/&middot;/g,'-').replace(/&mdash;/g,'-')
     .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&sup2;/g,'2').replace(/&sup3;/g,'3');
  if(/[";\n\r]/.test(t))t='"'+t.replace(/"/g,'""')+'"';
  return t;
}
function csvNum(v,dec){
  if(v===null||v===undefined||v==='')return '';
  const n=Number(v); if(isNaN(n))return '';
  return n.toFixed(dec==null?3:dec).replace('.',',');
}
function csvPct(usato,nome,unita){
  const p=pctUsoNum(usato,nome,unita);
  return p==null?'':csvNum(p,1);
}
function oggiFile(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function scaricaCsv(nome,righe){
  if(!righe||righe.length<2){toast("Niente da esportare","err");return;}
  const txt='\ufeff'+righe.map(r=>r.map(csvCella).join(';')).join('\r\n');
  scaricaFile(new Blob([txt],{type:'text/csv;charset=utf-8;'}),nome);
  toast("CSV scaricato: "+nome);
}

// ---- CSV: report di una commessa ----
function csvReportCommessa(comm){
  const out=[['Sezione','Data','Materiale o voce','Categoria / cod. fornitore','Codici pezzo',
    'Quantita','Unita','% del caricato','Importo EUR','Fornitore','N. fattura','Stato','Note','Operatore']];
  const movs=movCommessa(comm).filter(m=>m.Tipo==='scarico');
  const cfDi=function(m){let a=(STATE.articoli||[]).find(x=>x.ID===m.ArticoloID);
    if(!a)a=(STATE.articoli||[]).find(x=>x.Nome===m.NomeArticolo||x.Nome===m.ArticoloID);
    return (a&&a.CodiceFornitore)||'';};
  // totali per materiale
  const tot={};
  movs.forEach(function(m){const k=m.NomeArticolo+'||'+m.UnitaMisura;
    tot[k]=tot[k]||{nome:m.NomeArticolo,unita:m.UnitaMisura,cf:cfDi(m),q:0,n:0,pezzi:[]};
    tot[k].q+=(+m.Quantita||0);tot[k].n++;
    if(m.PezzoID)String(m.PezzoID).split(',').map(x=>x.trim()).filter(Boolean).forEach(p=>{if(tot[k].pezzi.indexOf(p)<0)tot[k].pezzi.push(p);});});
  Object.keys(tot).forEach(function(k){const t=tot[k];
    t.pezzi.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    out.push(['Consumo totale','',t.nome,t.cf,t.pezzi.join(' '),
      csvNum(t.q,(t.unita==='pz')?0:3),t.unita||'',csvPct(t.q,t.nome,t.unita),'','','','',''+t.n+' movimenti','']);});
  // altre voci
  (STATE.voci||[]).filter(v=>v.Commessa===comm)
    .sort((a,b)=>String(b.Data).localeCompare(String(a.Data)))
    .forEach(v=>out.push(['Altra voce',String(v.Data||'').slice(0,10),v.Descrizione||'',v.Categoria||'','',
      csvNum(v.Quantita,3),v.Unita||'','',csvNum(v.Importo,2),v.Fornitore||'',v.NrFattura||'',v.Stato||'',v.Note||'','']));
  // dettaglio movimenti
  movs.slice().sort((a,b)=>String(b.Data).localeCompare(String(a.Data))).forEach(function(m){
    out.push(['Movimento',String(m.Data||'').slice(0,16),m.NomeArticolo||'',cfDi(m),m.PezzoID||'',
      csvNum(m.Quantita,(m.UnitaMisura==='pz')?0:3),m.UnitaMisura||'',
      csvPct(+m.Quantita||0,m.NomeArticolo,m.UnitaMisura),'',m.Fornitore||'','','',m.Note||'',m.Utente||'']);});
  // manodopera e trasferte
  oreDiCommessa(comm).slice().sort((a,b)=>String(b.Data).localeCompare(String(a.Data))).forEach(function(r){
    out.push(['Manodopera',dataIt(r.Data),r.Persona||'',tipoOraLabel(r.Tipo),'',
      csvNum(r.Ore,2),'ore','',csvNum((+r.Costo||0)+(+r.Rimborso||0),2),'','','',
      (r.Descrizione||'')+(r.Destinazione?(' - '+r.Destinazione):'')+((+r.Km)?(' - '+nOre(r.Km)+' km'):'')+(r.Note?(' - '+r.Note):''),
      r.InseritoDa||'']);});
  // rettifiche
  (STATE.rettifiche||[]).filter(r=>r.Commessa===comm)
    .forEach(r=>out.push(['Rettifica manuale','',r.Voce||'','','','','','','','','','',(r.Valore||'')+' '+(r.Note||''),'']));
  scaricaCsv('commessa_'+String(comm).replace(/[^A-Za-z0-9._-]/g,'-')+'.csv',out);
}

function buildReportScarico(anno,mese){
  const pref=mese?(anno+'-'+mese):anno;
  const scar=STATE.movimenti.filter(m=>m.Annullato!=='SI'&&m.Tipo==='scarico'&&String(m.Data).startsWith(pref));
  // Raggruppa per commessa > mese > materiale, accumulando quantita e codici pezzo
  const byC={};
  scar.forEach(m=>{
    const c=m.Commessa||'(senza commessa)';
    const ms=String(m.Data).slice(5,7);
    let art=(STATE.articoli||[]).find(a=>a.ID===m.ArticoloID);
    if(!art)art=(STATE.articoli||[]).find(a=>a.Nome===m.NomeArticolo||a.Nome===m.ArticoloID);
    const cf=(art&&art.CodiceFornitore)||'';
    const k=m.NomeArticolo+'|'+m.UnitaMisura+'|'+cf;
    byC[c]=byC[c]||{}; byC[c][ms]=byC[c][ms]||{};
    byC[c][ms][k]=byC[c][ms][k]||{q:0,pezzi:[],artCode:(art&&/^ART-/.test(art.ID))?art.ID:''};
    byC[c][ms][k].q+=(+m.Quantita||0);
    if(m.PezzoID)String(m.PezzoID).split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{if(byC[c][ms][k].pezzi.indexOf(p)<0)byC[c][ms][k].pezzi.push(p);});
  });
  // Altre voci dello stesso periodo, raggruppate per commessa
  const byV={};
  (STATE.voci||[]).filter(v=>String(v.Data||'').startsWith(pref)).forEach(function(v){
    const c=v.Commessa||'(senza commessa)';
    (byV[c]=byV[c]||[]).push(v);
  });
  // Ore dello stesso periodo, raggruppate per commessa
  const byO={};
  (STATE.ore||[]).filter(r=>String(r.Data||'').startsWith(pref)).forEach(function(r){
    const c=r.Commessa||'(senza commessa)';
    (byO[c]=byO[c]||[]).push(r);
  });
  // una sezione per commessa: materiali + altre voci + manodopera, in dettaglio
  const comm={};Object.keys(byC).forEach(c=>comm[c]=1);Object.keys(byV).forEach(c=>comm[c]=1);Object.keys(byO).forEach(c=>comm[c]=1);
  let totGen=0,totOreGen=0,totCostoGen=0;
  const body=Object.keys(comm).sort().map(function(c){
    let out='<h3 style="font-size:14px;margin:16px 0 6px">Commessa '+c+'</h3>';
    if(byC[c]){
      let rows='';
      Object.keys(byC[c]).sort().reverse().forEach(ms=>{
        Object.keys(byC[c][ms]).forEach(k=>{
          const p=k.split('|'); const cell=byC[c][ms][k];
          const pezzi=cell.pezzi.length?cell.pezzi.join(', '):(cell.artCode||'-');
          rows+='<tr><td>'+ms+'/'+anno+'</td><td>'+p[0]+'</td><td align="center">'+(p[2]||'-')+'</td><td style="font-size:11px">'+pezzi+'</td><td align="right">'+cell.q.toFixed(3)+' '+p[1]+'</td><td align="center">'+pctUsoTxt(cell.q,p[0],p[1])+'</td></tr>';
        });
      });
      out+='<table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Mese</th><th align="left">Materiale</th><th align="center">Cod. forn.</th><th align="left">Codici pezzo</th><th align="right">Quantita</th><th align="center">% del caricato</th></tr></thead><tbody>'+rows+'</tbody></table>';
    } else {
      out+='<div style="font-size:12px;color:#888;margin-bottom:6px">Nessun materiale scaricato nel periodo.</div>';
    }
    if(byV[c]){
      const vv=byV[c].slice().sort((a,b)=>String(a.Categoria).localeCompare(String(b.Categoria))||String(b.Data).localeCompare(String(a.Data)));
      let catPrec=null,tot=0,rr='';
      vv.forEach(function(v){
        tot+=(+v.Importo||0);
        if(v.Categoria!==catPrec){catPrec=v.Categoria;rr+='<tr><td colspan="6" style="background:#f7f3ec;font-weight:bold;padding:4px 6px">'+catPrec+'</td></tr>';}
        const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'-';
        rr+='<tr><td>'+String(v.Data||'').slice(0,10)+'</td><td>'+v.Descrizione+(v.Note?('<div style="font-size:10.5px;color:#777">'+v.Note+'</div>'):'')+'</td><td>'+(v.Fornitore||'-')+'</td><td align="center">'+q+'</td><td align="center" style="font-size:11px">'+(v.NrFattura||'-')+'</td><td align="right">'+(v.Importo!=null&&v.Importo!==""?('&euro; '+euro(v.Importo)):'-')+'</td></tr>';
      });
      totGen+=tot;
      rr+='<tr style="background:#efefef"><td colspan="5" align="right" style="font-weight:bold">Totale altre voci commessa</td><td align="right" style="font-weight:bold">&euro; '+euro(tot)+'</td></tr>';
      out+='<div style="font-size:12.5px;font-weight:bold;margin:10px 0 4px">Altre voci</div>'
        +'<table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr style="background:#f0e9e0"><th align="left">Data</th><th align="left">Voce</th><th align="left">Fornitore</th><th align="center">Q.ta</th><th align="center">N. ft.</th><th align="right">Importo</th></tr></thead><tbody>'+rr+'</tbody></table>';
    }
    if(byO[c]){
      const oo=byO[c].slice().sort((a,b)=>String(b.Data).localeCompare(String(a.Data)));
      const to=oreTot(oo);
      const rr2=oo.map(function(r){
        return '<tr><td>'+dataIt(r.Data)+'</td><td>'+(r.Persona||'')+'</td><td>'+tipoOraLabel(r.Tipo)+'</td>'
         +'<td>'+(r.Descrizione||'')+(r.Destinazione?(' <span style="color:#777">('+r.Destinazione+')</span>'):'')+'</td>'
         +'<td align="right">'+nOre(r.Ore)+'</td><td align="right">'+((+r.Km)?nOre(r.Km):'-')+'</td>'
         +'<td align="right">&euro; '+euro((+r.Costo||0)+(+r.Rimborso||0))+'</td></tr>';}).join('');
      out+='<div style="font-size:12.5px;font-weight:bold;margin:10px 0 4px">Manodopera e trasferte</div>'
       +'<table border="1" cellpadding="5" style="border-collapse:collapse;width:100%;font-size:12px"><thead>'
       +'<tr style="background:#f0e9e0"><th align="left">Data</th><th align="left">Persona</th><th align="left">Tipo</th>'
       +'<th align="left">Descrizione</th><th align="right">Ore</th><th align="right">Km</th><th align="right">Costo</th></tr></thead><tbody>'
       +rr2
       +'<tr style="background:#efefef;font-weight:bold"><td colspan="4" align="right">Totale manodopera commessa</td>'
       +'<td align="right">'+nOre(to.ore)+'</td><td align="right">'+(to.km?nOre(to.km):'-')+'</td>'
       +'<td align="right">&euro; '+euro(to.tot)+'</td></tr></tbody></table>';
      totOreGen+=to.ore; totCostoGen+=to.tot;
    }
    return out;
  }).join("")||'<p style="color:#888">Nessun movimento nel periodo.</p>';
  let chiusura='';
  if(totGen||totOreGen){
    chiusura='<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px;margin-top:18px"><tbody>';
    if(totGen)chiusura+='<tr><td align="right">Totale altre voci di tutte le commesse</td><td align="right" style="font-weight:bold;width:170px">&euro; '+euro(totGen)+'</td></tr>';
    if(totOreGen)chiusura+='<tr><td align="right">Totale manodopera e trasferte ('+nOre(totOreGen)+' h)</td><td align="right" style="font-weight:bold">&euro; '+euro(totCostoGen)+'</td></tr>';
    chiusura+='<tr style="background:#efefef"><td align="right" style="font-weight:bold">Totale del periodo</td><td align="right" style="font-weight:bold">&euro; '+euro(totGen+totCostoGen)+'</td></tr>';
    chiusura+='</tbody></table>';
  }
  return '<div style="font-family:Georgia,serif;color:#3a342d">'+pdfHead('Movimenti e voci '+(mese?(mese+'/'+anno):anno)+' per commessa',new Date().toLocaleDateString('it-IT'))+body+chiusura+'</div>';
}
