function qrImg(id){const t=(APP_URL||"")+"?qr="+encodeURIComponent(id);return "https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=6&data="+encodeURIComponent(t);}
function qrItems(){
  const items=[];
  STATE.articoli.filter(a=>a.Categoria!=='Pannelli'&&a.Categoria!=='Massello'&&a.IsPannello!=='SI').forEach(a=>items.push({id:a.ID,n:a.Nome,t:"Articolo",d:"",f:a.Fornitore||"",cf:a.CodiceFornitore||"",img:imgUrlFor(a.ID)}));
  STATE.pannelli.forEach(p=>{const at=STATE.articoli.find(a=>a.ID===p.ArticoloID)||{};items.push({id:p.ID,n:at.Nome||p.ArticoloID,t:"Pannello",d:String(p.DataCarico||""),f:p.Fornitore||at.Fornitore||"",cf:at.CodiceFornitore||"",img:imgUrlFor(p.ArticoloID)});});
  STATE.massicci.forEach(p=>{const at=STATE.articoli.find(a=>a.ID===p.ArticoloID)||{};items.push({id:p.ID,n:at.Nome||p.ArticoloID,t:"Massiccio",d:String(p.DataCarico||""),f:p.Fornitore||at.Fornitore||"",cf:at.CodiceFornitore||"",img:imgUrlFor(p.ArticoloID)});});
  items.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  return items;
}
function renderQR(){
  return '<div class="qr-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><h1 class="page-title" style="margin:0">QR Code</h1><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="stampaQR(true)">Stampa selezionati</button><button class="btn btn-accent" onclick="stampaQR(false)">Stampa tutti</button></div></div>'
  +(!APP_URL?'<div class="alert alert-amber">URL app non disponibile: verifica che getWebAppUrl sia presente in Code.gs.</div>':'')
  +'<div class="filters"><input id="qr-search" placeholder="Cerca per codice, nome o tipo..." oninput="qrFilter()"></div>'
  +'<div class="qr-grid" id="qr-grid">'+qrGridHTML("")+'</div>';
}
function qrGridHTML(filtro){
  let items=qrItems();
  if(filtro){const q=filtro.toLowerCase();items=items.filter(it=>(it.id+" "+it.n+" "+it.t).toLowerCase().indexOf(q)>=0);}
  return items.map(it=>'<div class="qr-card" style="position:relative"><input type="checkbox" '+(QRSEL[it.id]?'checked':'')+' onclick="qrToggle(event,\''+esc(it.id)+'\')" style="position:absolute;top:8px;left:8px;width:18px;height:18px;accent-color:var(--accent)"><img src="'+qrImg(it.id)+'" loading="lazy"><div class="qr-id">'+it.id+'</div><div style="font-size:11.5px;color:var(--gray)">'+it.n+'</div><div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px">'+it.t+(it.d?(' - '+it.d.slice(0,10)):'')+'</div></div>').join("")||'<div style="color:var(--gray)">Nessun elemento.</div>';
}
function qrFilter(){document.getElementById("qr-grid").innerHTML=qrGridHTML(document.getElementById("qr-search").value);}
function qrToggle(ev,id){ev.stopPropagation();if(QRSEL[id])delete QRSEL[id];else QRSEL[id]=true;}
function stampaQR(soloSel){
  let ids;
  if(soloSel){ids=Object.keys(QRSEL);if(!ids.length){toast("Seleziona almeno un QR","err");return;}}
  else ids=qrItems().map(i=>i.id);
  const map={};qrItems().forEach(i=>map[i.id]=i);
  const cells=ids.map(id=>{const it=map[id];if(!it)return "";return '<div style="display:inline-block;width:31%;text-align:center;border:1px solid #000;padding:8px;margin:3px;vertical-align:top;box-sizing:border-box">'+(it.img?'<img src="'+it.img+'" referrerpolicy="no-referrer" style="width:70px;height:70px;object-fit:cover;border-radius:6px;margin-bottom:4px"><br>':'')+'<img src="'+qrImg(id)+'" width="110" height="110"><div style="font-family:monospace;font-size:11px;font-weight:bold;margin-top:4px">'+id+'</div><div style="font-size:11px">'+it.n+'</div>'+(it.f?'<div style="font-size:10px;color:#666">'+it.f+(it.cf?(' - '+it.cf):'')+'</div>':'')+'</div>';}).join("");
  stampaHTML('<div>'+cells+'</div>');
}

function statCommessa(cId){
  // Materiali destinati a questa commessa
  const ris=(STATE.riserve||[]).filter(r=>r.Commessa===cId&&r.Quantita>0).length;
  const pan=STATE.pannelli.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(cId)>=0).length;
  const mas=STATE.massicci.filter(p=>String(p.Commesse||'').split(',').map(s=>s.trim()).indexOf(cId)>=0).length;

// ---- dove compare un codice commessa, per l'anteprima del cambio ----
function usiCommessa(c){
  const lista=s=>String(s||'').split(',').map(x=>x.trim());
  return [
    ['movimenti',(STATE.movimenti||[]).filter(m=>m.Commessa===c).length],
    ['pannelli assegnati',(STATE.pannelli||[]).filter(p=>lista(p.Commesse).indexOf(c)>=0).length],
    ['massicci assegnati',(STATE.massicci||[]).filter(p=>lista(p.Commesse).indexOf(c)>=0).length],
    ['altre voci',(STATE.voci||[]).filter(v=>v.Commessa===c).length],
    ['registrazioni di ore',(STATE.ore||[]).filter(o=>o.Commessa===c).length],
    ['righe di Crea ordine',(STATE.fabbisogni||[]).filter(f=>f.Commessa===c).length],
    ['ordini',(STATE.ordini||[]).filter(o=>o.Commessa===c).length],
    ['articoli riservati',(STATE.riserve||[]).filter(r=>r.Commessa===c).length]
  ].filter(x=>x[1]>0);
}

function ccCheck(){
  const el=document.getElementById('cc-new'); if(!el)return;
  const n=el.value.trim();
  const box=document.getElementById('cc-avviso'); if(!box)return;
  const esiste=(STATE.commesse||[]).filter(x=>x.ID===n)[0];
  if(esiste&&n!==CC_ORIG){
    box.innerHTML='<div class="alert alert-amber" style="margin-bottom:10px">Il codice <strong>'+att(n)+'</strong> esiste già ('
      +att(esiste.Nome||'')+'). Se vai avanti, le due commesse diventano una sola: tutto lo storico finisce sotto '+att(n)+'.'
      +'<label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer"><input type="checkbox" id="cc-unisci" style="width:17px;height:17px;accent-color:var(--accent)"> Ho capito, unisci le due commesse</label></div>';
  } else box.innerHTML='';
}
let CC_ORIG='';
function submitCambiaCodice(id){
  const n=document.getElementById('cc-new').value.trim();
  const nome=document.getElementById('cc-nome').value.trim();
  if(!n){showErr('cc-err','Scrivi il codice nuovo.');return;}
  if(n===id&&nome===((STATE.commesse||[]).filter(x=>x.ID===id)[0]||{}).Nome){showErr('cc-err','Non hai cambiato niente.');return;}
  const chk=document.getElementById('cc-unisci');
  const esiste=(STATE.commesse||[]).filter(x=>x.ID===n)[0];
  if(esiste&&n!==id&&(!chk||!chk.checked)){showErr('cc-err','Spunta la casella per confermare l\'unione.');return;}
  if(n===id){ // cambia solo il nome
    call('salvaCommessa',{ID:id,Nome:nome||id,Cliente:(esiste||{}).Cliente||'',Stato:(esiste||{}).Stato||'aperta',Note:(esiste||{}).Note||''})
      .then(function(r){ if(!r.ok){showErr('cc-err',r.err||'Errore');return;}
        call('getCommesse').then(function(c){STATE.commesse=c||[];closeModal();toast('Commessa aggiornata');renderPage(STATE.pagina);});});
    return;
  }
  showErr('cc-err','Sto spostando lo storico, non chiudere la pagina...');
  call('cambiaCodiceCommessa',{vecchio:id,nuovo:n,nome:nome||n,unisci:!!(chk&&chk.checked)}).then(function(r){
    if(!r||!r.ok){showErr('cc-err',(r&&r.err)||'Errore');return;}
    const dett=Object.keys(r.risultato||{}).map(k=>r.risultato[k]+' '+k).join(', ');
    closeModal();
    toast(r.unito?('Commesse unite sotto '+n):('Codice cambiato in '+n)+(dett?(' - spostati: '+dett):''));
    refreshApp();
  }).catch(e=>showErr('cc-err',String((e&&e.message)||e)));
}

function cbParse(){
  const t=(document.getElementById('cb-txt')||{}).value||'';

const TIPI_ORE=[
  ['lavoro','Lavoro in commessa','var(--green)',true,false],

  ['interno','Lavoro interno (magazzino, officina)','var(--amber)',false,false],

  ['assenza','Assenza','var(--gray)',false,false]
];

function oreProduttive(t){return t==='lavoro'||t==='viaggio';}

function personaMia(){
  const em=String((STATE.utente||{}).Email||'').trim().toLowerCase();

}
function nOre(v){return Number(v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});}
function oggiISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function primoDelMese(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
function lunediDi(iso){const d=iso?new Date(iso+'T12:00:00'):new Date();const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function piuGiorni(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dataIt(iso){const t=String(iso||'').slice(0,10);return t.length===10?(t.slice(8,10)+'/'+t.slice(5,7)+'/'+t.slice(0,4)):t;}
const GIORNI_S=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

let ORE_TAB='registra', ORE_PERS='', ORE_COMM='', ORE_DA='', ORE_A='';

function oreFiltrate(o){
  o=o||{};
  const da=o.da||'',a=o.a||'';
  return (STATE.ore||[]).filter(function(r){
    const d=String(r.Data||'').slice(0,10);
    if(da&&d<da)return false;
    if(a&&d>a)return false;
    if(o.persona&&r.PersonaID!==o.persona)return false;
    if(o.commessa&&r.Commessa!==o.commessa)return false;
    if(o.tipo&&r.Tipo!==o.tipo)return false;
    return true;
  }).sort((x,y)=>String(y.Data).localeCompare(String(x.Data)));
}
function oreTot(list){
  const t={n:list.length,ore:0,lavoro:0,viaggio:0,interno:0,assenza:0,km:0,costo:0,rimborso:0};
  const gg={};
  (list||[]).forEach(function(r){
    const h=+r.Ore||0;t.ore+=h;
    if(r.Tipo==='lavoro')t.lavoro+=h;
    else if(r.Tipo==='viaggio')t.viaggio+=h;
    else if(r.Tipo==='interno')t.interno+=h;
    else t.assenza+=h;
    t.km+=(+r.Km||0);t.costo+=(+r.Costo||0);t.rimborso+=(+r.Rimborso||0);
    gg[String(r.Data||'').slice(0,10)]=1;
  });
  t.nGiorni=Object.keys(gg).length;
  t.produttive=t.lavoro+t.viaggio;
  t.tot=t.costo+t.rimborso;
  return t;
}
// usate anche dai report
function oreDiCommessa(comm){return (STATE.ore||[]).filter(r=>r.Commessa===comm);}
function oreDiCommessaPeriodo(comm,pref){return (STATE.ore||[]).filter(r=>r.Commessa===comm&&(!pref||String(r.Data||'').indexOf(pref)===0));}

  h+=box('Chilometri',nOre(t.km)+' km',t.rimborso?('&euro; '+euro(t.rimborso)+' di rimborso'):'nessun rimborso');

    h+=box('Costo manodopera','&euro; '+euro(t.costo),'ore per costo orario');
    h+=box('Totale con rimborsi','&euro; '+euro(t.tot),'manodopera + chilometri');

function tabellaPerChiave(list,chiaveFn,etichetta,admin,totProd){
  const g={};
  list.forEach(function(r){const k=chiaveFn(r)||'(non indicata)';(g[k]=g[k]||[]).push(r);});
  const keys=Object.keys(g).sort();
  if(!keys.length)return '';
  let h='<div class="card" style="margin-bottom:14px"><div class="card-title">'+etichetta+'</div>'
   +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
   +'<thead><tr style="text-align:left;color:var(--gray);font-size:11.5px;text-transform:uppercase">'
   +'<th style="padding:6px 4px">'+etichetta.split(' ')[0]+'</th><th style="text-align:right">Ore</th><th style="text-align:right">%</th>'
   +'<th style="text-align:right">Km</th>'+(admin?'<th style="text-align:right">Costo</th>':'')+'</tr></thead><tbody>';
  keys.forEach(function(k){
    const t=oreTot(g[k]);
    const pct=totProd>0?Math.round(t.ore/totProd*1000)/10:0;
    h+='<tr style="border-top:1px solid var(--border)"><td style="padding:7px 4px">'+k+'</td>'
     +'<td style="text-align:right;font-weight:600">'+nOre(t.ore)+'</td>'
     +'<td style="text-align:right;color:var(--gray)">'+(totProd>0?(nOre(pct)+'%'):'-')+'</td>'
     +'<td style="text-align:right;color:var(--gray)">'+(t.km?nOre(t.km):'-')+'</td>'
     +(admin?('<td style="text-align:right">&euro; '+euro(t.tot)+'</td>'):'')+'</tr>';
  });
  const tt=oreTot(list);
  h+='<tr style="border-top:2px solid var(--border);font-weight:700"><td style="padding:7px 4px">Totale</td>'
   +'<td style="text-align:right">'+nOre(tt.ore)+'</td><td></td>'
   +'<td style="text-align:right">'+(tt.km?nOre(tt.km):'-')+'</td>'
   +(admin?('<td style="text-align:right">&euro; '+euro(tt.tot)+'</td>'):'')+'</tr>';
  return h+'</tbody></table></div></div>';
}

function submitOra(id){
  const tipo=gv('no-tipo');
  const d={ID:id||'',Data:gv('no-data'),PersonaID:gv('no-pers'),Tipo:tipo,
    Commessa:tipoOraCommessa(tipo)?gv('no-comm'):'',
    Ore:gv('no-ore'),Km:tipoOraViaggio(tipo)?gv('no-km'):0,
    Destinazione:tipoOraViaggio(tipo)?gv('no-dest').trim():'',
    Descrizione:gv('no-desc').trim(),Note:gv('no-note').trim()};
  if(!d.Data){showErr('no-err','Metti la data.');return;}
  if(!d.PersonaID){showErr('no-err','Scegli la persona.');return;}
  if(tipoOraCommessa(tipo)&&!d.Commessa){showErr('no-err','Per "'+tipoOraLabel(tipo)+'" serve la commessa: è quella che riceve il costo.');return;}
  const h=parseFloat(d.Ore)||0,km=parseFloat(d.Km)||0;
  if(h<=0&&km<=0){showErr('no-err','Metti almeno le ore.');return;}
  if(h>24){showErr('no-err','Più di 24 ore in un giorno: controlla il numero.');return;}
  if(id){const v=(STATE.ore||[]).filter(x=>x.ID===id)[0];
    if(v&&v.PersonaID===d.PersonaID){d.CostoOrario=v.CostoOrario;d.EuroKm=v.EuroKm;}}
  call('salvaOra',d).then(function(r){
    if(!r||!r.ok){showErr('no-err',(r&&r.err)||'Errore');return;}
    call('getOre').then(function(o){STATE.ore=o||[];closeModal();toast(id?'Registrazione aggiornata':'Ore registrate');renderPage(STATE.pagina);});
  }).catch(e=>showErr('no-err',String((e&&e.message)||e)));
}
function confEliminaOra(id){
  const r=(STATE.ore||[]).filter(x=>x.ID===id)[0]||{};
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Elimina registrazione</h2>'
   +'<div class="alert alert-red">Elimino <strong>'+nOre(r.Ore)+' h</strong> di '+(r.Persona||'')+' del '+dataIt(r.Data)+(r.Commessa?(' sulla commessa '+r.Commessa):'')+'? Non e\' reversibile.</div>'
   +'<div id="eo-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitEliminaOra(\''+esc(id)+'\')">Elimina</button></div>');
}
function submitEliminaOra(id){
  call('eliminaOra',{id:id}).then(function(r){
    if(!r||!r.ok){showErr('eo-err','Errore');return;}
    call('getOre').then(function(o){STATE.ore=o||[];closeModal();toast('Registrazione eliminata');renderPage(STATE.pagina);});

}

function openFoglioSettimana(persId,lun){

   +'<div class="form-row"><div class="form-group"><label>Persona *</label><select id="fs-pers" onchange="fsRicarica()">'+optP+'</select></div>'
   +'<div class="form-group"><label>Settimana dal (lunedi) *</label><input type="date" id="fs-lun" value="'+att(l)+'" onchange="fsRicarica()"></div></div>'
   +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
   +'<thead><tr><th style="text-align:left;padding:4px;font-size:11px;color:var(--gray);min-width:150px">Commessa</th>'
   +'<th style="text-align:left;padding:4px;font-size:11px;color:var(--gray);min-width:120px">Tipo</th>'+th
   +'<th style="width:34px"></th></tr></thead><tbody id="fs-body"></tbody></table></div>'
   +'<button class="btn btn-ghost" style="margin-top:10px" onclick="fsAddRiga()">+ Aggiungi riga</button>'
   +'<div id="fs-err" style="margin-top:8px"></div>'
   +'<button class="btn-primary" onclick="fsSalva()">Salva la settimana</button></div>');
  fsAddRiga();
}
function fsRicarica(){openFoglioSettimana(gv('fs-pers'),gv('fs-lun'));}
function fsAddRiga(){
  const n=++FS_N;
  const optC='<option value="">- commessa -</option>'+(STATE.commesse||[]).slice().sort((a,b)=>String(b.ID).localeCompare(String(a.ID)))
    .map(c=>'<option value="'+att(c.ID)+'">'+c.ID+(c.Nome&&c.Nome!==c.ID?(' - '+c.Nome):'')+'</option>').join('');
  const optT=TIPI_ORE.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('');
  let celle='';
  for(let i=0;i<7;i++){
    celle+='<td style="padding:2px;text-align:center">'
     +'<input class="fs-h" type="number" step="0.25" min="0" style="width:56px;padding:5px;text-align:center" placeholder="h">'
     +'<input class="fs-km" type="number" step="any" min="0" style="width:56px;padding:5px;text-align:center;margin-top:3px;display:none" placeholder="km">'
     +'</td>';
  }
  const tr='<tr class="fs-riga" id="fs-r'+n+'" style="border-top:1px solid var(--border)">'
   +'<td style="padding:3px"><select class="fs-comm" style="width:100%;padding:5px">'+optC+'</select>'
   +'<input class="fs-desc" style="width:100%;padding:5px;margin-top:3px;font-size:11.5px" placeholder="cosa hai fatto"></td>'
   +'<td style="padding:3px"><select class="fs-tipo" style="width:100%;padding:5px" onchange="fsTipo(this)">'+optT+'</select>'
   +'<input class="fs-dest" style="width:100%;padding:5px;margin-top:3px;font-size:11.5px;display:none" placeholder="destinazione"></td>'
   +celle
   +'<td style="text-align:center"><span style="color:var(--red);cursor:pointer;font-size:18px" onclick="fsDelRiga('+n+')">&times;</span></td></tr>';
  document.getElementById('fs-body').insertAdjacentHTML('beforeend',tr);
}
function fsDelRiga(n){const tr=document.getElementById('fs-r'+n);if(tr)tr.parentNode.removeChild(tr);}
function fsTipo(sel){
  const tr=sel.closest('tr');
  const v=tipoOraViaggio(sel.value);
  Array.prototype.forEach.call(tr.querySelectorAll('.fs-km'),el=>{el.style.display=v?'':'none';});
  const d=tr.querySelector('.fs-dest'); if(d)d.style.display=v?'':'none';
  const c=tr.querySelector('.fs-comm'); if(c)c.style.opacity=tipoOraCommessa(sel.value)?'1':'.4';
}
function fsSalva(){
  const pers=gv('fs-pers'),lun=gv('fs-lun');
  if(!pers){showErr('fs-err','Scegli la persona.');return;}
  if(!lun){showErr('fs-err','Scegli la settimana.');return;}
  const righe=[];let manca=false;
  Array.prototype.forEach.call(document.querySelectorAll('#fs-body tr.fs-riga'),function(tr){
    const tipo=tr.querySelector('.fs-tipo').value;
    const comm=tr.querySelector('.fs-comm').value;
    const desc=tr.querySelector('.fs-desc').value.trim();
    const destEl=tr.querySelector('.fs-dest');
    const dest=destEl?destEl.value.trim():'';
    const hs=tr.querySelectorAll('.fs-h'),ks=tr.querySelectorAll('.fs-km');
    for(let i=0;i<7;i++){
      const h=parseFloat(hs[i].value)||0;
      const km=tipoOraViaggio(tipo)?(parseFloat(ks[i].value)||0):0;
      if(h<=0&&km<=0)continue;
      if(tipoOraCommessa(tipo)&&!comm){manca=true;continue;}
      righe.push({Data:piuGiorni(lun,i),PersonaID:pers,Tipo:tipo,
        Commessa:tipoOraCommessa(tipo)?comm:'',Ore:h,Km:km,Destinazione:dest,Descrizione:desc});
    }
  });
  if(manca){showErr('fs-err','C\'è una riga con le ore compilate ma senza commessa.');return;}
  if(!righe.length){showErr('fs-err','Non hai compilato nessuna casella.');return;}
  call('salvaOreBulk',{righe:righe}).then(function(r){
    if(!r||!r.ok){showErr('fs-err',(r&&r.err)||'Errore');return;}
    call('getOre').then(function(o){STATE.ore=o||[];closeModal();toast(r.n+' registrazioni salvate');renderPage(STATE.pagina);});
  }).catch(e=>showErr('fs-err',String((e&&e.message)||e)));
}

function copiaTesto(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast("Indirizzo copiato");},function(){copiaTestoVecchio(t);});
    } else copiaTestoVecchio(t);
  }catch(e){copiaTestoVecchio(t);}
}
function copiaTestoVecchio(t){
  try{
    const a=document.createElement("textarea");
    a.value=t;a.style.position="fixed";a.style.opacity="0";
    document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);
    toast("Indirizzo copiato");
  }catch(e){toast("Copia a mano l'indirizzo","err");}
}

// ---- l'IA che legge la dettatura ----
// Gira su Supabase (funzione "capisci-dettatura"), che tiene la chiave al sicuro.
// Se la funzione non c'e' o non risponde, l'app usa il riconoscimento locale:
// meno bravo, ma non lascia mai a piedi chi sta dettando.
// Due posti dove puo' stare la funzione che parla con l'IA:
// 1) su Netlify, dentro il sito stesso (nessuna chiave da gestire)
// 2) su Supabase (serve una chiave tua)
// L'app le prova in quest'ordine e si ricorda quale ha funzionato.
const VOC_AI_URLS = ["/.netlify/functions/capisci-dettatura", SB_URL + "/functions/v1/capisci-dettatura"];
let VOC_AI_URL = "", VOC_AI_ATTIVA = true, VOC_AI_MOTIVO = '';
function vocCatalogo(){
  let mats=[];
  try{ mats=nomiMateriali('pannello').map(n=>({nome:n,tipo:'pannello'}))
        .concat(nomiMateriali('massiccio').map(n=>({nome:n,tipo:'massiccio'}))); }catch(e){}
  return {
    articoli:(STATE.articoli||[]).map(a=>({id:a.ID,nome:a.Nome,unita:a.UnitaMisura||'pz'})),
    materiali:mats,
    commesse:(STATE.commesse||[]).filter(c=>String(c.Stato||'aperta').toLowerCase()!=='chiusa')
      .map(c=>({id:c.ID,nome:c.Nome||c.ID})),
    persone:(STATE.personale||[]).filter(p=>p.Attivo).map(p=>({id:p.ID,nome:p.Nome})),
    categorie:categorieVoci()
  };
}
function vocDaIA(riga){
  // porto la risposta dell'IA nella stessa forma del riconoscimento locale
  const nomeArt=function(id){const a=(STATE.articoli||[]).filter(x=>x.ID===id)[0];return a?a.Nome:'';};
  const r={Testo:'',Tipo:riga.tipo||'materiale',Stato:'da_confermare',
    ArticoloID:riga.articolo_id||'',Articolo:riga.articolo_id?nomeArt(riga.articolo_id):(riga.materiale||''),
    PezzoID:riga.pezzo_id||'',
    Quantita:(riga.quantita===null||riga.quantita===undefined)?'':riga.quantita,
    Unita:riga.unita||'',Commessa:riga.commessa||'',PersonaID:riga.persona_id||'',
    Importo:(riga.importo===null||riga.importo===undefined)?'':riga.importo,
    Categoria:riga.categoria||'',Note:riga.note||'',
    Dubbi:[riga.dubbi||'',riga.domanda||''].filter(Boolean).join(' · '),
    Domanda:riga.domanda||'',
    scelteCommessa:riga.scelte_commessa||[],scelteMateriale:riga.scelte_materiale||[]};
  if(!r.Unita&&r.ArticoloID){const a=(STATE.articoli||[]).filter(x=>x.ID===r.ArticoloID)[0];if(a)r.Unita=a.UnitaMisura||'';}
  if(!r.ArticoloID&&r.Articolo){
    const p=(STATE.pannelli||[]).filter(x=>x.ArticoloID===r.Articolo)[0];
    const m=(STATE.massicci||[]).filter(x=>x.ArticoloID===r.Articolo)[0];
    if(p&&!r.Unita)r.Unita='m²';
    if(m&&!r.Unita)r.Unita='m³';
    if((p||m)&&!r.PezzoID&&r.Tipo==='materiale'&&!r.Dubbi)r.Dubbi='Scegli da quale pezzo esce il materiale';
  }
  return r;
}
function vocIAProva(url,corpo){
  return fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},
    body:corpo})
  .then(function(r){
    if(r.status===404)throw {nonCe:true};
    if(!r.ok)return r.json().catch(function(){return {};}).then(function(d){
      throw new Error((d&&d.errore)||('Il server ha risposto '+r.status));
    });
    return r.json();
  })
  .then(function(d){
    if(d&&d.errore)throw new Error(d.errore);
    if(!d||!Array.isArray(d.righe))throw new Error('Risposta non leggibile');
    return d;
  });
}
function vocIAChiedi(testo){
  const corpo=JSON.stringify({testo:testo,catalogo:vocCatalogo()});
  const lista=VOC_AI_URL?[VOC_AI_URL]:VOC_AI_URLS;
  let ultimo=null;
  return lista.reduce(function(cat,url){
    return cat.then(function(fatto){
      if(fatto)return fatto;
      return vocIAProva(url,corpo).then(function(d){VOC_AI_URL=url;return d;})
        .catch(function(e){ if(!e||!e.nonCe)ultimo=e; return null; });
    });
  },Promise.resolve(null)).then(function(d){
    if(d)return d.righe.map(vocDaIA);
    if(ultimo)throw ultimo;
    throw new Error('La funzione non risulta installata, ne su Netlify ne su Supabase');
  });
}

// ---- numeri detti a parole -> cifre ----
const VOC_DEC=[['venti',20],['trenta',30],['quaranta',40],['cinquanta',50],['sessanta',60],['settanta',70],['ottanta',80],['novanta',90]];
const VOC_UNI=[['uno',1],['due',2],['tre',3],['quattro',4],['cinque',5],['sei',6],['sette',7],['otto',8],['nove',9]];
const VOC_BASE={zero:0,un:1,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,
  dieci:10,undici:11,dodici:12,tredici:13,quattordici:14,quindici:15,sedici:16,
  diciassette:17,diciotto:18,diciannove:19,cento:100,mille:1000};
const VOC_NUM=(function(){
  const m={};
  Object.keys(VOC_BASE).forEach(k=>m[k]=VOC_BASE[k]);
  VOC_DEC.forEach(function(d){
    m[d[0]]=d[1];
    VOC_UNI.forEach(function(u){
      const tronco=(u[0]==='uno'||u[0]==='otto')?d[0].slice(0,-1):d[0];
      m[tronco+u[0]]=d[1]+u[1];
    });
  });
  // da 1 a 99 in parole: mi serve per costruire le centinaia
  const sotto=[];
  Object.keys(m).forEach(function(k){ if(m[k]>=1&&m[k]<=99)sotto.push([k,m[k]]); });
  // cento, centoventi, duecentocinquanta, cinquecento...
  const pref=[['',1]].concat(VOC_UNI.filter(u=>u[1]>=2).map(u=>[u[0],u[1]]));
  pref.forEach(function(p){
    const base=p[0]+'cento';
    m[base]=p[1]*100;
    sotto.forEach(function(sx){ m[base+sx[0]]=p[1]*100+sx[1]; });
  });
  return m;
})();

function vocNorm(t){
  let x=String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  x=x.replace(/(\d),(\d)/g,'$1.$2');
  x=x.replace(/[^a-z0-9.\s]/g,' ').replace(/\s+/g,' ').trim();
  // parola per parola: e' molto piu' veloce che una regex per ogni numero
  x=x.split(' ').map(function(w){ return (VOC_NUM[w]!==undefined)?String(VOC_NUM[w]):w; }).join(' ');
  x=x.replace(/(\d+(?:\.\d+)?)\s+(ore|ora|giornate|giornata|metri|metro|chili|chilo|litri|litro|kg)\s+e\s+mezz[oa]\b/g,
    function(_,n,u){return String(parseFloat(n)+0.5)+' '+u;});
  x=x.replace(/(\d+(?:\.\d+)?)\s+e\s+mezz[oa]\b/g,function(_,n){return String(parseFloat(n)+0.5);});
  x=x.replace(/\bmezz[oa]\b/g,'0.5');
  x=x.replace(/(\d+(?:\.\d+)?)\s+virgola\s+(\d+)/g,'$1.$2');
  x=x.replace(/(\d)\s*(?:per|x)\s*(\d)/g,'$1x$2');
  return x.replace(/\s+/g,' ').trim();
}
function vocTok(t){
  return vocNorm(t).replace(/(\d)x(\d)/g,'$1 $2')
    .split(/[^a-z0-9.]+/).filter(x=>x&&(x.length>1||/^[0-9]$/.test(x)))
    .map(x=>x.replace(/\.$/,''));
}
function vocLev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;
  if(!m||!n)return Math.max(m,n);
  let prec=[];for(let j=0;j<=n;j++)prec[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prec[j]+1,cur[j-1]+1,prec[j-1]+(a[i-1]===b[j-1]?0:1));
    prec=cur;
  }
  return prec[n];
}
function vocSimile(a,b){
  if(a===b)return true;
  const na=/^[0-9]/.test(a), nb=/^[0-9]/.test(b);
  if(na||nb)return na&&nb&&parseFloat(a)===parseFloat(b);
  const L=Math.min(a.length,b.length);
  if(L>=3&&(b.indexOf(a)===0||a.indexOf(b)===0))return true;   // nob -> nobilitato
  if(L<4)return false;
  if(a.slice(0,3)===b.slice(0,3)&&Math.abs(a.length-b.length)<=3)return true;
  return vocLev(a,b)<=(L>=7?2:1);
}
// quanto un nome di magazzino somiglia a quello che e' stato detto (0..1)
function vocScore(nome,tok){
  const ct=vocTok(nome); if(!ct.length||!tok.length)return 0;
  let hit=0,tot=0,alfa=false;
  ct.forEach(function(t){
    const num=/^[0-9]/.test(t), peso=num?2:1; tot+=peso;
    if(tok.some(x=>vocSimile(t,x))){hit+=peso;if(!num)alfa=true;}
  });
  if(!alfa)return 0;       // solo numeri uguali non basta
  return hit/tot;
}

// parole che non aiutano a capire di che materiale si parla
const VOC_STOP={sulla:1,sullo:1,sul:1,sui:1,sulle:1,della:1,dello:1,del:1,dei:1,delle:1,
  nella:1,nello:1,nel:1,nei:1,alla:1,allo:1,per:1,con:1,una:1,uno:1,dei:1,degli:1,
  commessa:1,commesse:1,cantiere:1,lavoro:1,
  abbiamo:1,avevamo:1,ho:1,hai:1,abbiam:1,usato:1,usati:1,usate:1,usata:1,
  utilizzato:1,utilizzati:1,utilizzate:1,utilizzata:1,messo:1,messi:1,preso:1,presi:1,
  fatto:1,fatti:1,oggi:1,ieri:1,poi:1,anche:1,sempre:1,circa:1,tutto:1,tutta:1,
  pezzi:1,pezzo:1,metri:1,metro:1,quadri:1,quadrati:1,quadro:1,cubi:1,cubo:1,
  chili:1,chilo:1,litri:1,litro:1,ore:1,ora:1,euro:1,che:1,sono:1,stati:1,state:1,
  serviti:1,servito:1,dentro:1,sopra:1,circa:1};
function vocParoleUtili(tok,escludi){
  return tok.filter(function(t){
    if(VOC_STOP[t])return false;
    if(/^[0-9]/.test(t))return false;
    if(t.length<3)return false;
    if(escludi&&escludi.some(x=>vocSimile(x,t)))return false;
    return true;
  });
}
// 0..1 : mescola "quanto del nome a magazzino ho ritrovato" con
// "quante delle parole dette ho spiegato". La seconda conta di piu':
// nessuno dice per intero "VITE TRUCIOLARE 4,5X30 TESTA SVASATA".
function vocScoreMisto(nome,tok,utili){
  const base=vocScore(nome,tok);
  if(base<=0)return 0;
  if(!utili||!utili.length)return base;
  const ct=vocTok(nome);
  let n=0; utili.forEach(function(w){ if(ct.some(x=>vocSimile(x,w)))n++; });
  return base*0.4+(n/utili.length)*0.6;
}

// ---- candidati ----
function vocCandidatiMateriale(tok,utili){
  const out=[],visti={};
  const push=function(tipo,id,nome,unita){
    const k=tipo+'|'+nome; if(visti[k])return;
    const sc=vocScoreMisto(nome,tok,utili); if(sc<=0)return;
    visti[k]=1; out.push({tipo:tipo,id:id,nome:nome,unita:unita,score:sc});
  };
  (STATE.articoli||[]).forEach(a=>push('articolo',a.ID,a.Nome,a.UnitaMisura||'pz'));
  try{ nomiMateriali('pannello').forEach(n=>push('pannello','',n,'m²')); }catch(e){}
  try{ nomiMateriali('massiccio').forEach(n=>push('massiccio','',n,'m³')); }catch(e){}
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}
function vocCandidatiCommessa(tok){
  const out=[];
  (STATE.commesse||[]).forEach(function(c){
    let sc=(c.Nome&&c.Nome!==c.ID)?vocScore(c.Nome,tok):0;
    const numId=String(c.ID).replace(/[^0-9]/g,'');
    if(numId.length>=4&&tok.some(x=>x.replace(/[^0-9]/g,'')===numId))sc=1;
    if(sc>0)out.push({id:c.ID,nome:c.Nome||c.ID,score:sc});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,6);
}
function vocCandidatiPersona(tok){
  const out=[];
  (STATE.personale||[]).forEach(function(p){
    const sc=vocScore(p.Nome,tok);
    if(sc>0)out.push({id:p.ID,nome:p.Nome,score:sc});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,5);
}
const VOC_UNITA=[[/\b(pezzi|pezzo|pz)\b/,'pz'],[/\b(metri quadr\w*|mq|m2)\b/,'m²'],
  [/\b(metri cubi|mc|m3)\b/,'m³'],[/\b(metri|metro|ml)\b/,'mt'],
  [/\b(litri|litro|lt)\b/,'litri'],[/\b(chili|chilo|kg)\b/,'kg']];

// ---- il cuore: da una frase a una proposta ----
function vocSpezza(testo){
  return String(testo||'').split(/[\n;]+|\s+e\s+poi\s+|\s+poi\s+/i)
    .map(x=>x.trim()).filter(x=>x.length>2);
}
function vocInterpretaTutto(testo){
  const out=[]; let ultima='';
  vocSpezza(testo).forEach(function(f){
    const r=vocInterpreta(f);
    if(!r.Commessa&&ultima){
      r.Commessa=ultima;
      r.Dubbi=String(r.Dubbi||'').replace('Nessuna commessa riconosciuta','Commessa presa dalla frase precedente').trim();
      if(!r.Dubbi)r.Dubbi='Commessa presa dalla frase precedente';
    }
    if(r.Commessa)ultima=r.Commessa;
    out.push(r);
  });
  return out;
}
function vocInterpreta(frase){
  const s=vocNorm(frase), tok=vocTok(frase);
  const r={Testo:String(frase).trim(),Tipo:'materiale',Stato:'da_confermare',
    ArticoloID:'',Articolo:'',PezzoID:'',Quantita:'',Unita:'',Commessa:'',
    PersonaID:'',Importo:'',Categoria:'',Note:'',Dubbi:'',
    altMateriali:[],altCommesse:[],altPersone:[]};
  const dubbi=[];

  // che genere di cosa e'
  if(/\b(ore|ora|giornata|giornate)\b/.test(s))r.Tipo='ore';
  if(/\b(fattura|trasporto|noleggio|nolo|pasti|pranzo|cena|albergo|verniciat\w*|euro)\b/.test(s))r.Tipo='voce';

  // commessa
  const cc=vocCandidatiCommessa(tok);
  r.altCommesse=cc;
  if(cc.length){
    r.Commessa=cc[0].id;
    if(cc.length>1&&cc[1].score>=cc[0].score-0.001)
      dubbi.push('Commessa incerta: '+cc.filter(x=>x.score>=cc[0].score-0.001).map(x=>x.id+' ('+x.nome+')').join(' oppure '));
  } else dubbi.push('Nessuna commessa riconosciuta');

  // codice pezzo detto per esteso (P1232, RM0003, ART-0042)
  const cod=s.match(/\b(art\s*-?\s*0*\d+|rm\s*0*\d+|r\s*0*\d+|p\s*0*\d+|m\s*0*\d+)\b/);
  if(cod){
    const pulito=cod[1].replace(/\s|-/g,'').toUpperCase();
    const p=(STATE.pannelli||[]).concat(STATE.massicci||[]).filter(x=>String(x.ID).toUpperCase()===pulito)[0];
    if(p){r.PezzoID=p.ID;r.Articolo=p.ArticoloID;r.Unita=(+p.M2_originale||p.M2_residuo!==undefined)?'m²':'m³';}
  }

  // numeri "consumati" dal materiale, per non scambiarli per la quantita'
  const numeri=tok.filter(x=>/^\d+(\.\d+)?$/.test(x));
  let usati=[];

  if(r.Tipo==='ore'){
    const m=s.match(/(\d+(?:\.\d+)?)\s*(?:ore|ora)\b/)||s.match(/(\d+(?:\.\d+)?)\s*giornat/);
    if(m){r.Quantita=parseFloat(m[1]);if(/giornat/.test(m[0]))r.Quantita=r.Quantita*8;}
    r.Unita='ore';
    if(/\b(viaggio|trasferta|cantiere)\b/.test(s))r.Note='viaggio/trasferta';
    const pp=vocCandidatiPersona(tok);
    r.altPersone=pp;
    if(pp.length&&pp[0].score>=0.5)r.PersonaID=pp[0].id;
    else{
      const mia=(typeof personaMia==='function')?personaMia():null;
      if(mia)r.PersonaID=mia.ID; else dubbi.push('Non so di chi sono le ore');
    }
    if(!r.Quantita)dubbi.push('Non ho capito quante ore');
  } else if(r.Tipo==='voce'){
    const m=s.match(/(\d+(?:\.\d+)?)\s*euro/);
    if(m)r.Importo=parseFloat(m[1]);
    else if(numeri.length)r.Importo=parseFloat(numeri[numeri.length-1]);
    if(/trasport/.test(s))r.Categoria='Trasporti';
    else if(/verniciat|conto lavor/.test(s))r.Categoria='Conto lavorazione';
    else if(/pasti|pranzo|cena|albergo/.test(s))r.Categoria='Pasti e trasferte';
    else if(/nolegg|nolo/.test(s))r.Categoria='Noleggi';
    else r.Categoria='Altro';
    r.Note=String(frase).trim();
    if(!r.Importo)dubbi.push('Non ho capito l\'importo');
  } else {
    if(!r.PezzoID){
      const utili=vocParoleUtili(tok,r.Commessa?vocTok(((STATE.commesse||[]).filter(c=>c.ID===r.Commessa)[0]||{}).Nome||''):null);
      const cm=vocCandidatiMateriale(tok,utili);
      r.altMateriali=cm;
      if(cm.length){
        const best=cm[0];
        r.Articolo=best.nome;
        if(best.tipo==='articolo')r.ArticoloID=best.id;
        r.Unita=best.unita;
        usati=vocTok(best.nome).filter(x=>/^\d+(\.\d+)?$/.test(x));
        if(best.score<0.45)dubbi.push('Materiale poco sicuro: controlla');
        if(cm.length>1&&cm[1].score>=best.score-0.03)dubbi.push('Più materiali possibili: '+cm.slice(0,3).map(x=>x.nome).join(' oppure '));
        if(best.tipo!=='articolo')dubbi.push('È un '+best.tipo+': scegli il pezzo da scaricare');
      } else dubbi.push('Materiale non riconosciuto');
    }
    const liberi=numeri.filter(n=>!usati.some(u=>parseFloat(u)===parseFloat(n)));
    if(liberi.length)r.Quantita=parseFloat(liberi[0]);
    else dubbi.push('Non ho capito la quantita');
    VOC_UNITA.forEach(function(u){if(!r.Unita&&u[0].test(s))r.Unita=u[1];});
    if(!r.Unita)r.Unita='pz';
  }
  r.Dubbi=dubbi.join(' · ');
  return r;
}

// ---- microfono ----
let VOC_REC=null,VOC_ON=false,VOC_FINALE='';
function vocMicSupportato(){
  try{ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }catch(e){ return false; }
}
function vocToggle(){ VOC_ON?vocStop():vocStart(); }
function vocStart(){
  if(!vocMicSupportato()){toast('Su questo telefono usa il microfono della tastiera','err');return;}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{
    VOC_REC=new R();
    VOC_REC.lang='it-IT';VOC_REC.continuous=true;VOC_REC.interimResults=true;VOC_REC.maxAlternatives=1;
    VOC_FINALE=(document.getElementById('vc-testo')||{}).value||'';
    VOC_REC.onresult=function(ev){
      let interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t=ev.results[i][0].transcript;
        if(ev.results[i].isFinal)VOC_FINALE=(VOC_FINALE+' '+t).replace(/\s+/g,' ').trim();
        else interim+=t;
      }
      const box=document.getElementById('vc-testo');
      if(box)box.value=(VOC_FINALE+(interim?(' '+interim):'')).trim();
      const live=document.getElementById('vc-live');
      if(live)live.textContent=interim?('...'+interim):'';
    };
    VOC_REC.onerror=function(ev){
      VOC_ON=false;vocPulsante();
      const m={'not-allowed':'Devi dare il permesso al microfono','no-speech':'Non ho sentito niente','audio-capture':'Microfono non disponibile','network':'Serve la connessione per la dettatura'};
      toast(m[ev.error]||('Microfono: '+ev.error),'err');
    };
    VOC_REC.onend=function(){ if(VOC_ON){ try{VOC_REC.start();}catch(e){VOC_ON=false;vocPulsante();} } };
    VOC_REC.start();
    VOC_ON=true;vocPulsante();
  }catch(e){ VOC_ON=false;vocPulsante();toast('Non riesco ad accendere il microfono','err'); }
}
function vocStop(){
  VOC_ON=false;
  try{ if(VOC_REC)VOC_REC.stop(); }catch(e){}
  vocPulsante();
  const live=document.getElementById('vc-live'); if(live)live.textContent='';
  vocAnalizzaIA();
}
function vocPulsante(){
  const b=document.getElementById('vc-mic'); if(!b)return;
  b.style.background=VOC_ON?'var(--red)':'var(--accent)';
  b.innerHTML=VOC_ON?'<span style="font-size:34px">&#9632;</span><div style="font-size:12px;margin-top:2px">tocca per fermare</div>'
                    :'<span style="font-size:34px">&#127908;</span><div style="font-size:12px;margin-top:2px">tocca e parla</div>';
  const s=document.getElementById('vc-stato');
  if(s)s.innerHTML=VOC_ON?'<span style="color:var(--red);font-weight:600">Sto ascoltando...</span>':'';
}

let VOC_TAB='detta', VOC_RIGHE=[], VOC_FONTE='', VOC_ATTESA=false;
function vocTab(t){VOC_TAB=t;if(VOC_ON)vocStop();renderPage('dettatura');}
function dettatureInAttesa(){return (STATE.dettature||[]).filter(d=>d.Stato==='da_confermare');}

  const admin=(STATE.utente||{}).Ruolo!=='operator';

  const tabs=[['detta','Detta']];
  if(admin)tabs.push(['attesa','Da confermare'+(attesa?(' ('+attesa+')'):'')]);
  tabs.push(['mie',admin?'Storico':'Quello che ho dettato']);
  const bar=tabs.map(t=>'<button class="btn '+(VOC_TAB===t[0]?'btn-accent':'btn-ghost')+'" onclick="vocTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  let corpo='';
  if(VOC_TAB==='attesa'&&admin)corpo=vocTabAttesa();
  else if(VOC_TAB==='mie')corpo=vocTabStorico(admin);
  else corpo=vocTabDetta();
  if(SOLO_DETTATURA)
    return '<h1 class="page-title" style="margin-bottom:10px">Detta</h1>'+vocTabDetta()
     +'<div style="margin-top:14px;text-align:center"><a href="'+att((APP_URL||'')||'#')+'" style="font-size:12.5px;color:var(--gray)">Apri tutto il magazzino</a></div>';
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">'
   +'<h1 class="page-title" style="margin:0">Dettatura vocale</h1>'
   +'<button class="btn btn-ghost" onclick="openMettiSulTelefono()">Metti sul telefono</button></div>'
   +'<div class="filters" style="gap:8px">'+bar+'</div>'
   +'<div id="vc-cont">'+corpo+'</div>';

}
// lettura veloce, fatta dall'app: gratis e istantanea, serve mentre parli
function vocAnteprima(){
  const t=(document.getElementById('vc-testo')||{}).value||'';
  VOC_RIGHE=vocInterpretaTutto(t);
  VOC_FONTE=VOC_RIGHE.length?'locale':'';
  vocDisegnaAnteprima();
}
// lettura fatta dall'IA: piu' brava, capisce il parlato storto
function vocAnalizzaIA(){
  const t=((document.getElementById('vc-testo')||{}).value||'').trim();
  if(!t){vocAnteprima();return;}
  if(!VOC_AI_ATTIVA){vocAnteprima();return;}
  VOC_ATTESA=true; vocDisegnaAnteprima();
  vocIAChiedi(t).then(function(righe){
    VOC_ATTESA=false;
    if(!righe.length){vocAnteprima();return;}
    righe.forEach(function(r,i){if(!r.Testo)r.Testo=t;});
    if(righe.length>1){const f=vocSpezza(t);righe.forEach(function(r,i){if(f[i])r.Testo=f[i];});}
    VOC_RIGHE=righe; VOC_FONTE='ia'; vocDisegnaAnteprima();
  }).catch(function(e){
    VOC_ATTESA=false; VOC_AI_MOTIVO=String((e&&e.message)||e);
    if(/non risulta installata/.test(VOC_AI_MOTIVO))VOC_AI_ATTIVA=false;
    vocAnteprima();
  });
}
function vocDisegnaAnteprima(){
  const box=document.getElementById('vc-prev'); if(!box)return;
  if(VOC_ATTESA){
    box.innerHTML='<div class="card" style="margin-top:12px;color:var(--gray)">Sto capendo quello che hai detto...</div>';
    return;
  }
  if(!VOC_RIGHE.length){box.innerHTML='';return;}
  const righe=VOC_RIGHE.map(function(r,i){
    const comm=r.Commessa?('<strong>'+att(r.Commessa)+'</strong> '+att(vocNomeComm(r.Commessa))):'<span style="color:var(--red)">commessa?</span>';
    let cosa='';
    if(r.Tipo==='ore')cosa=(r.Quantita||'?')+' ore';
    else if(r.Tipo==='voce')cosa=(r.Categoria||'spesa')+(r.Importo?(' &euro; '+euro(r.Importo)):'');
    else cosa=(r.Quantita||'?')+' '+(r.Unita||'')+' di '+(r.Articolo||'<span style="color:var(--red)">materiale?</span>')+(r.PezzoID?(' ['+r.PezzoID+']'):'');
    // se non e' sicuro, i bottoncini per scegliere al volo
    let scelte='';
    (r.scelteCommessa||[]).forEach(function(){});
    if((r.scelteCommessa||[]).length>1){
      scelte+='<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'
        +r.scelteCommessa.map(function(cid){
          const sel=cid===r.Commessa;
          return '<button class="btn '+(sel?'btn-accent':'btn-ghost')+'" onclick="vocScegli('+i+',\'Commessa\',\''+esc(cid)+'\')">'+att(cid)+' '+att(vocNomeComm(cid))+'</button>';
        }).join('')+'</div>';
    }
    if((r.scelteMateriale||[]).length>1){
      scelte+='<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'
        +r.scelteMateriale.map(function(nm){
          const sel=nm===r.Articolo;
          return '<button class="btn '+(sel?'btn-accent':'btn-ghost')+'" onclick="vocScegli('+i+',\'Articolo\',\''+esc(nm)+'\')">'+att(nm)+'</button>';
        }).join('')+'</div>';
    }
    return '<div style="padding:9px 0;border-top:1px solid var(--border)">'
     +'<div style="font-size:13.5px">'+cosa+' &rarr; '+comm+'</div>'
     +(r.Domanda?('<div style="font-size:12.5px;color:var(--accent);margin-top:3px;font-weight:600">'+r.Domanda+'</div>')
                :(r.Dubbi?('<div style="font-size:11.5px;color:var(--amber);margin-top:2px">'+r.Dubbi+'</div>'):''))
     +scelte+'</div>';
  }).join('');
  const fonte=VOC_FONTE==='ia'
    ? '<span style="color:var(--green)">letto dall\'intelligenza artificiale</span>'
    : '<span style="color:var(--amber)">letto dall\'app'+(VOC_AI_MOTIVO?(' &mdash; l\'IA non ha risposto: '+att(VOC_AI_MOTIVO)):'')+'</span>';
  box.innerHTML='<div class="card" style="margin-top:12px"><div class="card-title">Cosa ho capito</div>'
   +'<div style="font-size:12px;color:var(--gray);margin-bottom:2px">'+fonte+' &middot; sistemerà tutto l\'ufficio, tu manda pure.</div>'
   +righe
   +(VOC_AI_ATTIVA?'<button class="btn btn-ghost" style="margin-top:10px" onclick="vocAnalizzaIA()">Rileggi con l\'intelligenza artificiale</button>':'')
   +'</div>';
}
function vocNomeComm(id){
  const c=(STATE.commesse||[]).filter(x=>x.ID===id)[0];
  return (c&&c.Nome&&c.Nome!==c.ID)?('- '+c.Nome):'';
}
function vocScegli(i,campo,valore){
  if(!VOC_RIGHE[i])return;
  VOC_RIGHE[i][campo]=valore;
  if(campo==='Commessa'){VOC_RIGHE[i].Domanda='';VOC_RIGHE[i].Dubbi='';}
  if(campo==='Articolo'){
    VOC_RIGHE[i].ArticoloID='';
    const a=(STATE.articoli||[]).filter(x=>x.Nome===valore)[0];
    if(a){VOC_RIGHE[i].ArticoloID=a.ID;VOC_RIGHE[i].Unita=a.UnitaMisura||'';}
    VOC_RIGHE[i].Domanda='';
  }
  vocDisegnaAnteprima();
}
function vocInvia(){
  const t=((document.getElementById('vc-testo')||{}).value||'').trim();
  if(!t){showErr('vc-err','Non hai ancora detto niente.');return;}
  const righe=(VOC_RIGHE&&VOC_RIGHE.length)?VOC_RIGHE:vocInterpretaTutto(t);
  if(!righe.length){showErr('vc-err','Non ho capito niente di utile.');return;}
  const chi=(STATE.utente||{}).Nome||'';
  let fatti=0,errore='';
  righe.reduce(function(cat,r){
    return cat.then(function(){
      r.Utente=chi;
      return call('salvaDettatura',r).then(function(x){ if(x&&x.ok)fatti++; else errore=(x&&x.err)||'errore'; });
    });
  },Promise.resolve()).then(function(){
    if(!fatti){showErr('vc-err',errore||'Non sono riuscito a mandare niente.');return;}
    call('getDettature').then(function(d){
      STATE.dettature=d||[];
      const box=document.getElementById('vc-testo'); if(box)box.value='';
      VOC_FINALE='';VOC_RIGHE=[];VOC_FONTE='';
      toast(fatti===1?'Mandato in ufficio':(fatti+' righe mandate in ufficio'));
      renderPage('dettatura');
    });
  }).catch(e=>showErr('vc-err',String((e&&e.message)||e)));
}

function vocPezziDi(nome){
  if(!nome)return [];
  const out=[];
  (STATE.pannelli||[]).filter(p=>p.ArticoloID===nome&&(+p.M2_residuo>0))
    .forEach(p=>out.push({id:p.ID,resTxt:nfmt(+p.M2_residuo,2)+' m² liberi'}));
  (STATE.massicci||[]).filter(p=>p.ArticoloID===nome&&(+p.M3_residuo>0))
    .forEach(p=>out.push({id:p.ID,resTxt:nfmt(+p.M3_residuo,3)+' m³ liberi'}));
  return out.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
}
function vocCambiaTipo(i){
  const t=(document.getElementById('vd-tipo-'+i)||{}).value||'materiale';
  const box=(n,v)=>{const e=document.getElementById('vd-box-'+n+'-'+i);if(e)e.style.display=v?'':'none';};
  box('mat',t==='materiale');box('ore',t==='ore');box('voce',t==='voce');
}
function vocCambiaArticolo(i){
  const v=(document.getElementById('vd-art-'+i)||{}).value||'';
  const sel=document.getElementById('vd-pez-'+i), box=document.getElementById('vd-box-pez-'+i);
  if(!sel||!box)return;
  if(v.indexOf('ART|')===0){box.style.display='none';sel.innerHTML='<option value=""></option>';return;}
  const nome=v.slice(4);
  const pezzi=vocPezziDi(nome);
  sel.innerHTML='<option value="">- scegli il pezzo -</option>'+pezzi.map(p=>'<option value="'+att(p.id)+'">'+p.id+' - '+p.resTxt+'</option>').join('');
  box.style.display=pezzi.length?'':'none';
  const u=document.getElementById('vd-u-'+i);
  if(u&&!u.value)u.value=(v.indexOf('PAN|')===0)?'m²':'m³';
}
function vocConferma(i){
  const g=n=>((document.getElementById('vd-'+n+'-'+i)||{}).value||'').trim();
  const d=(STATE.dettature||[]).filter(x=>x.ID===i)[0]||{};
  const tipo=g('tipo');
  const dati={ID:i,Tipo:tipo,Commessa:g('comm'),Quantita:g('q'),Unita:g('u'),
    Note:g('note'),Testo:d.Testo||'',Data:d.Data};
  if(tipo==='materiale'){
    const a=g('art');
    if(!a){showErr('vd-err-'+i,'Scegli il materiale.');return;}
    if(a.indexOf('ART|')===0){dati.ArticoloID=a.slice(4);dati.Articolo=(STATE.articoli||[]).filter(x=>x.ID===dati.ArticoloID)[0]?.Nome||'';}
    else{
      dati.Articolo=a.slice(4);
      dati.PezzoID=g('pez');
      if(!dati.PezzoID){showErr('vd-err-'+i,'Scegli da quale pezzo esce il materiale.');return;}
    }
    if(!dati.Quantita||parseFloat(dati.Quantita)<=0){showErr('vd-err-'+i,'Metti la quantita.');return;}
    if(!dati.Commessa){showErr('vd-err-'+i,'Scegli la commessa: è quella che riceve il consumo.');return;}
  } else if(tipo==='ore'){
    dati.PersonaID=g('pers');
    if(!dati.PersonaID){showErr('vd-err-'+i,'Scegli di chi sono le ore.');return;}
    if(!dati.Quantita||parseFloat(dati.Quantita)<=0){showErr('vd-err-'+i,'Metti quante ore.');return;}
    if(!dati.Commessa){showErr('vd-err-'+i,'Scegli la commessa.');return;}
  } else {
    dati.Categoria=g('cat')||'Altro';
    dati.Importo=g('imp');
    if(!dati.Importo){showErr('vd-err-'+i,'Metti l\'importo.');return;}
    if(!dati.Commessa){showErr('vd-err-'+i,'Scegli la commessa.');return;}
    if(!dati.Note)dati.Note=d.Testo||'';
  }
  showErr('vd-err-'+i,'Sto registrando...');
  call('confermaDettatura',dati).then(function(r){
    if(!r||!r.ok){showErr('vd-err-'+i,(r&&r.err)||'Errore');return;}
    toast('Registrato');
    refreshApp();
  }).catch(e=>showErr('vd-err-'+i,String((e&&e.message)||e)));
}

}

function vociCont(){
  let list=vociDi(VOCI_COMM);
  if(VOCI_CAT)list=list.filter(v=>v.Categoria===VOCI_CAT);
  if(!list.length)return '<div class="card" style="color:var(--gray)">Nessuna voce. Usa "+ Nuova voce" per aggiungerne una.</div>';
  // riepilogo per categoria
  const perCat={};let tot=0;
  list.forEach(v=>{const k=v.Categoria||'Altro';perCat[k]=(perCat[k]||0)+(+v.Importo||0);tot+=(+v.Importo||0);});
  const riep='<div class="card" style="margin-bottom:14px"><div class="card-title">Totale '+(VOCI_COMM?('commessa '+VOCI_COMM):'di tutte le commesse')+'</div>'
    +Object.keys(perCat).sort().map(k=>'<div class="det-row"><span>'+k+'</span><span>&euro; '+euro(perCat[k])+'</span></div>').join("")
    +'<div class="det-row" style="border-bottom:none"><span style="font-weight:700">Totale</span><span style="font-weight:700">&euro; '+euro(tot)+'</span></div></div>';
  // raggruppa per commessa quando le vedo tutte
  const g={};list.forEach(v=>{(g[v.Commessa||'(senza commessa)']=g[v.Commessa||'(senza commessa)']||[]).push(v);});
  const blocchi=Object.keys(g).sort().map(function(c){
    const righe=g[c].sort((a,b)=>String(b.Data).localeCompare(String(a.Data))).map(function(v){
      const q=(v.Quantita!=null&&v.Quantita!=="")?(v.Quantita+' '+(v.Unita||'')):'';
      return '<div style="padding:11px 0;border-top:1px solid var(--border)">'
       +'<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px">'
       +'<div style="font-weight:600">'+v.Descrizione+' '+badgeStatoVoce(v.Stato)+(v.InOrdine?' <span class="badge badge-accent">negli ordini</span>':'')+'</div>'
       +'<div style="font-size:12px;color:var(--gray);margin-top:2px">'+v.Categoria+(v.Fornitore?(' &middot; '+v.Fornitore):'')+(q?(' &middot; '+q):'')+' &middot; '+String(v.Data||'').slice(0,10)+(v.NrFattura?(' &middot; ft. '+v.NrFattura):'')+'</div>'
       +(v.Note?'<div style="font-size:12px;color:var(--gray);font-style:italic;margin-top:2px">'+v.Note+'</div>':'')
       +'</div><div style="text-align:right;white-space:nowrap"><div style="font-weight:700">'+(v.Importo!=null&&v.Importo!==""?('&euro; '+euro(v.Importo)):'-')+'</div>'
       +'<div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end"><button class="btn btn-accent" onclick="openNuovaVoce(\''+esc(v.ID)+'\')">Modifica</button><button class="btn btn-red" onclick="confEliminaVoce(\''+esc(v.ID)+'\')">Elimina</button></div>'
       +'</div></div></div>';
    }).join("");
    const totC=g[c].reduce((s,v)=>s+(+v.Importo||0),0);
    return '<div class="card" style="margin-bottom:12px"><div class="card-title">'+(c==='(senza commessa)'?c:('Commessa '+c))+' &nbsp;<span style="font-weight:400;color:var(--gray)">'+g[c].length+' voci &middot; &euro; '+euro(totC)+'</span></div>'+righe+'</div>';
  }).join("");
  return riep+blocchi;
}

function updStock(){const a=STATE.articoli.find(x=>x.ID===comboVal('mov'));const b=document.getElementById("stk");if(a){b.style.display="block";document.getElementById("stk-v").textContent=a.Stock+" "+a.UnitaMisura;const f=document.getElementById("mov-forn");if(f&&!f.value)f.value=a.Fornitore||"";}else b.style.display="none";}
function submitMov(){
  const id=comboVal('mov'),t=document.getElementById("mov-tipo").value,q=parseFloat(document.getElementById("mov-qty").value),c=document.getElementById("mov-comm").value,n=document.getElementById("mov-note").value;
  const forn=t==='carico'?document.getElementById("mov-forn").value:"";
  const dest=(document.getElementById("mov-dest")||{}).value||"destina";
  if(!id||!q||q<=0){showErr("mov-err","Compila articolo e quantita.");return;}
  const a=STATE.articoli.find(x=>x.ID===id);
  if(t==="scarico"&&q>+a.Stock){showErr("mov-err","Stock insufficiente. Disponibile: "+a.Stock+" "+a.UnitaMisura);return;}
  // CARICO con commessa + "scarica subito": carico e poi scarico immediato nella commessa
  if(t==='carico'&&c&&dest==='scarica'){
    call("registraMovimento",{ArticoloID:id,Tipo:"carico",Quantita:q,Commessa:"",Note:n,Fornitore:forn}).then(r1=>{
      if(!r1.ok){showErr("mov-err",r1.err);return;}
      call("registraMovimento",{ArticoloID:id,Tipo:"scarico",Quantita:q,Commessa:c,Note:n||("Consumo diretto commessa "+c)}).then(r2=>{
        if(!r2.ok){showErr("mov-err",r2.err);return;}
        refreshDopoMov();toast("Caricato e scaricato subito nella commessa "+c);
      });
    });
    return;
  }
  // CARICO con commessa + "destina": carico normale + riserva alla commessa
  if(t==='carico'&&c&&dest==='destina'){
    call("registraMovimento",{ArticoloID:id,Tipo:"carico",Quantita:q,Commessa:"",Note:n,Fornitore:forn}).then(r1=>{
      if(!r1.ok){showErr("mov-err",r1.err);return;}
      call("assegnaArticoloSingolo",{artId:id,commessa:c,quantita:q}).then(()=>{
        refreshDopoMov();toast("Caricato e destinato alla commessa "+c);
      });
    });
    return;
  }
  // Caso normale (solo carico senza commessa, o scarico)
  call("registraMovimento",{ArticoloID:id,Tipo:t,Quantita:q,Commessa:c,Note:n,Fornitore:forn}).then(r=>{
    if(!r.ok){showErr("mov-err",r.err);return;}
    STATE.articoli=STATE.articoli.map(x=>x.ID===id?Object.assign({},x,{Stock:r.nuovoStock}):x);
    STATE.movimenti.push({ID:r.id,Data:new Date().toISOString().slice(0,19).replace("T"," "),Utente:STATE.utente.Nome,ArticoloID:id,NomeArticolo:a.Nome,Tipo:t,Quantita:q,UnitaMisura:a.UnitaMisura,Commessa:c,Note:n,Fornitore:forn,Annullato:"NO"});
    closeModal();toast((t==='carico'?'Carico':'Scarico')+" registrato");renderPage(STATE.pagina);
    if(t==='scarico'&&c)setTimeout(function(){call("getRiserve").then(rs=>{const r2=(rs||[]).find(x=>x.ArticoloID===id&&x.Commessa===c);if(r2&&r2.Quantita>0)promptRiserva(id,c,r2.Quantita,a.UnitaMisura);});},300);
  });
}
function refreshDopoMov(){
  Promise.all([call("getArticoli"),call("getMovimenti"),call("getRiserve")]).then(([a,m,ri])=>{STATE.articoli=a||[];STATE.movimenti=m||[];STATE.riserve=ri||[];closeModal();renderPage(STATE.pagina);});

function cpDestChange(){const c=document.getElementById("cp-comm").value;const w=document.getElementById("cp-destwrap");if(w)w.style.display=c?'block':'none';}
function cpTipoChange(){
  hintNome('cp-tipo','cp-hint','pannello');
  const v=(document.getElementById("cp-tipo").value||"").trim();
  if(!v)return;
  // riprende fornitore e misure dai pannelli gia caricati dello stesso tipo
  const a=STATE.articoli.find(x=>x.ID===v||x.Nome===v);
  const f=document.getElementById("cp-forn");
  const ult=STATE.pannelli.filter(p=>p.ArticoloID===v).slice(-1)[0];
  if(f&&!f.value)f.value=(ult&&ult.Fornitore)||(a&&a.Fornitore)||"";
  if(ult){
    const w=document.getElementById("cp-w"),h=document.getElementById("cp-h");
    if(w&&!w.value&&ult.Larghezza_mm)w.value=ult.Larghezza_mm;
    if(h&&!h.value&&ult.Altezza_mm)h.value=ult.Altezza_mm;
    cpPrev();
  }
}
function cpPrev(){const w=+document.getElementById("cp-w").value,h=+document.getElementById("cp-h").value,q=+document.getElementById("cp-q").value,f=+document.getElementById("cp-f").value,p=document.getElementById("cp-prev");
  if(w&&h&&q&&f){p.style.display="block";p.innerHTML='Crea P'+String(f).padStart(4,"0")+' - P'+String(f+q-1).padStart(4,"0")+' ('+((w/1000)*(h/1000)*q).toFixed(2)+' m2 totali)';}else p.style.display="none";}
function submitCP(){
  const tipo=document.getElementById("cp-tipo").value.trim(),w=document.getElementById("cp-w").value,h=document.getElementById("cp-h").value,q=document.getElementById("cp-q").value,f=document.getElementById("cp-f").value,forn=document.getElementById("cp-forn").value;
  if(!tipo){showErr("cp-err","Scrivi o scegli il tipo di pannello.");return;}
  const d={ArticoloID:tipo,Larghezza_mm:w,Altezza_mm:h,Quantita:q,PrimoID:f,Fornitore:forn,Note:document.getElementById("cp-note").value};
  if(!w||!h||!q||!f){showErr("cp-err","Compila dimensioni, quantita e primo ID.");return;}
  call("caricaPannelli",d).then(r=>{
    if(!r.ok){showErr("cp-err",r.err||"Errore.");return;}
    const c=document.getElementById("cp-comm").value;
    const dest=(document.getElementById("cp-dest")||{}).value||"destina";
    const ids=r.ids||[];
    if(c&&ids.length){
      // Destina o scarica i pannelli appena creati
      const azione=dest==='scarica'
        ? ids.map(pid=>call("scaricaPannelloTotale",{PannelloID:pid,Commessa:c,Note:"Consumo diretto commessa "+c}))
        : ids.map(pid=>call("assegnaPezzoSingolo",{tipo:"pannello",id:pid,commessa:c}));
      Promise.all(azione).then(()=>{
        Promise.all([call("getPannelli"),call("getMovimenti")]).then(([pn,mv])=>{STATE.pannelli=pn||[];STATE.movimenti=mv||[];closeModal();toast(dest==='scarica'?("Caricati e scaricati "+ids.length+" pannelli nella commessa "+c):("Caricati "+ids.length+" pannelli destinati a "+c));renderPage(STATE.pagina);});
      });
      return;
    }
    closeModal();toast("Caricati "+q+" pannelli - "+r.totM2+" m2");
    Promise.all([call("getPannelli"),call("getArticoli")]).then(([pn,ar])=>{STATE.pannelli=pn||[];STATE.articoli=ar||[];renderPage(STATE.pagina);});
  });
}

// -- COMBOBOX con suggerimenti --
let COMBO={}, COMBOCB={};
function comboInit(idBase,items,cb){COMBO[idBase]=items||[];COMBOCB[idBase]=cb||null;}
function comboHTML(idBase,placeholder,valId,valLabel){
  return '<div style="position:relative"><input id="'+idBase+'-q" value="'+(valLabel||"").replace(/"/g,"&quot;")+'" placeholder="'+placeholder+'" autocomplete="off" oninput="comboFilter(\''+idBase+'\')" onfocus="comboShow(\''+idBase+'\')"><input type="hidden" id="'+idBase+'-val" value="'+(valId||"")+'"><div id="'+idBase+'-list" class="combo-list" style="display:none"></div></div>';
}
function comboFilter(idBase){
  const q=(document.getElementById(idBase+"-q").value||"").toLowerCase();
  const all=(COMBO[idBase]||[]).filter(it=>it.label.toLowerCase().indexOf(q)>=0);
  const items=all.slice(0,300);
  const list=document.getElementById(idBase+"-list");
  let html=items.map(it=>'<div class="combo-item" style="display:flex;align-items:center;gap:9px" onclick="comboPick(\''+idBase+'\',\''+esc(it.id)+'\')">'+(it.img?'<img src="'+it.img+'" referrerpolicy="no-referrer" style="width:34px;height:34px;object-fit:cover;border-radius:6px;flex-shrink:0">':'<div style="width:34px;height:34px;border-radius:6px;background:var(--accent-light);flex-shrink:0"></div>')+'<span>'+it.label+'</span></div>').join("");
  if(all.length>items.length)html+='<div class="combo-item" style="color:var(--gray);font-size:12px;text-align:center">...e altri '+(all.length-items.length)+'. Scrivi per filtrare.</div>';
  if(!items.length)html='<div class="combo-item" style="color:var(--gray)">'+(idBase==='fb'?'Nessun tipo esistente — scrivi un nome per crearne uno nuovo, poi compila le misure.':'Nessun risultato')+'</div>';
  list.innerHTML=html;
  list.style.display="block";
}
function comboShow(idBase){comboFilter(idBase);}
function comboPick(idBase,id){const it=(COMBO[idBase]||[]).find(x=>x.id===id);document.getElementById(idBase+"-val").value=id;document.getElementById(idBase+"-q").value=it?it.label:id;document.getElementById(idBase+"-list").style.display="none";if(COMBOCB[idBase])COMBOCB[idBase]();}
function comboVal(idBase){return document.getElementById(idBase+"-val").value;}

// -- IMMAGINI --
function imgUrlFor(rifId){const x=(STATE.immagini||[]).find(i=>i.RifID===rifId);return x?x.ThumbUrl:"";}
function imgBlock(rifId){
  const url=imgUrlFor(rifId);
  let h='<div style="text-align:center;margin-bottom:14px">';
  if(url)h+='<img src="'+url+'" referrerpolicy="no-referrer" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--border)"><br>';
  else h+='<div style="height:80px;display:flex;align-items:center;justify-content:center;background:var(--accent-light);border-radius:12px;color:var(--accent);font-size:13px;margin-bottom:8px">Nessuna immagine</div>';
  h+='<button class="btn btn-ghost" onclick="caricaImmagine(\''+esc(rifId)+'\')">'+(url?'Cambia immagine':'Carica immagine')+'</button>';
  if(url)h+=' <button class="btn btn-red" onclick="rimuoviImmagine(\''+esc(rifId)+'\')">Rimuovi</button>';
  return h+'</div>';
}
function caricaImmagine(rifId){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){const f=inp.files[0]; if(!f)return; if(f.size>5000000){toast("Immagine troppo grande (max 5MB)","err");return;}
    const rd=new FileReader();
    rd.onload=function(){const b64=String(rd.result).split(",")[1]; toast("Caricamento immagine...");
      call("salvaImmagine",{rifId:rifId,base64:b64,mime:f.type,nome:rifId}).then(r=>{if(!r.ok){toast(r.err||"Errore","err");return;}
        call("getImmagini").then(im=>{STATE.immagini=im||[];toast("Immagine salvata");
          if(CURRENT_DETAIL)openDettaglio(CURRENT_DETAIL.tipo,CURRENT_DETAIL.id); else renderPage(STATE.pagina);});
      });
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function rimuoviImmagine(rifId){call("eliminaImmagine",{rifId:rifId}).then(()=>{call("getImmagini").then(im=>{STATE.immagini=im||[];toast("Immagine rimossa");if(CURRENT_DETAIL)openDettaglio(CURRENT_DETAIL.tipo,CURRENT_DETAIL.id);else renderPage(STATE.pagina);});});}

function submitModificaPezzo(tipo,id){

// -- ELIMINA ELEMENTO --
function confElimina(tipo,id){
  const extra=tipo==='articolo'?'<br>Verranno eliminati anche eventuali pannelli/massicci collegati a questo tipo.':'';
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Elimina '+tipo+'</h2><div class="alert alert-red">Stai per eliminare definitivamente <strong>'+id+'</strong>. L\'operazione non e reversibile.'+extra+'</div><div id="el-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitElimina(\''+tipo+'\',\''+esc(id)+'\')">Elimina definitivamente</button></div>');
}
function submitElimina(tipo,id){
  const fn=tipo==='articolo'?'eliminaArticolo':tipo==='pannello'?'eliminaPannello':'eliminaMassiccio';
  call(fn,{id:id}).then(r=>{if(!r.ok){showErr("el-err",r.err||"Errore");return;}
    closeModal();toast("Eliminato: "+id);
    Promise.all([call("getArticoli"),call("getPannelli"),call("getMassicci"),call("getMovimenti")]).then(([a,p,m,mv])=>{STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];STATE.movimenti=mv||[];renderPage(STATE.pagina);});
  });
}

// -- MODIFICA MOVIMENTO --
function openModificaMovimento(id){
  const m=STATE.movimenti.find(x=>x.ID===id); if(!m)return;
  const pezzi=String(m.PezzoID||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(m.Tipo==='carico'&&pezzi.length&&pezzi[0].charAt(0)==='P')return openModCaricoPannelli(id,pezzi);
  if(m.Tipo==='carico'&&pezzi.length&&pezzi[0].charAt(0)==='M')return openModCaricoMassicci(id,pezzi);
  const haPezzi=pezzi.length>0;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica movimento</h2>'
   +'<div class="info-box">'+m.NomeArticolo+' - '+m.Tipo+'</div>'
   +(haPezzi?'<div class="info-box">Movimento legato a un pezzo: puoi correggere fornitore, commessa e note.</div>':'<div class="form-group"><label>Quantita ('+m.UnitaMisura+')</label><input type="number" step="any" id="mm-q" value="'+m.Quantita+'"></div>')
   +'<div class="form-group"><label>Fornitore</label><input id="mm-forn" value="'+(m.Fornitore||'').replace(/"/g,"&quot;")+'"></div>'
   +'<div class="form-group"><label>Commessa</label><select id="mm-comm" onchange="onCommessaChange(\'mm-comm\')">'+optCommesse(m.Commessa)+'</select></div>'
   +'<div class="form-group"><label>Note</label><input id="mm-note" value="'+(m.Note||'').replace(/"/g,"&quot;")+'"></div>'
   +'<div id="mm-err"></div><button class="btn-primary" onclick="submitModificaMovimento(\''+esc(id)+'\')">Salva modifiche</button></div>');
}
function openModCaricoPannelli(id,pezzi){
  const m=STATE.movimenti.find(x=>x.ID===id);
  const art=STATE.articoli.find(a=>a.ID===m.ArticoloID);
  const first=STATE.pannelli.find(p=>pezzi.indexOf(p.ID)>=0)||{};
  const primo=parseInt(String(pezzi[0]).replace("P",""))||1;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica carico pannelli</h2>'
   +'<div class="info-box">Tipo: <strong>'+(art?art.Nome:m.ArticoloID)+'</strong>. Salvando, i pezzi di questo carico vengono ricreati con i nuovi dati.</div>'
   +'<div class="form-row"><div class="form-group"><label>Larghezza mm *</label><input type="number" id="mcp-w" value="'+(first.Larghezza_mm||'')+'"></div><div class="form-group"><label>Altezza mm *</label><input type="number" id="mcp-h" value="'+(first.Altezza_mm||'')+'"></div></div>'
   +'<div class="form-row"><div class="form-group"><label>N. pannelli *</label><input type="number" id="mcp-q" min="1" value="'+pezzi.length+'"></div><div class="form-group"><label>Primo ID *</label><input type="number" id="mcp-f" value="'+primo+'"></div></div>'
   +'<div class="form-group"><label>Fornitore</label><input id="mcp-forn" value="'+((first.Fornitore||m.Fornitore||'')+'').replace(/"/g,"&quot;")+'"></div>'
   +'<div id="mcp-err"></div><button class="btn-primary" onclick="submitModCaricoPannelli(\''+esc(id)+'\')">Salva modifiche</button></div>');
}
function submitModCaricoPannelli(id){
  const d={movId:id,Larghezza_mm:document.getElementById("mcp-w").value,Altezza_mm:document.getElementById("mcp-h").value,Quantita:document.getElementById("mcp-q").value,PrimoID:document.getElementById("mcp-f").value,Fornitore:document.getElementById("mcp-forn").value};
  call("modificaCaricoPannelli",d).then(r=>{if(!r.ok){showErr("mcp-err",r.err||"Errore");return;}
    Promise.all([call("getPannelli"),call("getArticoli"),call("getMovimenti")]).then(([p,a,mv])=>{STATE.pannelli=p||[];STATE.articoli=a||[];STATE.movimenti=mv||[];closeModal();toast("Carico modificato");renderPage(STATE.pagina);});
  });
}
function openModCaricoMassicci(id,pezzi){
  const m=STATE.movimenti.find(x=>x.ID===id);
  const art=STATE.articoli.find(a=>a.ID===m.ArticoloID);
  const first=STATE.massicci.find(p=>pezzi.indexOf(p.ID)>=0)||{};
  const primo=parseInt(String(pezzi[0]).replace("M",""))||1;
  const isMis=!!first.Lunghezza_mm;
  openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Modifica carico massiccio</h2>'
   +'<div class="info-box">Tipo: <strong>'+(art?art.Nome:m.ArticoloID)+'</strong>. Salvando, i pezzi vengono ricreati con i nuovi dati.</div>'
   +'<div class="toggle"><button id="mcm-tm" class="'+(isMis?'on-accent':'')+'" onclick="mcmModo(\'misure\')">Da misure</button><button id="mcm-tt" class="'+(isMis?'':'on-accent')+'" onclick="mcmModo(\'totale\')">m3 diretti</button></div>'
   +'<input type="hidden" id="mcm-modo" value="'+(isMis?'misure':'totale')+'">'
   +'<div id="mcm-misure" style="'+(isMis?'':'display:none')+'"><div class="form-row-3"><div class="form-group"><label>Lungh. mm *</label><input type="number" id="mcm-l" value="'+(first.Lunghezza_mm||'')+'"></div><div class="form-group"><label>Largh. mm *</label><input type="number" id="mcm-w" value="'+(first.Larghezza_mm||'')+'"></div><div class="form-group"><label>Spess. mm *</label><input type="number" id="mcm-s" value="'+(first.Spessore_mm||'')+'"></div></div><div class="form-group"><label>N. pezzi *</label><input type="number" id="mcm-q" min="1" value="'+pezzi.length+'"></div></div>'
   +'<div id="mcm-totale" style="'+(isMis?'display:none':'')+'"><div class="form-group"><label>m3 totali *</label><input type="number" step="any" id="mcm-m3" value="'+(first.M3_originale||'')+'"></div></div>'
   +'<div class="form-group"><label>Primo ID *</label><input type="number" id="mcm-f" value="'+primo+'"></div>'
   +'<div class="form-group"><label>Fornitore</label><input id="mcm-forn" value="'+((first.Fornitore||m.Fornitore||'')+'').replace(/"/g,"&quot;")+'"></div>'
   +'<div id="mcm-err"></div><button class="btn-primary" onclick="submitModCaricoMassicci(\''+esc(id)+'\')">Salva modifiche</button></div>');
}
function mcmModo(mo){document.getElementById("mcm-modo").value=mo;document.getElementById("mcm-tm").className=mo==='misure'?'on-accent':'';document.getElementById("mcm-tt").className=mo==='totale'?'on-accent':'';document.getElementById("mcm-misure").style.display=mo==='misure'?'block':'none';document.getElementById("mcm-totale").style.display=mo==='totale'?'block':'none';}
function submitModCaricoMassicci(id){
  const modo=document.getElementById("mcm-modo").value;
  const d={movId:id,modo:modo,PrimoID:document.getElementById("mcm-f").value,Fornitore:document.getElementById("mcm-forn").value};
  if(modo==='misure'){d.Lunghezza_mm=document.getElementById("mcm-l").value;d.Larghezza_mm=document.getElementById("mcm-w").value;d.Spessore_mm=document.getElementById("mcm-s").value;d.Quantita=document.getElementById("mcm-q").value;}
  else d.M3totale=document.getElementById("mcm-m3").value;
  call("modificaCaricoMassicci",d).then(r=>{if(!r.ok){showErr("mcm-err",r.err||"Errore");return;}
    Promise.all([call("getMassicci"),call("getArticoli"),call("getMovimenti")]).then(([p,a,mv])=>{STATE.massicci=p||[];STATE.articoli=a||[];STATE.movimenti=mv||[];closeModal();toast("Carico modificato");renderPage(STATE.pagina);});
  });
}
function submitModificaMovimento(id){
  const m=STATE.movimenti.find(x=>x.ID===id); if(!m)return;
  const haPezzi=String(m.PezzoID||"").trim()!=="";
  const d={movId:id,Commessa:document.getElementById("mm-comm").value,Fornitore:document.getElementById("mm-forn").value,Note:document.getElementById("mm-note").value};
  if(!haPezzi){const q=document.getElementById("mm-q"); if(q)d.Quantita=q.value;}
  call("modificaMovimento",d).then(r=>{if(!r.ok){showErr("mm-err",r.err||"Errore");return;}
    Promise.all([call("getMovimenti"),call("getArticoli")]).then(([mv,a])=>{STATE.movimenti=mv||[];STATE.articoli=a||[];closeModal();toast("Movimento aggiornato");renderPage(STATE.pagina);});
  });
}

// -- RICERCA DIGITABILE NELLE TENDINE --
function filtraOpzioni(selId,q){
  const s=document.getElementById(selId); if(!s)return;
  q=(q||"").toLowerCase();
  for(let i=0;i<s.options.length;i++){const o=s.options[i];if(o.value==="")continue;o.hidden=o.text.toLowerCase().indexOf(q)<0;}
}
function openAnnulla(mid){openModal('<div class="modal"><button class="modal-close" onclick="closeModal()">&times;</button><h2>Annulla movimento</h2><div class="alert alert-amber">L\'annullamento inverte lo stock e restituisce i m2/m3 al pezzo scaricato.</div><div class="form-group"><label>Motivo *</label><textarea id="an-n" rows="3" placeholder="es. inserimento errato"></textarea></div><div id="an-err"></div><button class="btn-primary" style="background:var(--red)" onclick="submitAnnulla(\''+mid+'\')">Conferma annullamento</button></div>');}
function submitAnnulla(mid){const n=document.getElementById("an-n").value.trim();if(!n){showErr("an-err","Inserisci il motivo.");return;}
  call("annullaMovimento",{movId:mid,nota:n}).then(r=>{if(!r.ok){showErr("an-err",r.err||"Errore.");return;}
    Promise.all([call("getMovimenti"),call("getArticoli"),call("getPannelli"),call("getMassicci")]).then(([mv,a,p,m])=>{
      STATE.movimenti=mv||[];STATE.articoli=a||[];STATE.pannelli=p||[];STATE.massicci=m||[];
      closeModal();toast("Movimento annullato"+(r.pezziRipristinati?(" - ripristinati "+r.pezziRipristinati+" pezzi"):""));renderPage(STATE.pagina);});
  });}
</script>
